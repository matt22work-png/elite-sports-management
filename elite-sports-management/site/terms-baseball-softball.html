const LANGS = ["en","es","it"];
let lang = (()=>{ try{ const s=localStorage.getItem("esm_lang"); return LANGS.includes(s)?s:"en"; }catch(e){ return "en"; } })();

function t(k){ return (DICT[lang]&&DICT[lang][k]) || DICT.en[k] || ""; }

function render(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.getAttribute("data-i18n");
    const v = t(k);
    // tb_xlnote and the body are trusted authored HTML; everything else is plain text.
    if(k==="tb_xlnote" || k==="tb_body") el.innerHTML = v; else el.textContent = v;
  });
  document.getElementById("tbBody").innerHTML = t("tb_body");
  // The translation notice exists for EN/ES only — the Italian text is the binding original.
  const note = document.getElementById("xlnote");
  const hasNote = !!(DICT[lang] && DICT[lang].tb_xlnote);
  note.hidden = !hasNote;
  document.title = t("tb_h1") + " — ESM Sports Network";
  document.querySelectorAll("#langsw button").forEach(b=>{
    b.classList.toggle("on", b.dataset.l===lang);
  });
}

document.getElementById("langsw").addEventListener("click", e=>{
  const b = e.target.closest("button[data-l]");
  if(!b) return;
  lang = b.dataset.l;
  try{ localStorage.setItem("esm_lang", lang); }catch(err){}
  render();
});

render();
