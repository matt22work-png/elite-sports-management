<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<!-- iOS Safari auto-detects number strings (e.g. the "$49.99" roster price) as phone
     numbers and turns them into tappable links; scrolling/tapping then surfaces an
     unwanted iOS action sheet. Disable data detectors so it never happens in any locale. -->
<meta name="format-detection" content="telephone=no" />
<title>Elite Sports Management — Athlete Representation</title>
<meta name="description" content="Elite Sports Management — baseball and softball athlete representation and development across college recruiting, independent pro ball and Europe. Founded by professional baseball player Samuele Bruno (Hastings College NAIA, scholarship athlete, class of 2027). Browse the roster, upcoming events and individual athlete profiles." />
<link rel="canonical" href="https://elite-sports-management.vercel.app/" />

<!-- Open Graph / Twitter share cards so links unfurl with a title, description and image
     instead of a bare URL. og:image is a placeholder (an existing 1600x900 team photo) —
     swap in a dedicated 1200x630 branded card when one exists. Tags are English-only:
     social scrapers read the raw HTML and don't run the JS i18n. -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Elite Sports Management" />
<meta property="og:title" content="Elite Sports Management — Athlete Representation" />
<meta property="og:description" content="Baseball and softball athlete representation and development — college recruiting, independent pro ball, winter leagues and Europe. Browse the roster and upcoming events." />
<meta property="og:url" content="https://elite-sports-management.vercel.app/" />
<meta property="og:image" content="https://elite-sports-management.vercel.app/media/photos/twl-champions.jpg" />
<meta property="og:image:width" content="1600" />
<meta property="og:image:height" content="900" />
<meta property="og:image:alt" content="Elite Sports Management athletes — champions at the Tenerife Winter League" />
<meta property="og:locale" content="en_US" />
<meta property="og:locale:alternate" content="es_ES" />
<meta property="og:locale:alternate" content="it_IT" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Elite Sports Management — Athlete Representation" />
<meta name="twitter:description" content="Baseball and softball athlete representation — college, pro ball, winter leagues and Europe." />
<meta name="twitter:image" content="https://elite-sports-management.vercel.app/media/photos/twl-champions.jpg" />

<!-- Structured data: helps search engines and social platforms understand the brand. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SportsOrganization",
  "name": "Elite Sports Management",
  "alternateName": "ESM",
  "url": "https://elite-sports-management.vercel.app/",
  "logo": "https://elite-sports-management.vercel.app/logo.png",
  "image": "https://elite-sports-management.vercel.app/media/photos/twl-champions.jpg",
  "description": "Baseball and softball athlete representation and development — college recruiting, independent pro ball, winter leagues and Europe.",
  "sport": ["Baseball", "Softball"],
  "founder": { "@type": "Person", "name": "Samuele Bruno" },
  "sameAs": ["https://instagram.com/elite_sports_management__"],
  "contactPoint": {
    "@type": "ContactPoint",
    "contactType": "customer service",
    "email": "elitesportsmanagement50@gmail.com",
    "availableLanguage": ["English", "Spanish", "Italian"]
  }
}
</script>

<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
<link rel="shortcut icon" href="icons/icon-192.png" />
<meta name="theme-color" content="#081a33" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ESM" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--navy:#081a33;--navy-2:#06142a;--navy-3:#0d2547;--gold:#d9b154;--gold-soft:#e7c878;--teal:#3a9aa6;--teal-soft:#5fb8c2;--ink:#eaf0fa;--muted:#9fb1cc;--line:rgba(217,177,84,.22);--card:#0c2143}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Hanken Grotesk',system-ui,sans-serif;background:var(--navy-2);color:var(--ink);line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  .display{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:.01em;line-height:.92;text-transform:uppercase}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px}
  .bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none}
  .bg-fx::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 500px at 78% -10%,rgba(217,177,84,.16),transparent 60%),radial-gradient(800px 600px at 8% 110%,rgba(20,70,140,.30),transparent 55%),linear-gradient(180deg,var(--navy),var(--navy-2))}
  .bg-fx::after{content:"";position:absolute;inset:0;opacity:.04;background-image:repeating-linear-gradient(135deg,#fff 0 1px,transparent 1px 9px)}

  /* iOS PWA: status-bar-style is black-translucent + viewport-fit=cover, so page
     content draws UNDER the status bar. Pad the sticky header down by the top
     safe-area inset (0px fallback off-notch) so the nav clears the clock/battery. */
  header.nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(10px);background:rgba(6,20,42,.72);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
  .nav-in{display:flex;align-items:center;justify-content:space-between;height:64px;gap:14px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:800}
  .logo{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#10305c,#06142a);font-family:'Anton';font-size:13px;color:var(--gold);position:relative}
  .logo span{position:absolute;top:-3px;font-size:9px}
  .logo-img{height:40px;width:auto;display:block}
  .foot-logo{height:64px;width:auto;display:block;margin-bottom:8px}
  .brand b{font-size:14px}.brand small{display:block;font-size:8.5px;letter-spacing:.3em;color:var(--gold-soft);font-weight:700}
  .nav-right{display:flex;align-items:center;gap:18px}
  .nav-links{display:flex;gap:22px;font-size:14px;font-weight:600}
  .nav-links a{color:var(--muted);transition:.2s}.nav-links a:hover{color:var(--gold-soft)}
  .lang{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:3px}
  .lang button{background:transparent;border:0;color:var(--muted);font-weight:700;font-size:12px;padding:5px 9px;border-radius:999px;cursor:pointer}
  .lang button.on{background:var(--gold);color:#05101f}
  .nav-cta{border:1px solid var(--gold);color:var(--gold-soft);padding:9px 15px;border-radius:999px;font-size:13px;font-weight:700;transition:.2s;white-space:nowrap}
  .nav-cta:hover{background:var(--gold);color:#05101f}
  /* Sign In dropdown — native <details>, styled to sit between the language switch and the CTA */
  .signin{position:relative}
  .signin>summary{list-style:none;cursor:pointer;color:var(--muted);font-size:13px;font-weight:700;padding:9px 4px;transition:.2s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;user-select:none}
  .signin>summary::-webkit-details-marker{display:none}
  .signin>summary::after{content:"";width:6px;height:6px;border-right:2px solid var(--gold-soft);border-bottom:2px solid var(--gold-soft);transform:rotate(45deg) translateY(-2px);transition:transform .2s;opacity:.8}
  .signin[open]>summary::after{transform:rotate(-135deg) translateY(-1px)}
  .signin>summary:hover,.signin[open]>summary{color:var(--gold-soft)}
  .signin-menu{position:absolute;right:0;top:calc(100% + 10px);min-width:190px;display:flex;flex-direction:column;gap:2px;background:rgba(6,20,42,.98);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 14px 34px rgba(0,0,0,.45);z-index:60}
  .signin-menu a{color:var(--muted);font-size:14px;font-weight:600;padding:10px 12px;border-radius:8px;transition:.15s;white-space:nowrap}
  .signin-menu a:hover,.signin-menu a:focus-visible{background:rgba(217,177,84,.12);color:var(--gold-soft)}
  @media(max-width:860px){.nav-links{display:none}}
  /* Small phones: with the nav links gone, the header holds brand + language +
     Sign In + Apply. Tighten spacing/padding so it never overflows down to ~320px. */
  @media(max-width:560px){
    .nav-right{gap:9px}
    .lang{padding:2px}
    .lang button{padding:5px 7px;font-size:11px}
    .signin>summary{font-size:12px;padding:8px 2px;gap:4px}
    .nav-cta{padding:8px 11px;font-size:12px}
    .signin-menu{min-width:172px}
  }
  @media(max-width:380px){
    .logo-img{height:32px}
    .nav-right{gap:7px}
    .lang button{padding:5px 6px}
    .nav-cta{padding:7px 9px}
  }

  .hero{position:relative;z-index:1;padding:58px 0 46px}
  .eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-soft);border:1px solid var(--line);padding:7px 14px;border-radius:999px;margin-bottom:26px}
  .eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--teal-soft);box-shadow:0 0 12px var(--teal)}
  .hero h1{font-size:clamp(40px,8vw,86px);max-width:14ch}.hero h1 em{color:var(--gold);font-style:normal}
  .hero p.lead{margin-top:24px;max-width:56ch;font-size:clamp(16px,2.2vw,20px);color:var(--muted)}
  .hero-btns{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap}
  .btn{padding:14px 26px;border-radius:999px;font-weight:700;font-size:15px;transition:.22s;cursor:pointer;border:0;display:inline-block}
  .btn-gold{background:var(--gold);color:#05101f}.btn-gold:hover{background:var(--gold-soft);transform:translateY(-2px)}
  .btn-ghost{border:1px solid var(--line);color:var(--ink)}.btn-ghost:hover{border-color:var(--gold);color:var(--gold-soft)}
  /* Keyboard focus indicator — visible for keyboard/AT users, not on mouse click. */
  a:focus-visible,button:focus-visible,.chip:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

  .stats{position:relative;z-index:1;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(8,26,51,.5)}
  .stats-in{display:grid;grid-template-columns:repeat(3,1fr)}
  .stat{padding:30px 18px;text-align:center;border-right:1px solid var(--line)}.stat:last-child{border-right:0}
  .stat b{font-family:'Anton';font-size:clamp(34px,6vw,56px);color:var(--gold);display:block;line-height:1}
  .stat span{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}

  section{position:relative;z-index:1}.sec{padding:64px 0}
  .sec-head{margin-bottom:42px}
  .kicker{font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--teal-soft)}
  .sec-head h2{font-size:clamp(32px,5.5vw,58px);margin-top:12px;max-width:20ch}
  .sec-head p{color:var(--muted);max-width:62ch;margin-top:14px;font-size:16.5px}

  /* Fixed 3-up so the 6 services land as a clean 3 + 3 instead of 5 + an orphan. */
  .do-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:860px){.do-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.do-grid{grid-template-columns:1fr}}
  .do{padding:24px 20px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,var(--card),rgba(8,26,51,.4));transition:.25s;display:flex;flex-direction:column}
  .do:hover{transform:translateY(-4px);border-color:var(--gold)}
  .do .ic{font-size:22px;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:rgba(217,177,84,.12);border:1px solid var(--line);margin-bottom:15px}
  .do h3{font-size:17px;margin-bottom:7px}.do p{color:var(--muted);font-size:14px}
  .do-price{margin:12px 0 8px;font-size:13.5px;color:var(--muted)}
  .do-price b{font-family:'Anton';font-size:22px;color:var(--gold);letter-spacing:.01em;margin-right:5px}
  .do-bul{list-style:none;margin:0 0 4px;padding:0;display:grid;gap:6px}
  .do-bul li{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted)}
  .do-bul li::before{content:"✓";color:var(--teal-soft);font-weight:800;flex:none}
  .do-hl{margin-top:12px;padding:10px 12px;border:1px solid rgba(217,177,84,.35);border-radius:10px;background:rgba(217,177,84,.07)}
  .do-hl b{display:block;color:var(--gold-soft);font-size:12px;font-weight:800;letter-spacing:.03em;margin-bottom:3px}
  .do-hl span{color:var(--muted);font-size:12.5px;line-height:1.5}
  .svc-pay{display:inline-block;margin-top:auto;padding-top:14px;font-size:12.5px;font-weight:700;color:var(--gold);letter-spacing:.03em;align-self:flex-start}
  .svc-pay:hover{color:var(--gold-soft)}

  .founder{display:grid;grid-template-columns:200px 1fr;gap:34px;align-items:center;border:1px solid var(--line);border-radius:20px;padding:34px;background:radial-gradient(circle at 12% 20%,rgba(217,177,84,.10),transparent 55%),linear-gradient(180deg,var(--card),var(--navy-2))}
  @media(max-width:640px){.founder{grid-template-columns:1fr;text-align:center}}
  .founder .mono{font-family:'Anton';font-size:70px;color:var(--gold);width:180px;height:180px;border-radius:50%;border:2px solid rgba(217,177,84,.4);display:grid;place-items:center;background:rgba(6,20,42,.5);margin:0 auto;background-size:cover;background-position:center}
  .founder h3{font-size:clamp(26px,5vw,40px)}
  .founder .role{color:var(--gold-soft);font-weight:700;margin-top:4px}
  .founder p{color:var(--muted);margin-top:14px;font-size:16px;max-width:62ch}
  .creds{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
  @media(max-width:640px){.creds{justify-content:center}}
  .cred{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:999px;border:1px solid var(--line);color:#cdd9ec;background:rgba(8,26,51,.5)}
  .founder-contact{display:inline-flex;align-items:center;gap:9px;margin-top:20px;padding:11px 20px;border-radius:999px;border:1px solid var(--line);color:var(--gold-soft);font-weight:700;font-size:13.5px;transition:.22s}
  .founder-contact:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-2px)}
  .founder-contact .ic{font-size:15px;line-height:1}

  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px}
  .chip{padding:9px 17px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:700;font-size:13.5px;cursor:pointer;transition:.18s}
  .chip:hover{color:var(--ink)}.chip.active{background:var(--gold);color:#05101f;border-color:var(--gold)}
  .roster{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  @media(max-width:900px){.roster{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.roster{grid-template-columns:1fr}}
  .pcard{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;background:linear-gradient(180deg,var(--card),var(--navy-2));transition:.25s;text-align:left;width:100%}
  .pcard:hover{transform:translateY(-5px);border-color:var(--gold);box-shadow:0 18px 40px -20px rgba(0,0,0,.8)}
  .pcard .top{position:relative;height:150px;display:grid;place-items:center;background:radial-gradient(circle at 50% 22%,#16386a,#0a1f3c);overflow:hidden;background-size:cover;background-position:center}
  .pcard .top::after{content:"";position:absolute;inset:0;opacity:.07;background-image:repeating-linear-gradient(135deg,#fff 0 1px,transparent 1px 8px)}
  .mono{font-family:'Anton';font-size:46px;color:var(--gold);z-index:1;width:96px;height:96px;border-radius:50%;border:2px solid rgba(217,177,84,.4);display:grid;place-items:center;background:rgba(6,20,42,.45)}
  .tier{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:rgba(6,20,42,.7);border:1px solid var(--line);color:var(--gold-soft);z-index:2}
  .flag{position:absolute;top:12px;left:12px;font-size:19px;z-index:2;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
  .pcard .body{padding:17px 18px 20px}
  .pcard .body h3{font-size:19px;line-height:1.15}
  .pcard .pos{color:var(--gold-soft);font-size:13px;font-weight:700;margin-top:3px}
  .pcard .team{color:var(--muted);font-size:13px;margin-top:11px;display:flex;align-items:center;gap:7px}
  .pcard .team::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--teal-soft);flex:none}
  .pcard .view{margin-top:14px;font-size:12.5px;font-weight:700;color:var(--gold);letter-spacing:.04em}

  /* events */
  .ev-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
  .ev-card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:linear-gradient(180deg,var(--card),var(--navy-2));transition:.25s}
  .ev-card:hover{transform:translateY(-4px);border-color:var(--gold)}
  .ev-img{height:130px;background:radial-gradient(circle at 70% 20%,rgba(217,177,84,.25),#0a1f3c);display:grid;place-items:center;font-size:38px;background-size:cover;background-position:center;position:relative}
  .ev-status{position:absolute;top:12px;left:12px;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--line)}
  .ev-status.up{background:var(--gold);color:#05101f;border-color:var(--gold)}
  .ev-status.past{background:rgba(6,20,42,.7);color:var(--muted)}
  .ev-body{padding:18px}
  .ev-body h3{font-size:19px}
  .ev-meta{color:var(--gold-soft);font-size:13px;font-weight:700;margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}
  .ev-body p{color:var(--muted);font-size:14px;margin-top:10px}
  .ev-body .ev-tags{color:var(--teal-soft);font-size:12.5px;margin-top:8px;line-height:1.5}
  .ev-body .ev-link{display:inline-block;font-size:12.5px;font-weight:700;color:var(--gold);letter-spacing:.04em}
  .ev-actions{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .ev-media-btn{background:none;border:0;padding:0;cursor:pointer;font-family:inherit}
  .ev-card.has-media{cursor:pointer}
  .ev-card.has-media:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* testimonials */
  .testi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
  .testi-all{display:grid;gap:16px}
  .testi{border:1px solid var(--line);border-radius:18px;padding:26px 24px;background:linear-gradient(180deg,var(--card),var(--navy-2));position:relative}
  .testi .q{font-size:40px;font-family:'Anton';color:rgba(217,177,84,.4);line-height:.6}
  .testi p{font-size:16px;color:#d6e1f2;margin:8px 0 18px}
  .testi .who{display:flex;align-items:center;gap:12px}
  .testi .av{width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(217,177,84,.4);display:grid;place-items:center;font-family:'Anton';color:var(--gold);font-size:16px;background:rgba(6,20,42,.5)}
  .testi .nm{font-weight:700;font-size:14.5px}.testi .rl{color:var(--muted);font-size:12.5px}

  .join{border:1px solid var(--line);border-radius:20px;padding:34px;background:linear-gradient(180deg,var(--card),var(--navy-2))}
  .join .tagline{font-family:'Anton';text-transform:uppercase;color:var(--gold);font-size:clamp(18px,3vw,26px);margin-bottom:16px;letter-spacing:.02em}
  .join-pitch{color:var(--muted);font-size:15px;line-height:1.65;max-width:64ch;margin:0 0 26px}
  /* Honeypot: off-screen (not display:none, so bots still auto-fill it) — a real
     visitor never sees or fills it, so any value means the submission is a bot. */
  .hp{position:absolute!important;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;opacity:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}
  .field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
  .field label{font-size:13px;font-weight:700;color:var(--gold-soft);letter-spacing:.02em}
  .field input,.field select,.field textarea{background:rgba(6,20,42,.6);border:1px solid var(--line);border-radius:11px;padding:13px 14px;color:var(--ink);font-family:inherit;font-size:15px;outline:none;transition:.18s}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
  .field textarea{resize:vertical;min-height:90px}.field select{appearance:none;cursor:pointer}
  .phone-row{display:flex;gap:8px}
  .phone-row .phone-cc{flex:0 0 auto;width:auto;max-width:142px}
  .phone-row .phone-num{flex:1;min-width:0}
  .form-msg{display:none;margin-top:14px;padding:14px 16px;border-radius:12px;background:rgba(217,177,84,.12);border:1px solid var(--gold);color:var(--gold-soft);font-weight:600}
  .form-msg.show{display:block}

  .band{position:relative;z-index:1;margin:30px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:linear-gradient(120deg,rgba(217,177,84,.10),transparent)}
  .band-in{padding:58px 0;text-align:center}.band h2{font-size:clamp(28px,5vw,50px)}
  .band p{color:var(--muted);margin:14px auto 26px;max-width:52ch}

  footer{position:relative;z-index:1;border-top:1px solid var(--line);padding:46px 0 70px}
  .foot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}
  .foot .muted{color:var(--muted);font-size:13.5px;margin-top:14px}
  .foot-links{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
  @media(max-width:560px){.foot-links{align-items:flex-start}}
  .pill{display:inline-flex;align-items:center;gap:9px;color:var(--gold-soft);font-weight:700;border:1px solid var(--line);padding:10px 16px;border-radius:999px;transition:.2s}
  .pill:hover{border-color:var(--gold);background:rgba(217,177,84,.08)}
  /* CeasAI cross-promo strip at the very bottom of the footer */
  .ceasai{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);text-align:center}
  .ceasai a{font-size:12.5px;color:var(--muted);transition:.2s;display:inline-flex;gap:6px;align-items:center}
  .ceasai a:hover{color:var(--gold-soft)}
  .ceasai b{color:var(--gold-soft);font-weight:800;letter-spacing:.02em}

  .modal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center}
  .modal.open{display:flex}
  .modal .scrim{position:absolute;inset:0;background:rgba(3,10,22,.78);backdrop-filter:blur(4px)}
  .sheet{position:relative;z-index:2;width:100%;max-width:680px;max-height:90vh;overflow:auto;background:linear-gradient(180deg,var(--navy-3),var(--navy-2));border:1px solid var(--line);border-radius:22px 22px 0 0;animation:rise .3s ease}
  @media(min-width:700px){.modal{align-items:center}.sheet{border-radius:22px}}
  @keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
  .sh-top{padding:30px 28px;display:flex;gap:20px;align-items:center;border-bottom:1px solid var(--line);background:radial-gradient(circle at 80% 0%,rgba(217,177,84,.12),transparent 60%)}
  .sh-mono{font-family:'Anton';font-size:40px;color:var(--gold);width:88px;height:88px;flex:none;border-radius:50%;border:2px solid rgba(217,177,84,.4);display:grid;place-items:center;background:rgba(6,20,42,.5);background-size:cover;background-position:center}
  .sheet h3{font-size:clamp(24px,5vw,34px)}
  .sh-pos{color:var(--gold-soft);font-weight:700;margin-top:4px}.sh-meta{color:var(--muted);font-size:14px;margin-top:8px}
  /* Bottom-sheet modal is flush to the screen bottom on mobile, so pad its body
     past the iOS home indicator (0 fallback elsewhere) — matches footer/install. */
  .sh-body{padding:26px 28px calc(34px + env(safe-area-inset-bottom,0px))}.sh-body p.bio{font-size:16px;color:#d6e1f2;margin-bottom:24px}
  .sh-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
  .sh-stat{flex:1;min-width:120px;border:1px solid var(--line);border-radius:13px;padding:14px 16px;background:rgba(8,26,51,.5)}
  .sh-stat b{font-family:'Anton';font-size:22px;color:var(--gold);display:block;line-height:1.1}
  .sh-stat span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .sh-label{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-soft);font-weight:700;margin-bottom:12px}
  .team-chips{display:flex;gap:9px;flex-wrap:wrap}
  .sh-contact{margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
  .sh-contact-p{color:var(--muted);font-size:14px;margin:6px 0 16px}
  .team-chip{font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--line);color:#cdd9ec;background:rgba(8,26,51,.5)}
  /* self-entered per-season stats (derived AVG/OBP/SLG · ERA/WHIP · Fld% computed on render) */
  .ss-block{margin-bottom:18px}
  .ss-title{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-soft);font-weight:700;margin-bottom:8px}
  .ss-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
  .ss-table{width:100%;border-collapse:collapse;font-size:13px;min-width:max-content}
  .ss-table th,.ss-table td{padding:8px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid rgba(217,177,84,.1)}
  .ss-table th:first-child,.ss-table td:first-child,.ss-table th:nth-child(2),.ss-table td:nth-child(2){text-align:left}
  .ss-table thead th{color:var(--gold-soft);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:rgba(8,26,51,.6)}
  .ss-table tbody tr:last-child td{border-bottom:0}
  .ss-table tbody td{color:#d6e1f2}
  .close{position:absolute;top:16px;right:16px;z-index:3;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(6,20,42,.7);color:var(--ink);font-size:18px;cursor:pointer;display:grid;place-items:center}
  .close:hover{border-color:var(--gold);color:var(--gold)}

  .install{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;justify-content:center;padding:0 16px 16px}
  .install.show{display:flex}
  .install .box{display:flex;align-items:center;gap:14px;background:rgba(12,33,67,.96);border:1px solid var(--gold);border-radius:14px;padding:12px 14px;backdrop-filter:blur(8px);max-width:520px;width:100%}
  .install .box b{font-size:14px}.install .box span{font-size:12.5px;color:var(--muted);display:block}
  .install button{margin-left:auto;border:0;background:var(--gold);color:#05101f;font-weight:700;padding:9px 14px;border-radius:999px;cursor:pointer}
  .install .x{margin-left:8px;background:transparent;color:var(--muted);border:1px solid var(--line)}

  /* Footer link through to the admin panel (/admin/) */
  .foot-admin{display:inline-block;margin-top:12px;font-size:12px;color:var(--muted);opacity:.6;cursor:pointer;background:none;border:0;font-family:inherit;text-decoration:none}
  .foot-admin:hover{opacity:1;color:var(--gold-soft)}

  /* form error state (applications) */
  .form-msg.err{background:rgba(224,93,93,.12);border-color:#e05d5d;color:#ffb4b4}

  /* ===== mobile / PWA polish ===== */
  *{-webkit-tap-highlight-color:transparent}
  .install{padding-bottom:calc(16px + env(safe-area-inset-bottom))}      /* clear the iOS home indicator */
  footer{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
  @media(max-width:560px){
    .wrap{padding:0 16px}
    /* 16px form controls stop iOS from auto-zooming on focus */
    .field input,.field select,.field textarea{font-size:16px}
  }

  /* ===== contracts band (layout ref: baseballjobsoverseas.com) ===== */
  .contracts{position:relative;z-index:1;padding:66px 0 8px;text-align:center}
  .contracts h2{font-size:clamp(27px,5.3vw,56px);letter-spacing:.055em;color:var(--ink)}
  .contracts h2 em{font-style:normal;color:var(--gold)}
  .contracts .sub{margin-top:15px;color:var(--muted);font-size:clamp(14px,1.9vw,17px)}
  .contracts .sub b{color:var(--gold-soft);font-weight:700}
  .contracts .rule{width:110px;height:2px;background:var(--gold);margin:26px auto 0;opacity:.75}
  .feature-grid{display:grid;grid-template-columns:1fr;gap:22px;margin:38px auto 0;text-align:left;max-width:720px}
  .stats-in{grid-template-columns:repeat(2,1fr) !important}

  .tcard{display:flex;gap:24px;align-items:flex-start;border:1px solid var(--line);border-radius:18px;padding:30px;background:linear-gradient(180deg,var(--card),var(--navy-2))}
  /* Tall portrait crop, like the reference card — noticeably taller than it is wide. */
  .tcard .shot{width:140px;min-width:140px;height:230px;border-radius:12px;background-size:cover;background-position:center 20%;border:1px solid var(--line)}
  .tcard .qt{font-size:16.5px;line-height:1.7;color:#d6e1f2;font-style:italic}
  .tcard .nm{margin-top:14px;font-family:'Anton';letter-spacing:.09em;font-size:15px;color:var(--gold-soft);text-transform:uppercase}
  .tcard .rl{font-size:12.5px;color:var(--muted);margin-top:3px}
  @media(max-width:520px){.tcard{flex-direction:column;padding:24px}.tcard .shot{width:100%;height:280px;background-position:center 18%}}

  /* ===== media / gallery ===== */
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
  .gal button{padding:0;cursor:pointer;border-radius:14px;overflow:hidden;border:1px solid var(--line);transition:.25s;background:var(--card);display:block;line-height:0}
  .gal button:hover{transform:translateY(-3px);border-color:var(--gold)}
  .gal img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
  .reel{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
  .reel::-webkit-scrollbar{height:6px}
  .reel::-webkit-scrollbar-thumb{background:rgba(217,177,84,.35);border-radius:9px}
  /* Uniform 16:9 cards. Two clips are portrait, so without a fixed ratio + object-fit
     the strip renders with ragged, mismatched card heights. */
  .reel video{flex:0 0 auto;width:250px;aspect-ratio:16/9;object-fit:cover;border-radius:14px;border:1px solid var(--line);background:#04101f;scroll-snap-align:start}
  .sub-label{font-size:11.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--teal-soft);margin:32px 0 14px}
  .lightbox img{width:100%;border-radius:12px;display:block}

  /* ===== roster paywall ===== */
  .roster-wrap{position:relative}
  /* The locked gate overlay is position:absolute;inset:0, so it takes the wrap's
     height. A sport/position filter matching few or zero athletes would otherwise
     shrink the wrap below the gate card, making the gate spill over the sections
     above/below (the "filter tabs break the layout" bug). A min-height reserves
     room for the overlay no matter how many cards match. Only applies while locked. */
  .roster-wrap.is-locked{min-height:540px}
  .roster-empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:34px 12px;font-size:15px}
  .roster-wrap.is-locked .roster{filter:blur(9px) saturate(.55);pointer-events:none;user-select:none;max-height:600px;overflow:hidden}
  .roster-wrap.is-locked::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,20,42,.3),rgba(6,20,42,.93));pointer-events:none;border-radius:18px}
  .gate{display:none}
  .roster-wrap.is-locked .gate{display:flex;position:absolute;inset:0;align-items:center;justify-content:center;z-index:3;padding:18px}
  .gate-in{max-width:520px;width:100%;text-align:center;border:1px solid var(--gold);border-radius:20px;padding:32px 28px;background:linear-gradient(180deg,rgba(12,33,67,.97),rgba(6,20,42,.99));box-shadow:0 26px 60px rgba(0,0,0,.55)}
  .gate-lock{font-size:25px;margin-bottom:10px}
  .gate-in h3{font-family:'Anton';font-size:23px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:9px}
  .gate-in p{color:var(--muted);font-size:14.5px;margin-bottom:20px}
  .gate-price{font-family:'Anton';font-size:42px;color:var(--gold);line-height:1}
  .gate-price small{display:block;font-family:'Hanken Grotesk';font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:8px;font-weight:700}
  .gate-or{margin:20px 0 11px;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .gate-code{display:flex;gap:8px}
  .gate-code input{flex:1;min-width:0;background:rgba(6,20,42,.8);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);font-size:15px;font-weight:600;letter-spacing:.05em}
  .gate-code input:focus{outline:0;border-color:var(--gold)}
  .gate-code button{background:transparent;border:1px solid var(--gold);color:var(--gold-soft);border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:14px;white-space:nowrap}
  .gate-code button:hover{background:var(--gold);color:#05101f}
  /* Profile-creation section (€124.99) — a marketing card that links to the real
     account flow at /register/. (Was a client-side code gate before Phase 1.) */
  .pcreate{display:flex;justify-content:center}
  .pc-includes{list-style:none;text-align:left;margin:6px auto 18px;max-width:380px;display:grid;gap:9px}
  .pc-includes li{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:#d6e1f2}
  .pc-includes li::before{content:"✓";color:var(--teal-soft);font-weight:800;flex:none}
  .pc-access{margin-top:12px;font-size:13px;font-weight:700;color:var(--gold-soft);letter-spacing:.02em}
  .gate-err{margin-top:11px;font-size:13px;color:#ff9c9c;display:none}
  .gate-err.show{display:block}
  .unlocked-note{display:none;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--teal-soft);margin-bottom:16px;font-weight:700;letter-spacing:.03em}
  .unlocked-note.show{display:flex}

  /* ===== pay panel (join) ===== */
  .paypanel{margin-top:22px;border:1px solid var(--gold);border-radius:18px;padding:28px 24px;background:linear-gradient(180deg,rgba(217,177,84,.10),rgba(6,20,42,.6));text-align:center;display:none}
  .paypanel.show{display:block}
  .paypanel h3{font-family:'Anton';text-transform:uppercase;letter-spacing:.05em;font-size:21px;margin-bottom:8px}
  .paypanel p{color:var(--muted);font-size:14.5px;margin-bottom:16px}
  .paypanel .amt{font-family:'Anton';font-size:38px;color:var(--gold);line-height:1;margin-bottom:14px}
  .paypanel .fine{font-size:12.5px;color:var(--muted);margin:14px 0 0}

  /* ===== college ===== */
  .col-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:start}
  @media(max-width:820px){.col-grid{grid-template-columns:1fr}}
  .col-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .col-row{display:flex;gap:13px;padding:15px 18px;background:rgba(8,26,51,.3);font-size:14.7px;color:#d6e1f2;align-items:flex-start}
  .col-row:nth-child(even){background:rgba(8,26,51,.55)}
  .col-row i{font-style:normal;color:var(--gold);font-weight:800}
  .col-cta{border:1px solid var(--gold);border-radius:18px;padding:28px 24px;text-align:center;background:linear-gradient(180deg,var(--card),rgba(8,26,51,.5))}
  .col-cta h3{font-family:'Anton';text-transform:uppercase;letter-spacing:.05em;font-size:20px;margin-bottom:8px}
  .col-cta p{color:var(--muted);font-size:14px;margin-bottom:16px}
  .col-price{font-family:'Anton';font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:16px}
</style>
</head>

<section class="sec" id="who" style="padding-top:10px"><div class="wrap">
  <div class="sec-head"><div class="kicker" data-i18n="who_kicker"></div></div>
  <div class="founder">
    <div class="mono" id="founderPhoto" style="background-image:url('https://sbexwyvsgqayxrsrlrpm.supabase.co/storage/v1/object/public/player-photos/founder/sam.jpeg');background-size:cover;background-position:center top;font-size:0"></div>
    <div>
      <h3 class="display">Samuele Bruno</h3>
      <div class="role" data-i18n="who_role"></div>

let lang="en", active="All", activeSport="All", SB=null;

const initials=n=>n.replace(/[^A-Za-zÀ-ÿ ]/g,"").split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const t=k=>(T[lang][k]??k);
const groupKey=g=>({Pitcher:"pitcher",Catcher:"catcher",Infielder:"infielder","Two-Way":"twoway"}[g]||"infielder");
const slugify=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const bgImg=u=>u?`background-image:url('${u}')`:"";
/* Escape untrusted text before it goes into innerHTML. Roster/modal data comes from
   Supabase (and originally from the public application form), so player-supplied
   strings like name/position/bio must not be able to inject markup. */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function applyI18n(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el=>el.innerHTML=t(el.dataset.i18nHtml));
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
}
function setLang(l){lang=l;applyI18n();renderSportFilters();renderFilters();renderRoster();renderEvents();renderTesti();}

const SPORT_FILTERS=["All","Baseball","Softball"];
function renderSportFilters(){
  const f=document.getElementById("sportFilters");
  f.innerHTML=SPORT_FILTERS.map(x=>`<button type="button" class="chip ${x===activeSport?'active':''}" data-sf="${x}">${x==="All"?t("filter_all"):x}</button>`).join("");
  f.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{activeSport=c.dataset.sf;active="All";renderFilters();renderSportFilters();renderRoster();});
}
const FILTERS=["All","Pitcher","Catcher","Infielder","Two-Way"];
function renderFilters(){
  const f=document.getElementById("filters");
  f.innerHTML=FILTERS.map(x=>`<button type="button" class="chip ${x===active?'active':''}" data-f="${x}">${t("filter_"+(x==="All"?"all":groupKey(x)))}</button>`).join("");
  f.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{active=c.dataset.f;renderFilters();renderRoster();});
}
function renderRoster(){
  let list=activeSport==="All"?PLAYERS:PLAYERS.filter(p=>(p.sport||"Baseball")===activeSport);
  list=active==="All"?list:list.filter(p=>p.group===active);
  const cards=list.map(p=>{
    const hasPage=STATIC_PLAYER_PAGES.has(p.slug);
    const tag=hasPage?"a":"button";
    const linkAttr=hasPage?`href="players/${encodeURIComponent(p.slug)}.html"`:`data-slug="${esc(p.slug)}"`;
    return `
    <${tag} class="pcard" ${linkAttr}>
      <div class="top" style="${bgImg(p.image)}"><span class="flag">${esc(flagFor(p))}${p.heritage?(" "+esc(p.heritage)):""}</span>
        ${p.tier?`<span class="tier">${esc(p.tier)}</span>`:""}${p.image?"":`<span class="mono">${initials(p.name)}</span>`}</div>
      <div class="body"><h3 class="display">${esc(p.name)}</h3><div class="pos">${esc(p.position)}</div>
        ${p.teams&&p.teams[0]?`<div class="team">${esc(p.teams[0])}</div>`:""}<div class="view">${t("card_view")}</div></div>
    </${tag}>`;
  }).join("");
  document.getElementById("rosterList").innerHTML=cards||`<div class="roster-empty">${t("roster_empty")}</div>`;
  document.querySelectorAll(".pcard[data-slug]").forEach(c=>c.onclick=()=>openModal(c.dataset.slug));
  // Headline stats are set by ESM, not derived from the roster: the public roster
  // only lists approved athletes, which undercounts who's actually represented.
}
function fmtDate(d){try{return new Date(d+"T00:00").toLocaleDateString(lang,{day:"numeric",month:"short",year:"numeric"})}catch(e){return d}}
let EV_VIEW=[];
function renderEvents(){
  const order={upcoming:0,past:1};
  EV_VIEW=[...EVENTS].sort((a,b)=>(order[a.status]-order[b.status])||a.date.localeCompare(b.date));
  document.getElementById("eventsList").innerHTML=EV_VIEW.map((e,i)=>`
    <div class="ev-card${e.media?' has-media':''}"${e.media?` data-ev="${i}" role="button" tabindex="0" aria-label="${esc(e.title)}"`:""}><div class="ev-img" style="${bgImg(e.image)}">
      <span class="ev-status ${e.status==='upcoming'?'up':'past'}">${e.status==='upcoming'?t("ev_upcoming"):t("ev_past")}</span>
      ${e.image?"":(e.icon||"⚾")}</div>
      <div class="ev-body"><h3 class="display">${esc(e.title)}</h3>

/* Render self-entered per-season stats as batting/pitching/fielding tables.
   Derived stats (AVG/OBP/SLG · ERA/WHIP · Fld%) are computed here from the raw
   inputs, never stored, so they can't drift. Shared shape with portal/register. */
function seasonStatsHTML(seasonStats){
  const rows=Array.isArray(seasonStats)?seasonStats:[];
  if(!rows.length)return"";
  const n=v=>(v===null||v===undefined||v==="")?null:(isFinite(Number(v))?Number(v):null);
  const avg=x=>(x===null||!isFinite(x))?"—":x.toFixed(3).replace(/^0(?=\.)/,"");   // .318 / 1.000
  const two=x=>(x===null||!isFinite(x))?"—":x.toFixed(2);
  const META={
    batting:{label:"Batting",cols:["Season","Team","AB","H","HR","RBI","AVG","OBP","SLG"]},
    pitching:{label:"Pitching",cols:["Season","Team","W","L","ERA","IP","SO","WHIP"]},
    fielding:{label:"Fielding",cols:["Season","Team","G","E","FLD%"]},
  };
  function cell(r,c){
    switch(c){
      case"Season":return esc(r.season||"—");
      case"Team":return esc(r.team||"—");
      case"AVG":{const ab=n(r.AB),h=n(r.H);return avg(ab?(h||0)/ab:null);}
      case"OBP":{const ab=n(r.AB),h=n(r.H),bb=n(r.BB)||0,d=(ab||0)+bb;return avg(d?((h||0)+bb)/d:null);}
      case"SLG":{const ab=n(r.AB),h=n(r.H),d2=n(r["2B"])||0,t3=n(r["3B"])||0,hr=n(r.HR)||0,tb=(h||0)+d2+2*t3+3*hr;return avg(ab?tb/ab:null);}
      case"ERA":{const er=n(r.ER),ip=n(r.IP);return two((ip&&er!==null)?9*er/ip:null);}
      case"WHIP":{const bb=n(r.BB)||0,h=n(r.H)||0,ip=n(r.IP);return two(ip?(bb+h)/ip:null);}
      case"FLD%":{const po=n(r.PO)||0,a=n(r.A)||0,e=n(r.E)||0,tc=po+a+e;return tc?avg((po+a)/tc):"—";}
      default:{const v=n(r[c]);return v===null?"—":esc(String(r[c]));}
    }
  }
  let out="";
  for(const kind of["batting","pitching","fielding"]){
    const list=rows.filter(r=>r&&r.kind===kind);if(!list.length)continue;
    const m=META[kind];
    out+=`<div class="ss-block"><div class="ss-title">${m.label}</div><div class="ss-scroll"><table class="ss-table"><thead><tr>${m.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>`+
      list.map(r=>`<tr>${m.cols.map(c=>`<td>${cell(r,c)}</td>`).join("")}</tr>`).join("")+
      `</tbody></table></div></div>`;
  }
  return out;
}

/* ===== roster paywall =====
   Client-side gate: the valid code's SHA-256 lives in ROSTER_CODE_HASHES, and the
   unlock is remembered in localStorage so a buyer only enters it once. */
function isUnlocked(){try{return localStorage.getItem(UNLOCK_KEY)==="1"}catch(e){return false}}

async function sha256Hex(str){
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function applyLockState(){
  const wrap=document.getElementById("rosterWrap");
  const note=document.getElementById("unlockedNote");
  const open=isUnlocked();
  if(wrap)wrap.classList.toggle("is-locked",!open);
  if(note)note.classList.toggle("show",open);
}
function unlockRoster(){
  try{localStorage.setItem(UNLOCK_KEY,"1")}catch(e){}
  applyLockState();
  renderRoster();
}
const gateForm=document.getElementById("gateForm");
if(gateForm)gateForm.addEventListener("submit",async e=>{
  e.preventDefault();
  const err=document.getElementById("gateErr");
  const val=(document.getElementById("gateInput").value||"").trim().toUpperCase();
  err.classList.remove("show");
  if(!val)return;
  let hash="";
  try{hash=await sha256Hex(val);}
  catch(ex){console.warn("crypto.subtle unavailable",ex);err.classList.add("show");return;}
  if(ROSTER_CODE_HASHES.includes(hash)){
    unlockRoster();
    document.getElementById("roster").scrollIntoView({behavior:"smooth",block:"start"});
  }else{
    err.classList.add("show");
  }
});

async function boot(){
  if(SUPABASE_URL&&SUPABASE_ANON_KEY){
    try{const {createClient}=await import("https://esm.sh/@supabase/supabase-js@2");
      // The public site is anonymous by design. Don't load any signed-in session
      // from storage — otherwise a logged-in player/scout browsing the homepage
      // would send their JWT and RLS would return only their own row, breaking the
      // public roster. persistSession:false keeps every request purely anon.
      SB=createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
      // Only approved players are publicly readable (enforced by RLS too). We request
      // just the public display columns — NOT the intake PII (age/phone/email/instagram/
      // message) — so an approved athlete's contact details are never sent to the browser.
      const {data,error}=await SB.from("players")
        .select("slug,name,group,position,country,flag,heritage,born,birthplace,tier,bats,bio,teams,stats,season_stats,image_url,sport,sort_order")
        .eq("status","approved").order("sort_order");
      if(error)throw error;
      // Supabase stores the photo in `image_url`; the renderer reads `image`.
      if(data&&data.length)PLAYERS=data.map(p=>({...p,image:p.image_url||p.image||null}));
      // Extra testimonials from the CMS for the "See all" list (plain strings; loc() handles them).
      const {data:tData}=await SB.from("testimonials").select("quote,name,role,sort_order").order("sort_order");
      if(tData&&tData.length)DB_TESTI=tData.map(x=>({q:x.quote,n:x.name,r:x.role,photo:null}));
    }catch(err){console.warn("Supabase load failed; using embedded roster.",err);}
  }
  // Repo-committed photos fill in only where Supabase has none.
  PLAYERS=PLAYERS.map(p=>({...p,image:p.image||LOCAL_PHOTOS[p.slug]||null}));
  wireServiceSignups();
  applyI18n();renderSportFilters();renderFilters();renderRoster();renderEvents();renderTesti();
}

/* ---------- pull-to-refresh (installed PWA only) ----------
   An installed PWA has no browser chrome, so it loses Safari's native pull-to-refresh.
   This adds a custom gesture that only arms in standalone display mode and only when
   scrolled to the very top, so it never fights normal scrolling or affects a browser tab.
   On trigger it asks the service worker to check for a new version (the SW uses
   skipWaiting + clients.claim, so a found update self-activates) THEN reloads — the reload
   re-runs boot(), re-fetching the roster from Supabase (network-first), so it pulls
   genuinely fresh data, not just a cosmetic repaint. Mirrors the admin portal's gesture. */
(function(){
  var standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if(!standalone) return;

  var THRESHOLD = 70;                 // px of pull needed to trigger a refresh
  var scroller = document.scrollingElement || document.documentElement;
  var startY = 0, dist = 0, pulling = false, refreshing = false;

  var ind = document.createElement("div");
  ind.id = "ptr"; ind.setAttribute("aria-hidden", "true");
  ind.innerHTML = '<div class="ptr-spin"></div>';
  var style = document.createElement("style");
  style.textContent =
    "#ptr{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;z-index:200;" +
    "width:38px;height:38px;border-radius:50%;display:grid;place-items:center;" +
    "background:rgba(12,33,67,.97);border:1px solid var(--gold,#d9b154);" +
    "box-shadow:0 8px 22px rgba(0,0,0,.45);opacity:0;pointer-events:none;" +
    "transform:translateX(-50%) translateY(-70px);transition:transform .15s ease,opacity .15s}" +
    ".ptr-spin{width:17px;height:17px;border-radius:50%;border:2px solid rgba(217,177,84,.3);border-top-color:var(--gold,#d9b154)}" +
    "#ptr.spin .ptr-spin{animation:ptr-rot .6s linear infinite}" +
    "@keyframes ptr-rot{to{transform:rotate(360deg)}}";
  document.head.appendChild(style);
  document.body.appendChild(ind);

  function reset(){ pulling = false; dist = 0; ind.classList.remove("spin"); ind.style.opacity = ""; ind.style.transform = ""; }

  addEventListener("touchstart", function(e){
    if(refreshing || e.touches.length !== 1 || scroller.scrollTop > 0) return;
    startY = e.touches[0].clientY; pulling = true; dist = 0;
  }, { passive: true });

  addEventListener("touchmove", function(e){
    if(!pulling || refreshing) return;
    if(scroller.scrollTop > 0){ reset(); return; }    // user scrolled away from the top
    dist = e.touches[0].clientY - startY;
    if(dist <= 0){ reset(); return; }                 // pulling up, not a refresh gesture
    ind.style.opacity = Math.min(dist / THRESHOLD, 1);
    ind.style.transform = "translateX(-50%) translateY(" + Math.min(-70 + dist * 0.6, 10) + "px)";
    ind.classList.toggle("spin", dist >= THRESHOLD);  // pre-spin once past the threshold
  }, { passive: true });

  addEventListener("touchend", function(){
    if(!pulling || refreshing){ reset(); return; }
    if(dist < THRESHOLD){ reset(); return; }
    refreshing = true;
    ind.classList.add("spin"); ind.style.opacity = "1";
    ind.style.transform = "translateX(-50%) translateY(10px)";
    Promise.resolve()
      .then(function(){ return "serviceWorker" in navigator ? navigator.serviceWorker.getRegistration() : null; })
      .then(function(reg){ return reg ? reg.update() : null; })   // fetch a newer sw.js if deployed
      .catch(function(){})
      .then(function(){ location.reload(); });                    // fresh shell + fresh roster data
  }, { passive: true });
})();
