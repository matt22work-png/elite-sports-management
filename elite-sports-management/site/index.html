<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<!-- iOS Safari auto-detects number strings (e.g. the "€49.99" roster price) as phone
     numbers and turns them into tappable links; scrolling/tapping then surfaces an
     unwanted iOS action sheet. Disable data detectors so it never happens in any locale. -->
<meta name="format-detection" content="telephone=no" />
<title>ESM Sports Network — Athlete Representation</title>
<meta name="description" content="ESM Sports Network — baseball and softball athlete representation and development across college recruiting, independent pro ball and Europe. Founded by professional baseball player Samuele Bruno (Hastings College NAIA, scholarship athlete, class of 2027). Browse the roster, upcoming events and individual athlete profiles." />
<link rel="canonical" href="https://elite-sports-management.vercel.app/" />

<!-- Open Graph / Twitter share cards so links unfurl with a title, description and image
     instead of a bare URL. og:image is a dedicated 1200x630 branded card (og-image.png):
     the ESM Sports Network logo centered on the site's navy gradient. Tags are English-only:
     social scrapers read the raw HTML and don't run the JS i18n. -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="ESM Sports Network" />
<meta property="og:title" content="ESM Sports Network — Athlete Representation" />
<meta property="og:description" content="Baseball and softball athlete representation and development — college recruiting, independent pro ball, winter leagues and Europe. Browse the roster and upcoming events." />
<meta property="og:url" content="https://elite-sports-management.vercel.app/" />
<meta property="og:image" content="https://elite-sports-management.vercel.app/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="ESM Sports Network logo" />
<meta property="og:locale" content="en_US" />
<meta property="og:locale:alternate" content="es_ES" />
<meta property="og:locale:alternate" content="it_IT" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="ESM Sports Network — Athlete Representation" />
<meta name="twitter:description" content="Baseball and softball athlete representation — college, pro ball, winter leagues and Europe." />
<meta name="twitter:image" content="https://elite-sports-management.vercel.app/og-image.png" />

<!-- Structured data: helps search engines and social platforms understand the brand. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SportsOrganization",
  "name": "ESM Sports Network",
  "alternateName": "ESM",
  "url": "https://elite-sports-management.vercel.app/",
  "logo": "https://elite-sports-management.vercel.app/logo.png",
  "image": "https://elite-sports-management.vercel.app/media/photos/twl-champions.jpg",
  "description": "Baseball and softball athlete representation and development — college recruiting, independent pro ball, winter leagues and Europe.",
  "sport": ["Baseball", "Softball"],
  "founder": { "@type": "Person", "name": "Samuele Bruno" },
  "sameAs": ["https://www.instagram.com/esm_sports_network__01/"],
  "contactPoint": {
    "@type": "ContactPoint",
    "contactType": "customer service",
    "email": "elitesportsmanagement50@gmail.com",
    "availableLanguage": ["English", "Spanish", "Italian"]
  }
}
</script>

<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
<link rel="shortcut icon" href="icons/icon-192.png" />
<meta name="theme-color" content="#081a33" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ESM" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--navy:#081a33;--navy-2:#06142a;--navy-3:#0d2547;--gold:#d9b154;--gold-soft:#e7c878;--teal:#3a9aa6;--teal-soft:#5fb8c2;--ink:#eaf0fa;--muted:#9fb1cc;--line:rgba(217,177,84,.22);--card:#0c2143}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Hanken Grotesk',system-ui,sans-serif;background:var(--navy-2);color:var(--ink);line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  .display{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:.01em;line-height:.92;text-transform:uppercase}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px}
  .bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none}
  .bg-fx::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 500px at 78% -10%,rgba(217,177,84,.16),transparent 60%),radial-gradient(800px 600px at 8% 110%,rgba(20,70,140,.30),transparent 55%),linear-gradient(180deg,var(--navy),var(--navy-2))}
  .bg-fx::after{content:"";position:absolute;inset:0;opacity:.04;background-image:repeating-linear-gradient(135deg,#fff 0 1px,transparent 1px 9px)}

  /* iOS PWA: status-bar-style is black-translucent + viewport-fit=cover, so page
     content draws UNDER the status bar. Pad the sticky header down by the top
     safe-area inset (0px fallback off-notch) so the nav clears the clock/battery. */
  header.nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(10px);background:rgba(6,20,42,.72);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
  .nav-in{display:flex;align-items:center;justify-content:space-between;height:64px;gap:14px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:800}
  .logo{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#10305c,#06142a);font-family:'Anton';font-size:13px;color:var(--gold);position:relative}
  .logo span{position:absolute;top:-3px;font-size:9px}
  .logo-img{height:40px;width:auto;display:block}
  .foot-logo{height:64px;width:auto;display:block;margin-bottom:8px}
  .brand b{font-size:14px}.brand small{display:block;font-size:8.5px;letter-spacing:.3em;color:var(--gold-soft);font-weight:700}
  .nav-right{display:flex;align-items:center;gap:18px}
  .nav-links{display:flex;gap:22px;font-size:14px;font-weight:600}
  .nav-links a{color:var(--muted);transition:.2s}.nav-links a:hover{color:var(--gold-soft)}
  .lang{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:3px}
  .lang button{background:transparent;border:0;color:var(--muted);font-weight:700;font-size:12px;padding:5px 9px;border-radius:999px;cursor:pointer}
  .lang button.on{background:var(--gold);color:#05101f}
  .nav-cta{border:1px solid var(--gold);color:var(--gold-soft);padding:9px 15px;border-radius:999px;font-size:13px;font-weight:700;transition:.2s;white-space:nowrap}
  .nav-cta:hover{background:var(--gold);color:#05101f}
  /* Sign In dropdown — native <details>, styled to sit between the language switch and the CTA */
  .signin{position:relative}
  .signin>summary{list-style:none;cursor:pointer;color:var(--muted);font-size:13px;font-weight:700;padding:9px 4px;transition:.2s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;user-select:none}
  .signin>summary::-webkit-details-marker{display:none}
  .signin>summary::after{content:"";width:6px;height:6px;border-right:2px solid var(--gold-soft);border-bottom:2px solid var(--gold-soft);transform:rotate(45deg) translateY(-2px);transition:transform .2s;opacity:.8}
  .signin[open]>summary::after{transform:rotate(-135deg) translateY(-1px)}
  .signin>summary:hover,.signin[open]>summary{color:var(--gold-soft)}
  .signin-menu{position:absolute;right:0;top:calc(100% + 10px);min-width:190px;display:flex;flex-direction:column;gap:2px;background:rgba(6,20,42,.98);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 14px 34px rgba(0,0,0,.45);z-index:60}
  .signin-menu a{color:var(--muted);font-size:14px;font-weight:600;padding:10px 12px;border-radius:8px;transition:.15s;white-space:nowrap}
  .signin-menu a:hover,.signin-menu a:focus-visible{background:rgba(217,177,84,.12);color:var(--gold-soft)}
  @media(max-width:860px){.nav-links{display:none}}
  /* Small phones: with the nav links gone, the header holds brand + language +
     Sign In + Apply. Tighten spacing/padding so it never overflows down to ~320px. */
  @media(max-width:560px){
    .nav-right{gap:9px}
    .lang{padding:2px}
    .lang button{padding:5px 7px;font-size:11px}
    .signin>summary{font-size:12px;padding:8px 2px;gap:4px}
    .nav-cta{padding:8px 11px;font-size:12px}
    .signin-menu{min-width:172px}
  }
  @media(max-width:380px){
    .logo-img{height:32px}
    .nav-right{gap:7px}
    .lang button{padding:5px 6px}
    .nav-cta{padding:7px 9px}
  }

  .hero{position:relative;z-index:1;padding:58px 0 46px}
  .eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-soft);border:1px solid var(--line);padding:7px 14px;border-radius:999px;margin-bottom:26px}
  .eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--teal-soft);box-shadow:0 0 12px var(--teal)}
  .hero h1{font-size:clamp(40px,8vw,86px);max-width:14ch}.hero h1 em{color:var(--gold);font-style:normal}
  .hero p.lead{margin-top:24px;max-width:56ch;font-size:clamp(16px,2.2vw,20px);color:var(--muted)}
  .hero-btns{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap}
  .btn{padding:14px 26px;border-radius:999px;font-weight:700;font-size:15px;transition:.22s;cursor:pointer;border:0;display:inline-block}
  .btn-gold{background:var(--gold);color:#05101f}.btn-gold:hover{background:var(--gold-soft);transform:translateY(-2px)}
  .btn-ghost{border:1px solid var(--line);color:var(--ink)}.btn-ghost:hover{border-color:var(--gold);color:var(--gold-soft)}
  /* Keyboard focus indicator — visible for keyboard/AT users, not on mouse click. */
  a:focus-visible,button:focus-visible,.chip:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

  .stats{position:relative;z-index:1;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(8,26,51,.5)}
  .stats-in{display:grid;grid-template-columns:repeat(3,1fr)}
  .stat{padding:30px 18px;text-align:center;border-right:1px solid var(--line)}.stat:last-child{border-right:0}
  .stat b{font-family:'Anton';font-size:clamp(34px,6vw,56px);color:var(--gold);display:block;line-height:1}
  .stat span{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}

  section{position:relative;z-index:1}.sec{padding:64px 0}
  .sec-head{margin-bottom:42px}
  .kicker{font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--teal-soft)}
  .sec-head h2{font-size:clamp(32px,5.5vw,58px);margin-top:12px;max-width:20ch}
  .sec-head p{color:var(--muted);max-width:62ch;margin-top:14px;font-size:16.5px}

  /* Fixed 3-up so the 6 services land as a clean 3 + 3 instead of 5 + an orphan. */
  .do-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:860px){.do-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.do-grid{grid-template-columns:1fr}}
  .do{padding:24px 20px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,var(--card),rgba(8,26,51,.4));transition:.25s;display:flex;flex-direction:column}
  .do:hover{transform:translateY(-4px);border-color:var(--gold)}
  .do .ic{font-size:22px;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:rgba(217,177,84,.12);border:1px solid var(--line);margin-bottom:15px}
  .do h3{font-size:17px;margin-bottom:7px}.do p{color:var(--muted);font-size:14px}
  .do-price{margin:12px 0 8px;font-size:13.5px;color:var(--muted)}
  .do-price b{font-family:'Anton';font-size:22px;color:var(--gold);letter-spacing:.01em;margin-right:5px}
  .do-bul{list-style:none;margin:0 0 4px;padding:0;display:grid;gap:6px}
  .do-bul li{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted)}
  .do-bul li::before{content:"✓";color:var(--teal-soft);font-weight:800;flex:none}
  .do-hl{margin-top:12px;padding:10px 12px;border:1px solid rgba(217,177,84,.35);border-radius:10px;background:rgba(217,177,84,.07)}
  .do-hl b{display:block;color:var(--gold-soft);font-size:12px;font-weight:800;letter-spacing:.03em;margin-bottom:3px}
  .do-hl span{color:var(--muted);font-size:12.5px;line-height:1.5}
  .svc-pay{display:inline-block;margin-top:auto;padding-top:14px;font-size:12.5px;font-weight:700;color:var(--gold);letter-spacing:.03em;align-self:flex-start}
  .svc-pay:hover{color:var(--gold-soft)}

  .founder{display:grid;grid-template-columns:200px 1fr;gap:34px;align-items:center;border:1px solid var(--line);border-radius:20px;padding:34px;background:radial-gradient(circle at 12% 20%,rgba(217,177,84,.10),transparent 55%),linear-gradient(180deg,var(--card),var(--navy-2))}
  @media(max-width:640px){.founder{grid-template-columns:1fr;text-align:center}}
  .founder .mono{font-family:'Anton';font-size:70px;color:var(--gold);width:180px;height:180px;border-radius:50%;border:2px solid rgba(217,177,84,.4);display:grid;place-items:center;background:rgba(6,20,42,.5);margin:0 auto;background-size:cover;background-position:center}
  .founder h3{font-size:clamp(26px,5vw,40px)}
  .founder .role{color:var(--gold-soft);font-weight:700;margin-top:4px}
  .founder p{color:var(--muted);margin-top:14px;font-size:16px;max-width:62ch}
  .creds{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
  @media(max-width:640px){.creds{justify-content:center}}
  .cred{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:999px;border:1px solid var(--line);color:#cdd9ec;background:rgba(8,26,51,.5)}
  .founder-contact{display:inline-flex;align-items:center;gap:9px;margin-top:20px;padding:11px 20px;border-radius:999px;border:1px solid var(--line);color:var(--gold-soft);font-weight:700;font-size:13.5px;transition:.22s}
  .founder-contact:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-2px)}
  .founder-contact .ic{font-size:15px;line-height:1}

  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px}
  .chip{padding:9px 17px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:700;font-size:13.5px;cursor:pointer;transition:.18s}
  .chip:hover{color:var(--ink)}.chip.active{background:var(--gold);color:#05101f;border-color:var(--gold)}
  .roster{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  @media(max-width:900px){.roster{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.roster{grid-template-columns:1fr}}
  /* color:var(--ink) is explicit so cards render identically whether the element is
     an <a> (players with a static page) or a <button> (players without one). A button
     otherwise inherits the UA default `buttontext` (black), which made some player
     names render dark while others were light — the "inconsistent name color" bug. */
  .pcard{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;background:linear-gradient(180deg,var(--card),var(--navy-2));transition:.25s;text-align:left;width:100%;color:var(--ink)}
  .pcard:hover{transform:translateY(-5px);border-color:var(--gold);box-shadow:0 18px 40px -20px rgba(0,0,0,.8)}
  .pcard .top{position:relative;height:150px;display:grid;place-items:center;background:radial-gradient(circle at 50% 22%,#16386a,#0a1f3c);overflow:hidden;background-size:cover;background-position:center}
  .pcard .top::after{content:"";position:absolute;inset:0;opacity:.07;background-image:repeating-linear-gradient(135deg,#fff 0 1px,transparent 1px 8px)}
  .mono{font-family:'Anton';font-size:46px;color:var(--gold);z-index:1;width:96px;height:96px;border-radius:50%;border:2px solid rgba(217,177,84,.4);display:grid;place-items:center;background:rgba(6,20,42,.45)}
  .tier{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:rgba(6,20,42,.7);border:1px solid var(--line);color:var(--gold-soft);z-index:2}
  .flag{position:absolute;top:12px;left:12px;font-size:19px;z-index:2;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));display:flex;align-items:center;gap:5px}
  /* Image-based country flags (flagcdn) — reliable cross-platform, unlike emoji flags. */
  .flag .flagimg{height:22px;width:auto;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.5);display:block}
  .flag .flagimg.heritageimg{height:17px}
  .pcard .country .cflagimg{height:13px;width:auto;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.35);flex:none}
  .sh-flags{display:inline-flex;align-items:center;gap:6px;vertical-align:middle}
  .sh-flags .flagimg{height:20px;width:auto;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.5)}
  .sh-flags .flagimg.heritageimg{height:16px}
  .pcard .body{padding:17px 18px 20px}
  .pcard .body h3{font-size:19px;line-height:1.15}
  .pcard .pos{color:var(--gold-soft);font-size:13px;font-weight:700;margin-top:3px}
  /* Level classification badge (College/International/Pro) — teal pill, distinct from the
     gold position text. Used on the roster card body and inline in the detail modal. */
  .lvl{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:rgba(45,150,160,.14);border:1px solid var(--teal-soft);color:var(--teal-soft);line-height:1.1;white-space:nowrap}
  .pcard .lvl{margin-top:9px}
  .sh-pos .lvl{margin-left:9px;vertical-align:middle}
  .pcard .country{color:var(--muted);font-size:13px;margin-top:9px;display:flex;align-items:center;gap:6px}
  .pcard .country .cflag{font-size:15px;line-height:1;flex:none}
  .pcard .team{color:var(--muted);font-size:13px;margin-top:11px;display:flex;align-items:center;gap:7px}
  .pcard .team::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--teal-soft);flex:none}
  .pcard .view{margin-top:14px;font-size:12.5px;font-weight:700;color:var(--gold);letter-spacing:.04em}

  /* events */
  .ev-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
  .ev-card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:linear-gradient(180deg,var(--card),var(--navy-2));transition:.25s}
  .ev-card:hover{transform:translateY(-4px);border-color:var(--gold)}
  .ev-img{height:130px;background:radial-gradient(circle at 70% 20%,rgba(217,177,84,.25),#0a1f3c);display:grid;place-items:center;font-size:38px;background-size:cover;background-position:center;position:relative}
  .ev-status{position:absolute;top:12px;left:12px;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--line)}
  .ev-status.up{background:var(--gold);color:#05101f;border-color:var(--gold)}
  .ev-status.past{background:rgba(6,20,42,.7);color:var(--muted)}
  .ev-body{padding:18px}
  .ev-body h3{font-size:19px}
  .ev-meta{color:var(--gold-soft);font-size:13px;font-weight:700;margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}
  .ev-body p{color:var(--muted);font-size:14px;margin-top:10px}
  .ev-body .ev-tags{color:var(--teal-soft);font-size:12.5px;margin-top:8px;line-height:1.5}
  .ev-body .ev-link{display:inline-block;font-size:12.5px;font-weight:700;color:var(--gold);letter-spacing:.04em}
  .ev-actions{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .ev-media-btn{background:none;border:0;padding:0;cursor:pointer;font-family:inherit}
  .ev-card.has-media{cursor:pointer}
  .ev-card.has-media:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* testimonials */
  .testi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
  .testi-all{display:grid;gap:16px}
  .testi{border:1px solid var(--line);border-radius:18px;padding:26px 24px;background:linear-gradient(180deg,var(--card),var(--navy-2));position:relative}
  .testi .q{font-size:40px;font-family:'Anton';color:rgba(217,177,84,.4);line-height:.6}
  .testi p{font-size:16px;color:#d6e1f2;margin:8px 0 18px}
  .testi .who{display:flex;align-items:center;gap:12px}
  .testi .av{width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(217,177,84,.4);display:grid;place-items:center;font-family:'Anton';color:var(--gold);font-size:16px;background:rgba(6,20,42,.5)}
  .testi .nm{font-weight:700;font-size:14.5px}.testi .rl{color:var(--muted);font-size:12.5px}

  .join{border:1px solid var(--line);border-radius:20px;padding:34px;background:linear-gradient(180deg,var(--card),var(--navy-2))}
  .join .tagline{font-family:'Anton';text-transform:uppercase;color:var(--gold);font-size:clamp(18px,3vw,26px);margin-bottom:16px;letter-spacing:.02em}
  .join-pitch{color:var(--muted);font-size:15px;line-height:1.65;max-width:64ch;margin:0 0 26px}
  /* Honeypot: off-screen (not display:none, so bots still auto-fill it) — a real
     visitor never sees or fills it, so any value means the submission is a bot. */
  .hp{position:absolute!important;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;opacity:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}
  .field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
  .field label{font-size:13px;font-weight:700;color:var(--gold-soft);letter-spacing:.02em}
  .field input,.field select,.field textarea{background:rgba(6,20,42,.6);border:1px solid var(--line);border-radius:11px;padding:13px 14px;color:var(--ink);font-family:inherit;font-size:15px;outline:none;transition:.18s}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
  .field textarea{resize:vertical;min-height:90px}.field select{appearance:none;cursor:pointer}
  /* Application form: two-column rows (name, phone+code) + upload hints */
  .af-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .af-phone{grid-template-columns:110px 1fr}
  .af-row .field{margin-bottom:0}
  .af-row+.af{margin-top:16px}
  .fhint{color:var(--muted);font-size:12px;margin-top:-3px}
  .field input[type=file]{padding:11px 12px;font-size:14px;cursor:pointer}
  .field.invalid input,.field.invalid select,.field.invalid textarea{border-color:#e05d5d}
  @media(max-width:480px){.af-row{grid-template-columns:1fr}.af-phone{grid-template-columns:90px 1fr}}
  .phone-row{display:flex;gap:8px}
  .phone-row .phone-cc{flex:0 0 auto;width:auto;max-width:142px}
  .phone-row .phone-num{flex:1;min-width:0}
  .form-msg{display:none;margin-top:14px;padding:14px 16px;border-radius:12px;background:rgba(217,177,84,.12);border:1px solid var(--gold);color:var(--gold-soft);font-weight:600}
  .form-msg.show{display:block}
  /* Terms & Conditions acceptance (item 8) — required before purchase/signup submits. */
  .tc{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;color:var(--muted);margin:2px 0 14px;line-height:1.5;text-align:left;flex-wrap:wrap;cursor:pointer}
  .tc input{margin-top:2px;flex:none;width:16px;height:16px;accent-color:var(--gold);cursor:pointer}
  .tc-more{color:var(--gold-soft);font-weight:700;text-decoration:underline}

  .band{position:relative;z-index:1;margin:30px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:linear-gradient(120deg,rgba(217,177,84,.10),transparent)}
  .band-in{padding:58px 0;text-align:center}.band h2{font-size:clamp(28px,5vw,50px)}
  .band p{color:var(--muted);margin:14px auto 26px;max-width:52ch}

  footer{position:relative;z-index:1;border-top:1px solid var(--line);padding:46px 0 70px}
  .foot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}
  .foot .muted{color:var(--muted);font-size:13.5px;margin-top:14px}
  .foot-links{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
  @media(max-width:560px){.foot-links{align-items:flex-start}}
  .pill{display:inline-flex;align-items:center;gap:9px;color:var(--gold-soft);font-weight:700;border:1px solid var(--line);padding:10px 16px;border-radius:999px;transition:.2s}
  .pill:hover{border-color:var(--gold);background:rgba(217,177,84,.08)}
  /* CeasAI cross-promo strip at the very bottom of the footer (subtle credit) */
  .ceasai{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);text-align:center}
  .ceasai a{font-size:12.5px;color:var(--muted);transition:.2s;display:inline-flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
  .ceasai a:hover{color:var(--gold-soft)}
  .ceasai-logo{width:34px;height:34px;border-radius:8px;display:block;flex:none}
  /* CeasAI social icons — small square icon buttons matching the footer aesthetic. */
  .ceasai-social{display:inline-flex;gap:10px;align-items:center;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .ceasai-social a{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);color:var(--muted);transition:.2s}
  .ceasai-social a:hover{border-color:var(--gold);color:var(--gold-soft);background:rgba(217,177,84,.08)}

  .modal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center}
  .modal.open{display:flex}
  .modal .scrim{position:absolute;inset:0;background:rgba(3,10,22,.78);backdrop-filter:blur(4px)}
  .sheet{position:relative;z-index:2;width:100%;max-width:680px;max-height:90vh;overflow:auto;background:linear-gradient(180deg,var(--navy-3),var(--navy-2));border:1px solid var(--line);border-radius:22px 22px 0 0;animation:rise .3s ease}
  @media(min-width:700px){.modal{align-items:center}.sheet{border-radius:22px}}
  @keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
  .sh-top{padding:30px 28px;display:flex;gap:20px;align-items:center;border-bottom:1px solid var(--line);background:radial-gradient(circle at 80% 0%,rgba(217,177,84,.12),transparent 60%)}
  .sh-mono{font-family:'Anton';font-size:40px;color:var(--gold);width:88px;height:88px;flex:none;border-radius:50%;border:2px solid rgba(217,177,84,.4);display:grid;place-items:center;background:rgba(6,20,42,.5);background-size:cover;background-position:center}
  .sheet h3{font-size:clamp(24px,5vw,34px)}
  .sh-pos{color:var(--gold-soft);font-weight:700;margin-top:4px}.sh-meta{color:var(--muted);font-size:14px;margin-top:8px}
  /* Bottom-sheet modal is flush to the screen bottom on mobile, so pad its body
     past the iOS home indicator (0 fallback elsewhere) — matches footer/install. */
  .sh-body{padding:26px 28px calc(34px + env(safe-area-inset-bottom,0px))}.sh-body p.bio{font-size:16px;color:#d6e1f2;margin-bottom:24px}
  .sh-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
  .sh-stat{flex:1;min-width:120px;border:1px solid var(--line);border-radius:13px;padding:14px 16px;background:rgba(8,26,51,.5)}
  .sh-stat b{font-family:'Anton';font-size:22px;color:var(--gold);display:block;line-height:1.1}
  .sh-stat span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .sh-label{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-soft);font-weight:700;margin-bottom:12px}
  .team-chips{display:flex;gap:9px;flex-wrap:wrap}
  .sh-contact{margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
  .sh-contact-p{color:var(--muted);font-size:14px;margin:6px 0 16px}
  .team-chip{font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--line);color:#cdd9ec;background:rgba(8,26,51,.5)}
  /* self-entered per-season stats (derived AVG/OBP/SLG · ERA/WHIP · Fld% computed on render) */
  .ss-block{margin-bottom:18px}
  .ss-title{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-soft);font-weight:700;margin-bottom:8px}
  .ss-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
  .ss-table{width:100%;border-collapse:collapse;font-size:13px;min-width:max-content}
  .ss-table th,.ss-table td{padding:8px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid rgba(217,177,84,.1)}
  .ss-table th:first-child,.ss-table td:first-child,.ss-table th:nth-child(2),.ss-table td:nth-child(2){text-align:left}
  .ss-table thead th{color:var(--gold-soft);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:rgba(8,26,51,.6)}
  .ss-table tbody tr:last-child td{border-bottom:0}
  .ss-table tbody td{color:#d6e1f2}
  .close{position:absolute;top:16px;right:16px;z-index:3;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(6,20,42,.7);color:var(--ink);font-size:18px;cursor:pointer;display:grid;place-items:center}
  .close:hover{border-color:var(--gold);color:var(--gold)}

  .install{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;justify-content:center;padding:0 16px 16px}
  .install.show{display:flex}
  .install .box{display:flex;align-items:center;gap:14px;background:rgba(12,33,67,.96);border:1px solid var(--gold);border-radius:14px;padding:12px 14px;backdrop-filter:blur(8px);max-width:520px;width:100%}
  .install .box b{font-size:14px}.install .box span{font-size:12.5px;color:var(--muted);display:block}
  .install button{margin-left:auto;border:0;background:var(--gold);color:#05101f;font-weight:700;padding:9px 14px;border-radius:999px;cursor:pointer}
  .install .x{margin-left:8px;background:transparent;color:var(--muted);border:1px solid var(--line)}

  /* Footer link through to the admin panel (/admin/) */
  .foot-admin{display:inline-block;margin-top:12px;font-size:12px;color:var(--muted);opacity:.6;cursor:pointer;background:none;border:0;font-family:inherit;text-decoration:none}
  .foot-admin:hover{opacity:1;color:var(--gold-soft)}

  /* form error state (applications) */
  .form-msg.err{background:rgba(224,93,93,.12);border-color:#e05d5d;color:#ffb4b4}

  /* ===== mobile / PWA polish ===== */
  *{-webkit-tap-highlight-color:transparent}
  .install{padding-bottom:calc(16px + env(safe-area-inset-bottom))}      /* clear the iOS home indicator */
  footer{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
  @media(max-width:560px){
    .wrap{padding:0 16px}
    /* 16px form controls stop iOS from auto-zooming on focus */
    .field input,.field select,.field textarea{font-size:16px}
  }

  /* ===== contracts band (layout ref: baseballjobsoverseas.com) ===== */
  .contracts{position:relative;z-index:1;padding:66px 0 8px;text-align:center}
  .contracts h2{font-size:clamp(27px,5.3vw,56px);letter-spacing:.055em;color:var(--ink)}
  .contracts h2 em{font-style:normal;color:var(--gold)}
  .contracts .sub{margin-top:15px;color:var(--muted);font-size:clamp(14px,1.9vw,17px)}
  .contracts .sub b{color:var(--gold-soft);font-weight:700}
  .contracts .rule{width:110px;height:2px;background:var(--gold);margin:26px auto 0;opacity:.75}
  .feature-grid{display:grid;grid-template-columns:1fr;gap:22px;margin:38px auto 0;text-align:left;max-width:720px}
  .stats-in{grid-template-columns:repeat(2,1fr) !important}

  .tcard{display:flex;gap:24px;align-items:flex-start;border:1px solid var(--line);border-radius:18px;padding:30px;background:linear-gradient(180deg,var(--card),var(--navy-2))}
  /* Tall portrait crop, like the reference card — noticeably taller than it is wide. */
  .tcard .shot{width:140px;min-width:140px;height:230px;border-radius:12px;background-size:cover;background-position:center 20%;border:1px solid var(--line)}
  /* Hero side-by-side: headline copy on the left, athlete photo filling the empty space on the right. */
  .hero-grid{display:flex;align-items:center;gap:28px}
  .hero-copy{flex:1 1 58%;min-width:0}
  /* Hero athlete photo. The whole image is shown at its natural aspect ratio (no object-fit
     crop) so the athlete is never cut off, and BOTH the left and right edges fade to transparent
     so the photo dissolves into the navy hero background symmetrically. Both fades span the same
     40% width (left 0->40%, right 60->100%). Top/bottom stay sharp. The mask is on the <img> only,
     so the caption pill stays fully opaque/readable. */
  .hero-photo{flex:0 1 42%;position:relative;margin:0;line-height:0}
  .hero-photo img{display:block;width:100%;height:auto;
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 40%,#000 60%,transparent 100%);
    mask-image:linear-gradient(to right,transparent 0,#000 40%,#000 60%,transparent 100%)}
  .hero-photo figcaption{position:absolute;left:0;bottom:0;background:rgba(5,16,31,.72);color:#fff;font-size:12px;font-weight:600;line-height:1.3;padding:6px 12px;border-top-right-radius:10px;letter-spacing:.01em}
  /* Mobile: no room for two columns — stack the photo below the headline, centered. Natural
     ratio (height:auto) already shows the full image; both fades are softened here (18% span each:
     left 0->18%, right 82->100%) since a centered photo looks better without strong edge cuts. */
  @media(max-width:780px){
    .hero-grid{flex-direction:column;align-items:stretch;gap:0}
    .hero-copy{flex:1 1 auto}
    .hero-photo{flex:1 1 auto;width:100%;max-width:460px;margin:22px auto 0;align-self:center}
    .hero-photo img{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 18%,#000 82%,transparent 100%);
      mask-image:linear-gradient(to right,transparent 0,#000 18%,#000 82%,transparent 100%)}
  }
  /* Desktop/laptop: make the photo read like a large background/hero that bleeds off the RIGHT
     edge of the page. It is absolutely positioned against .hero (a full-width, position:relative
     section), so right:0 is the true viewport edge — the fade therefore dissolves at the page
     boundary, not in the middle of a column. Natural aspect ratio (width set, height:auto) keeps
     the athlete's proportions and shows the whole figure; the copy is constrained to the left
     ~54% and raised above the photo so text never sits on the image. */
  @media(min-width:781px){
    .hero{overflow:hidden}
    .hero-grid{position:static;min-height:clamp(420px,42vw,560px)}
    .hero-copy{flex:0 0 54%;max-width:54%;position:relative;z-index:1}
    .hero-photo{position:absolute;top:50%;right:0;transform:translateY(-50%);
      width:min(48vw,780px);margin:0;z-index:0}
  }
  .tcard .qt{font-size:16.5px;line-height:1.7;color:#d6e1f2;font-style:italic}
  .tcard .nm{margin-top:14px;font-family:'Anton';letter-spacing:.09em;font-size:15px;color:var(--gold-soft);text-transform:uppercase}
  .tcard .rl{font-size:12.5px;color:var(--muted);margin-top:3px}
  @media(max-width:520px){.tcard{flex-direction:column;padding:24px}.tcard .shot{width:100%;height:280px;background-position:center 18%}}

  /* ===== media / gallery ===== */
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
  .gal button{padding:0;cursor:pointer;border-radius:14px;overflow:hidden;border:1px solid var(--line);transition:.25s;background:var(--card);display:block;line-height:0}
  .gal button:hover{transform:translateY(-3px);border-color:var(--gold)}
  .gal img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
  .reel{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
  .reel::-webkit-scrollbar{height:6px}
  .reel::-webkit-scrollbar-thumb{background:rgba(217,177,84,.35);border-radius:9px}
  /* Uniform 16:9 cards. Two clips are portrait, so without a fixed ratio + object-fit
     the strip renders with ragged, mismatched card heights. */
  .reel video{flex:0 0 auto;width:250px;aspect-ratio:16/9;object-fit:cover;border-radius:14px;border:1px solid var(--line);background:#04101f;scroll-snap-align:start}
  .sub-label{font-size:11.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--teal-soft);margin:32px 0 14px}
  .lightbox img{width:100%;border-radius:12px;display:block}

  /* ===== roster paywall (€49.99 unlock-code gate) ===== */
  .roster-wrap{position:relative}
  /* The locked gate overlay is position:absolute;inset:0, so it takes the wrap's
     height. A sport/position filter matching few or zero athletes would otherwise
     shrink the wrap below the gate card, letting the gate spill over the sections
     above/below (the "filter tabs break the layout" bug). A min-height reserves room
     for the overlay no matter how many cards match; a larger reserve on narrow screens
     covers the taller stacked gate card. Only applies while locked. */
  .roster-wrap.is-locked{min-height:560px}
  @media(max-width:560px){.roster-wrap.is-locked{min-height:660px}}
  .roster-empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:34px 12px;font-size:15px}
  .roster-wrap.is-locked .roster{filter:blur(9px) saturate(.55);pointer-events:none;user-select:none;max-height:600px;overflow:hidden}
  .roster-wrap.is-locked::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,20,42,.3),rgba(6,20,42,.93));pointer-events:none;border-radius:18px}
  .gate{display:none}
  .roster-wrap.is-locked .gate{display:flex;position:absolute;inset:0;align-items:center;justify-content:center;z-index:3;padding:18px}
  .gate-pay-note{color:var(--muted);font-size:12.5px;margin-top:12px;line-height:1.5}
  .gate-need{display:inline-block;margin-top:16px;font-size:12.5px;font-weight:600;color:var(--gold-soft)}
  .gate-need:hover{color:var(--gold)}
  .gate-in{max-width:520px;width:100%;text-align:center;border:1px solid var(--gold);border-radius:20px;padding:32px 28px;background:linear-gradient(180deg,rgba(12,33,67,.97),rgba(6,20,42,.99));box-shadow:0 26px 60px rgba(0,0,0,.55)}
  .gate-lock{font-size:25px;margin-bottom:10px}
  .gate-in h3{font-family:'Anton';font-size:23px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:9px}
  .gate-in p{color:var(--muted);font-size:14.5px;margin-bottom:20px}
  .gate-price{font-family:'Anton';font-size:42px;color:var(--gold);line-height:1}
  .gate-price small{display:block;font-family:'Hanken Grotesk';font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:8px;font-weight:700}
  .gate-or{margin:20px 0 11px;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  /* The access-code label reuses .gate-or's type treatment (and therefore the redesign's
     light-on-navy override) so it needs no colour of its own; <label> is inline by
     default, which would drop .gate-or's vertical margins, hence display:block. */
  .gate-label{display:block}
  .gate-code{display:flex;gap:8px}
  .gate-code input{flex:1;min-width:0;background:rgba(6,20,42,.8);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);font-size:15px;font-weight:600;letter-spacing:.05em}
  .gate-code input:focus{outline:0;border-color:var(--gold)}
  .gate-code button{background:transparent;border:1px solid var(--gold);color:var(--gold-soft);border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:14px;white-space:nowrap}
  .gate-code button:hover{background:var(--gold);color:#05101f}
  /* Profile-creation section (€129.99) — a marketing card that links to the real
     account flow at /register/. (Was a client-side code gate before Phase 1.) */
  .pcreate{display:flex;justify-content:center}
  .pc-includes{list-style:none;text-align:left;margin:6px auto 18px;max-width:380px;display:grid;gap:9px}
  .pc-includes li{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:#d6e1f2}
  .pc-includes li::before{content:"✓";color:var(--teal-soft);font-weight:800;flex:none}
  .pc-access{margin-top:12px;font-size:13px;font-weight:700;color:var(--gold-soft);letter-spacing:.02em}
  /* Two-tier profile pricing (item 6) — informational cards, not payment buttons. */
  .pc-tiers{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:10px 0 4px;text-align:left}
  @media(max-width:560px){.pc-tiers{grid-template-columns:1fr}}
  .pc-tier{border:1px solid var(--line);border-radius:16px;padding:20px 18px;background:rgba(6,20,42,.4);display:flex;flex-direction:column;gap:10px}
  .pc-tier-plus{border-color:var(--gold);background:linear-gradient(180deg,rgba(217,177,84,.08),rgba(6,20,42,.4))}
  .pc-tier-name{font-weight:800;font-size:13px;color:var(--gold-soft);letter-spacing:.03em;text-transform:uppercase}
  .pc-tier .gate-price{font-size:32px}
  .pc-tier-desc{font-size:13.5px;color:#d6e1f2;line-height:1.5;flex:1}
  .pc-tier .btn{margin-top:6px;width:100%}
  .gate-err{margin-top:11px;font-size:13px;color:#ff9c9c;display:none}
  .gate-err.show{display:block}
  .unlocked-note{display:none;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--teal-soft);margin-bottom:16px;font-weight:700;letter-spacing:.03em}
  .unlocked-note.show{display:flex}

  /* ===== pay panel (join) ===== */
  .paypanel{margin-top:22px;border:1px solid var(--gold);border-radius:18px;padding:28px 24px;background:linear-gradient(180deg,rgba(217,177,84,.10),rgba(6,20,42,.6));text-align:center;display:none}
  .paypanel.show{display:block}
  .paypanel h3{font-family:'Anton';text-transform:uppercase;letter-spacing:.05em;font-size:21px;margin-bottom:8px}
  .paypanel p{color:var(--muted);font-size:14.5px;margin-bottom:16px}
  .paypanel .amt{font-family:'Anton';font-size:38px;color:var(--gold);line-height:1;margin-bottom:14px}
  .paypanel .fine{font-size:12.5px;color:var(--muted);margin:14px 0 0}

  /* ===== college ===== */
  .col-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:start}
  @media(max-width:820px){.col-grid{grid-template-columns:1fr}}
  .col-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .col-row{display:flex;gap:13px;padding:15px 18px;background:rgba(8,26,51,.3);font-size:14.7px;color:#d6e1f2;align-items:flex-start}
  .col-row:nth-child(even){background:rgba(8,26,51,.55)}
  .col-row i{font-style:normal;color:var(--gold);font-weight:800}
  .col-cta{border:1px solid var(--gold);border-radius:18px;padding:28px 24px;text-align:center;background:linear-gradient(180deg,var(--card),rgba(8,26,51,.5))}
  .col-cta h3{font-family:'Anton';text-transform:uppercase;letter-spacing:.05em;font-size:20px;margin-bottom:8px}
  .col-cta p{color:var(--muted);font-size:14px;margin-bottom:16px}
  .col-price{font-family:'Anton';font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:16px}

  /* ======================================================================
     2026-09 HOMEPAGE REDESIGN — ROUND 2 (light theme, mockup-matched)
     Reference: site/design/homepage-mockup.jpg
     Appended last so it overrides everything above without rewriting it.
     The page is now LIGHT: white / #f4f5f7 bands with navy text. Navy is kept
     only for the nav, the hero band, athlete cards, the services card, the JOIN
     card header, the closing band and the footer. Palette is navy/gold/teal —
     every red in the mockup is rendered in --gold.
     ====================================================================== */

  :root{
    --paper:#ffffff; --paper-2:#f4f5f7; --line-2:#e5e7eb; --field-line:#d7dbe2;
    --tx:#0f2036;       /* navy body text  */
    --tx-m:#5c6b7f;     /* muted body text */
    --shell:1280px; --rail:380px; --gutter:24px; --pad:24px; --hero-h:580px;
    /* distance from the viewport edge to the shell's content edge — used to
       full-bleed section bands leftwards out of the grid column */
    --shell-inset:max(var(--pad), calc((100vw - var(--shell)) / 2 + var(--pad)));
  }

  /* The HTML `hidden` attribute only maps to display:none in the UA sheet, so ANY
     author `display` rule beats it. `.field{display:flex}` was silently defeating
     updateApplyFields(); the step machinery relies on `hidden` too. */
  [hidden]{display:none!important}
  .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  html{background:var(--paper)}
  body{background:var(--paper);color:var(--tx);font-size:15px}
  .bg-fx{display:none}
  a:focus-visible,button:focus-visible,.chip:focus-visible,[tabindex]:focus-visible{
    outline:2px solid var(--gold);outline-offset:2px;border-radius:2px}

  /* ---------- shell ---------- */
  .shell{max-width:var(--shell);margin:0 auto;padding:0 var(--pad);width:100%}
  @media(min-width:1200px){
    .body-shell{display:grid;grid-template-columns:minmax(0,1fr) var(--rail);
      gap:0 var(--gutter);align-items:start}
    .col-main{min-width:0}
    /* The rail is the second cell of the grid's first row, so with align-items:start
       its top already sits level with the hero's top. No offset to keep in sync. */
    .col-rail{position:relative;z-index:5;display:flex;flex-direction:column;gap:16px}
    /* hero bleeds right, underneath the rail, and left to the viewport edge */
    .col-main > .hero{
      margin-right:calc(-1 * (var(--rail) + var(--gutter) + var(--shell-inset)));
      padding-right:calc(var(--rail) + var(--gutter) + var(--shell-inset))}
    /* Everything below the end of the rail reclaims the rail's width, so the page
       never shows an empty right third. The rail is ~1450px tall and the main column
       is past 1850px by the time #roster starts, so these can't collide. */
    .col-main > .full{
      margin-right:calc(-1 * (var(--rail) + var(--gutter) + var(--shell-inset)));
      padding-right:var(--shell-inset)}
  }
  /* Single column below 1200px. `display:contents` dissolves .col-main's box so the
     hero, the stats strip and the rail become siblings in one flex column — that lets the
     rail cards drop in directly BELOW the navy hero+stats block (as specified) instead of
     the whole rail leapfrogging above the hero. */
  @media(max-width:1199.98px){
    .body-shell{display:flex;flex-direction:column}
    .col-main{display:contents}
    .col-main > .hero{order:-3}
    .col-main > .stats{order:-2}
    .col-rail{order:-1;margin:22px 0 0;display:flex;flex-direction:column;gap:16px}
  }

  /* Section bands bleed left out of the grid column to the viewport edge (and to
     both edges once the layout is single-column), like the mockup's full-width bands. */
  .col-main > .sec,.col-main > .stats,.col-main > .band,.col-main > .hero{
    margin-left:calc(-1 * var(--shell-inset));padding-left:var(--shell-inset)}
  @media(max-width:1199.98px){
    .col-main > .sec,.col-main > .stats,.col-main > .band,.col-main > .hero{
      margin-right:calc(-1 * var(--shell-inset));padding-right:var(--shell-inset)}
  }

  /* ---------- buttons (rectangular, uppercase) ---------- */
  .btn{border-radius:3px;padding:12px 22px;font-size:11.5px;font-weight:800;
    letter-spacing:.12em;text-transform:uppercase;border:1px solid transparent;line-height:1.2}
  .btn-gold{background:var(--gold);color:#0f2036;border-color:var(--gold)}
  .btn-gold:hover{background:var(--gold-soft);border-color:var(--gold-soft);transform:none}
  .btn-ghost{background:transparent;border-color:rgba(255,255,255,.6);color:#fff}
  .btn-ghost:hover{border-color:#fff;background:rgba(255,255,255,.08);color:#fff}
  .btn-navy{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn-navy:hover{background:#12304f;border-color:#12304f}
  .btn-outline{background:transparent;border-color:var(--navy);color:var(--navy)}
  .btn-outline:hover{background:var(--navy);color:#fff}

  /* ---------- nav ---------- */
  header.nav{background:var(--navy);border-bottom:0;backdrop-filter:none}
  .nav-in{height:64px;max-width:var(--shell);margin:0 auto;padding:0 var(--pad)}
  .nav-links{gap:26px}
  .nav-links a{position:relative;color:rgba(255,255,255,.8);font-size:11.5px;font-weight:800;
    letter-spacing:.13em;text-transform:uppercase;padding:6px 0}
  .nav-links a:hover{color:#fff}
  .nav-links a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;
    background:var(--gold);transform:scaleX(0);transition:transform .2s}
  .nav-links a:hover::after,.nav-links a.on::after{transform:scaleX(1)}
  .nav-links a.on{color:#fff}
  .lang{border:1px solid rgba(255,255,255,.34);border-radius:3px;padding:2px}
  .lang button{border-radius:2px;font-size:11px;font-weight:800;letter-spacing:.06em;color:rgba(255,255,255,.75)}
  .lang button.on{background:var(--gold);color:#0f2036}
  .signin>summary{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.8)}
  .signin>summary:hover,.signin[open]>summary{color:#fff}
  .signin-menu{background:#fff;border:1px solid var(--line-2);border-radius:4px;box-shadow:0 14px 34px rgba(15,32,54,.18)}
  .signin-menu a{color:var(--tx);font-size:13px;border-radius:3px}
  .signin-menu a:hover,.signin-menu a:focus-visible{background:var(--paper-2);color:var(--tx)}
  .nav-cta{background:var(--gold);border:1px solid var(--gold);color:#0f2036;border-radius:3px;
    padding:11px 20px;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
  .nav-cta:hover{background:var(--gold-soft);border-color:var(--gold-soft);color:#0f2036}

  /* ---------- hero ---------- */
  .hero{position:relative;overflow:hidden;color:#fff;display:flex;align-items:center;
    background:linear-gradient(180deg,#0c2444,var(--navy-2));
    padding:54px 0;min-height:var(--hero-h)}
  .hero-copy{max-width:600px;position:relative;z-index:2}
  /* Photo: large, bottom-aligned to the band, right edge running under the JOIN card.
     BREATHING ROOM (2026-09): the figure used to run 150px under the card, and its
     right-hand mask fade did not reach transparent until 100% of the image width —
     i.e. entirely behind the card. At 1440 the card sliced the photo while it was
     still ~42% opaque, which read as a hard vertical cut rather than a fade. Pulled
     the overlap back to 105px AND brought the fade in so it completes well before
     the card edge, so the photo now dissolves into the navy instead of colliding
     with the panel. */
  .hero-photo{position:absolute;left:auto;top:auto;bottom:0;
    right:calc(var(--shell-inset) + var(--rail) - 105px);
    width:min(62vw,880px);max-width:none;margin:0;transform:none;z-index:0}
  /* Stronger edge fade, per Sam. Fully transparent by 82% of the image width — the
     JOIN card starts at ~88% — so both edges visibly dissolve into the navy instead
     of being clipped. The opaque plateau (30%→64%) is kept wide and centred on the
     batter so the extra fade costs no subject brightness. */
  .hero-photo img{width:100%;height:auto;display:block;
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 30%,#000 64%,transparent 82%);
    mask-image:linear-gradient(to right,transparent 0,#000 30%,#000 64%,transparent 82%)}
  /* Dark scrim over the photo's left side — what the mockup does — so the headline
     always sits on navy and the photo can still be large. It lives INSIDE the figure
     (not on .hero) so the photo credit, which is a child of the same figure, can paint
     above it; a scrim on .hero would sit in a higher stacking context and swallow the
     caption's left half. The img's own mask is untouched. */
  /* 2026-09, per Sam: the opaque plateau used to run to 48% of the photo, which buried
     the bat and both arms — the swing read as a torso. Arath's bat spans roughly 28%→55%
     of the image and the ball sits near 20%, so pulling the plateau back to 26% brings
     the whole swing motion into view. The photo's own mask, its width and its position
     are all UNCHANGED, so the edge fade behaves exactly as before; this only widens the
     window the scrim was leaving. 26% is as far as it goes before the stadium background
     starts reading behind the headline — measured at 1366/1440/1920. */
  .hero-photo::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(90deg,var(--navy) 0 26%,rgba(8,26,51,.62) 40%,rgba(8,26,51,.12) 55%,transparent 68%)}
  .hero-photo figcaption{left:10px;bottom:10px;z-index:2;background:rgba(5,16,31,.82);font-size:10.5px;
    padding:5px 10px;border-radius:3px;color:rgba(255,255,255,.82);border-top-right-radius:3px}
  @media(max-width:1199.98px){.hero{min-height:0;padding:44px 0}}
  /* ---------- hero on phones ----------
     The desktop rule anchors the figure off the RIGHT rail (right: inset + rail - 105px).
     Once the rail collapses that maths walked the photo off the left edge — at 390px it
     sat at left:-143 with the photo credit clipped in half. Below 900px the figure
     returns to normal flow as a full-width band under the copy, with the fade rotated to
     both horizontal edges and a light scrim so the credit stays legible. */
  @media(max-width:900px){
    .hero{display:block}
    /* position:relative (not static) so the photo credit anchors to the FIGURE — under
       static it resolved against .hero and dropped to the bottom of the whole band,
       below the buttons. No negative bottom margin either: it pulled the eyebrow up
       over the photo. */
    .hero-photo{position:relative;right:auto;width:100%;max-width:none;
      margin:0 calc(-1 * var(--shell-inset)) 26px;transform:none}
    .hero-photo img{
      -webkit-mask-image:linear-gradient(to right,transparent 0,#000 16%,#000 84%,transparent 100%);
      mask-image:linear-gradient(to right,transparent 0,#000 16%,#000 84%,transparent 100%)}
    .hero-photo::before{background:linear-gradient(90deg,rgba(8,26,51,.5) 0,transparent 30%,transparent 70%,rgba(8,26,51,.5) 100%)}
    .hero-photo figcaption{left:calc(var(--shell-inset) + 4px);bottom:8px}
    .hero-btns{flex-wrap:wrap}
  }
  /* Tap targets: iOS wants ~44px. The language chips (25px) and the nav CTA (36px)
     were below that on a phone. Desktop sizing is untouched. */
  @media(max-width:900px){
    .lang button{min-height:36px;padding-left:11px;padding-right:11px}
    .nav-cta{min-height:44px;display:inline-flex;align-items:center}
    .hero-btns .btn,.gate-code button,.gate-code input{min-height:44px}
  }
  /* eyebrow: a short gold rule then tiny letter-spaced uppercase text */
  .hero .eyebrow{border:0;padding:0;margin-bottom:18px;gap:12px;color:#fff;
    font-size:10.5px;letter-spacing:.22em;font-weight:800}
  .hero .eyebrow i{width:26px;height:2px;border-radius:0;background:var(--gold);box-shadow:none}
  /* Sized for the LONGEST translation (IT), so the navy band keeps the same height in
     all three languages instead of ballooning when the copy runs long. */
  .hero h1{font-size:clamp(25px,2.85vw,38px);max-width:19ch;line-height:1.04}
  .hero h1 em{color:var(--gold)}
  .hero p.lead{margin-top:18px;max-width:420px;font-size:15px;color:rgba(255,255,255,.84)}
  .hero-btns{margin-top:26px;gap:12px}

  /* ---------- stats strip ---------- */
  .stats{background:#0a1e39;border:0;border-bottom:1px solid rgba(255,255,255,.07)}
  .stats-in{display:flex;grid-template-columns:none;max-width:none;margin:0;padding:0}
  .stat{display:flex;align-items:center;gap:13px;padding:20px 30px;text-align:left;
    border-right:1px solid rgba(255,255,255,.1);flex:0 0 auto}
  .stat:last-child{border-right:0}
  .stat-ic{width:26px;height:26px;color:var(--gold-soft);flex:none}
  .stat b{font-family:'Anton',sans-serif;font-size:26px;color:#fff;display:block;line-height:1}
  .stat span{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:700}

  /* ---------- section shell + heads ---------- */
  .sec{padding:60px 0;background:var(--paper)}
  .sec-gray,.sec-alt{background:var(--paper-2);border:0}
  .sec-head{margin-bottom:30px}
  .sec-head h2{font-family:'Anton',sans-serif;text-transform:uppercase;color:var(--tx);
    font-size:clamp(23px,2.4vw,30px);line-height:1.06;letter-spacing:.01em;margin:0;max-width:22ch}
  .sec-head h2::after{content:"";display:block;width:40px;height:3px;background:var(--gold);margin-top:14px}
  .sec-head .kicker{color:var(--gold);font-size:10.5px;letter-spacing:.22em;font-weight:800;margin-bottom:10px}
  .sec-head p{color:var(--tx-m);font-size:13.5px;margin-top:14px;max-width:60ch}
  .sec-head-c{text-align:center}
  .sec-head-c h2{margin-left:auto;margin-right:auto}
  .sec-head-c h2::after{margin-left:auto;margin-right:auto}
  .sec-head-c p{margin-left:auto;margin-right:auto}
  .sec-cta{text-align:center;margin-top:26px}

  /* contracts headline band */
  .contracts{text-align:center;padding:56px 0 50px}
  .contracts h2{font-size:clamp(24px,3vw,38px);color:var(--tx);letter-spacing:.02em}
  .contracts h2 em{color:var(--gold)}
  .contracts .sub{color:var(--tx-m);font-size:14px;margin-top:12px}
  .contracts .sub b{color:var(--tx)}
  .contracts .rule{width:40px;height:3px;background:var(--gold);margin:20px auto 0;opacity:1}

  /* ---------- WHO I AM / mission ---------- */
  .mission{display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:center}
  @media(max-width:820px){.mission{grid-template-columns:1fr;gap:26px}}
  .mission-copy p{color:var(--tx-m);font-size:14.5px;margin-bottom:12px;max-width:52ch}
  .mission-strong{color:var(--tx)!important;font-weight:700;font-size:15px!important;margin-top:16px}
  .mission-strong b{font-weight:800}
  .mission .creds{margin:16px 0 20px}
  .mission .cred{background:#fff;border:1px solid var(--line-2);color:var(--tx-m);font-size:11.5px;
    border-radius:3px;padding:6px 11px;font-weight:600}
  .sec-alt .mission .cred{background:#fff}
  .mission .founder-contact{margin-top:0;display:inline-flex;gap:9px;align-items:center}
  /* The copy column runs ~500px taller than this figure, so the grid's align-items:center
     stranded the photo mid-row with dead space above and below it. Top-align just the figure
     (leaving .mission's align-items alone) so it reads as paired with the text. */
  .mission-media{margin:0;align-self:start;border-radius:8px;overflow:hidden;border:1px solid var(--line-2);
    box-shadow:0 14px 34px rgba(15,32,54,.12);background:var(--navy)}
  .mm-shot{aspect-ratio:16/10;background-size:cover;background-position:center 18%}
  .mm-cap{display:flex;align-items:center;gap:9px;background:var(--navy);color:#fff;
    padding:11px 14px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
  .mm-cap::before{content:"";width:0;height:0;border-left:8px solid var(--gold);
    border-top:5px solid transparent;border-bottom:5px solid transparent;flex:none}
  .mm-nm{color:var(--gold-soft)}
  .mm-cap span:last-child{color:rgba(255,255,255,.62);font-weight:600}

  /* ---------- roster / athlete carousel ---------- */
  .roster-wrap{position:relative}
  .roster-wrap.is-locked{min-height:0}
  /* Roster teaser (the grid now lives on /roster/) — a single centred card. */
  /* ===== shared "<- Back" link =====
     One definition for every sub-page and drill-down view, so the affordance looks and
     sits the same everywhere: top-left, directly above the page title. /roster/ inherits
     this block verbatim (gen_roster_page.mjs copies the whole <style>), and so do the
     generated players/*.html pages (gen_player_pages pulls the same <style>). The truly
     standalone pages — portal, scout, register, tenerife, admin, privacy, terms — have
     their own stylesheets and carry a byte-identical copy of the two rules below.
     Uses the redesign tokens (--tx-m/--tx) so it reads correctly on the light theme. */
  .backlink{display:inline-flex;align-items:center;gap:7px;margin-bottom:18px;font-size:11.5px;
    font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-m);transition:.2s}
  .backlink:hover{color:var(--tx)}
  /* T&C acceptance inside the roster gate card — the card is centre-aligned, so the
     checkbox row has to be too (the .tc base rule is left-aligned for the forms). */
  .gate-tc{justify-content:center;margin:16px 0 0}
  .roster-teaser{display:flex;justify-content:center}
  .roster-teaser .gate-in{max-width:520px;text-align:center}
  .roster-teaser .rt-open{margin-top:6px;display:inline-block}
  @media(max-width:560px){.roster-wrap.is-locked{min-height:0}}
  .filters{gap:8px;margin-bottom:16px;justify-content:center}
  .chip{border:1px solid var(--line-2);background:#fff;color:var(--tx-m);border-radius:3px;
    font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:9px 15px}
  .chip:hover{color:var(--tx);border-color:#c9cfd8}
  .chip.active{background:var(--navy);border-color:var(--navy);color:#fff}
  .unlocked-note{color:#2b7d6d;justify-content:center;margin-bottom:14px}

  .roster{display:flex;grid-template-columns:none;gap:16px;overflow-x:auto;padding:4px 2px 14px;
    scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .roster::-webkit-scrollbar{display:none}
  .roster>.pcard{flex:0 0 clamp(186px,23%,215px);scroll-snap-align:start}
  .roster-empty{flex:1 1 auto}
  @media(max-width:560px){
    .roster{display:grid;grid-template-columns:1fr;overflow:visible}
    .roster>.pcard{flex:none}
  }
  .ros-arrow{position:absolute;top:44%;z-index:4;width:34px;height:34px;border-radius:4px;
    border:1px solid rgba(255,255,255,.18);background:var(--navy);color:#fff;font-size:19px;
    line-height:1;cursor:pointer;display:grid;place-items:center;
    box-shadow:0 6px 16px rgba(15,32,54,.28);transition:.18s}
  .ros-arrow:hover{background:#12304f}
  .ros-prev{left:-14px}.ros-next{right:-14px}
  .roster-wrap.is-locked .ros-arrow{display:none}
  @media(max-width:560px){.ros-arrow{display:none}}

  /* athlete card — portrait, photo fading into navy */
  .pcard{display:flex;flex-direction:column;border:0;border-radius:6px;overflow:hidden;
    background:var(--navy);color:#fff;box-shadow:0 8px 22px rgba(15,32,54,.14)}
  .pcard:hover{transform:translateY(-3px);border-color:transparent;box-shadow:0 16px 34px rgba(15,32,54,.24)}
  .pcard .top{height:auto;aspect-ratio:3/4;flex:none;position:relative;background-size:cover;background-position:center 22%}
  .pcard .top::after{opacity:0}
  .pcard .top::before{content:"";position:absolute;inset:0;z-index:1;
    background:linear-gradient(180deg,transparent 45%,rgba(8,26,51,.65) 78%,var(--navy) 100%)}
  .pcard .body{flex:1 1 auto;display:flex;flex-direction:column;align-items:flex-start;padding:0 15px 16px;margin-top:-30px;position:relative;z-index:2}
  .pcard .pos{order:1;margin:0;background:none;border:0;padding:0;border-radius:0;
    color:rgba(255,255,255,.66);font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
  .pcard .pos:empty{display:none}
  .pcard .body h3{order:2;font-family:'Anton',sans-serif;font-size:17px;margin-top:5px;
    letter-spacing:.03em;color:#fff;line-height:1.1}
  .pcard .country{order:3;margin-top:9px;font-size:11.5px;color:rgba(255,255,255,.8);gap:7px}
  .pcard .country .cflagimg{width:16px;height:16px;border-radius:50%;object-fit:cover;box-shadow:none}
  .pcard .team{order:4;margin-top:7px;font-size:11.5px;color:rgba(255,255,255,.62);line-height:1.35}
  .pcard .team::before{display:none}
  .pcard .lvl{order:5;margin-top:8px;background:none;border:0;padding:0;color:rgba(255,255,255,.62);
    font-size:10.5px;letter-spacing:.09em;font-weight:700}
  .pcard .view{order:6;margin-top:11px;font-size:9.5px;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase;color:var(--gold-soft)}
  .pcard .tier{background:rgba(8,26,51,.8);border:0;color:var(--gold-soft);z-index:3}
  .pcard .flag{z-index:3}
  .pcard .mono{font-size:36px;width:76px;height:76px}
  .roster-wrap.is-locked .roster{max-height:520px}

  /* ---------- college ---------- */
  .col-grid{gap:20px}
  .col-list{border:1px solid var(--line-2);border-radius:6px;background:#fff;overflow:hidden}

  /* ---------- events ---------- */

  /* ---------- testimonials list (photo left, quote right) ---------- */

  /* ===== PRICING TEMPORARILY HIDDEN — 2026-09 =====
     Sam is closing the Delaware LLC and moving operations to Italy; no pricing or
     payment may be displayed until the Italian entity + banking are ready. This is a
     HIDE, not a delete: every price string, tier value, Stripe URL constant and DB

     matching `.ps-price` rule in tenerife/index.html + register/index.html, and flip

  .gate-price{display:none}
  .pc-access{color:var(--tx-m);font-weight:600}

  /* ---------- closing band ---------- */

  /* ---------- JOIN card ---------- */
  .joinpanel{scroll-margin-top:80px;background:#fff;border:1px solid var(--line-2);border-radius:6px;

  .jp-steps li{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative;min-width:0}
  .jp-steps li::before{content:"";position:absolute;top:14px;right:50%;width:100%;height:1px;
    background:rgba(255,255,255,.24);z-index:0}

  .jp-steps li b{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;position:relative;z-index:1;
    font-family:'Hanken Grotesk',sans-serif;font-size:12.5px;font-weight:800;line-height:1;

  .jp-body{padding:22px 22px 24px;background:#fff}

  .joinpanel .jp-pitch{margin-bottom:16px}

  .joinpanel .field label{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#54637a}
  .jp-body .field>label::after{content:"*";color:var(--gold);margin-left:3px}
  .jp-body .field-code>label::after,.jp-body .field-opt>label::after{content:""}
  .joinpanel .field{min-width:0}
  .joinpanel .field input,.joinpanel .field select,.joinpanel .field textarea{
    background:#fff;border:1px solid var(--field-line);border-radius:3px;padding:10px 11px;
    font-size:13.5px;color:var(--tx);width:100%;min-width:0;max-width:100%}
  .joinpanel .field input::placeholder{color:#9aa5b4}
  .joinpanel .field input:focus,.joinpanel .field select:focus,.joinpanel .field textarea:focus{

  .joinpanel .field textarea{min-height:84px}
  .joinpanel .af-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .joinpanel .af-phone{grid-template-columns:82px 1fr}
  .joinpanel .fhint{color:var(--tx-m);font-size:10.5px}
  .joinpanel .field.invalid input,.joinpanel .field.invalid select,.joinpanel .field.invalid textarea{border-color:#c8553d}
  .joinpanel .tc{font-size:12px;color:var(--tx-m);margin:10px 0 0}

    background:rgba(217,177,84,.13);border-color:var(--gold);color:#7a5f1c}
  .joinpanel .form-msg.err{background:rgba(200,85,61,.09);border-color:#c8553d;color:#a13f2a}
  .jp-nav{display:flex;flex-direction:column;gap:9px;margin-top:18px}
  .jp-nav .btn{width:100%;text-align:center;position:relative;padding:13px 20px}
  .jp-next::after{content:"→";position:absolute;right:16px;top:50%;transform:translateY(-50%)}
  .jp-back{background:none;border:0;padding:5px;font-family:inherit;color:var(--tx-m);
    font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    cursor:pointer;text-decoration:underline}
  .jp-back:hover{color:var(--tx)}

  /* ---------- rail cards ---------- */
  .rail-card{border-radius:6px;padding:22px 20px}
  .rail-title{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
    text-align:center;margin-bottom:16px}
  .svc-card{background:var(--navy);color:#fff}
  .svc-card .rail-title{color:#fff}
  /* Six-column track so the five services read as 3 + 2 with the SECOND row centred,
     rather than leaving a hole in the bottom-right cell. */
  .svc-grid{display:grid;grid-template-columns:repeat(6,1fr)}
  .svc-cell{grid-column:span 2;display:flex;flex-direction:column;align-items:center;gap:9px;
    text-align:center;padding:16px 6px;color:rgba(255,255,255,.86);
    border-right:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1);transition:.18s}
  .svc-cell:nth-child(3){border-right:0}
  .svc-cell:nth-child(4){grid-column:2/4}
  .svc-cell:nth-child(5){grid-column:4/6;border-right:0}
  .svc-cell:nth-child(n+4){border-bottom:0}
  a.svc-cell:hover{color:var(--gold-soft)}
  .svc-cell svg{width:30px;height:30px;flex:none}
  .svc-t{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;line-height:1.35}
  @media(max-width:520px){
    .svc-grid{grid-template-columns:repeat(2,1fr)}

    .svc-cell:nth-child(3){border-right:1px solid rgba(255,255,255,.1)}
    .svc-cell:nth-child(2n){border-right:0}
    .svc-cell:nth-child(n+4){border-bottom:1px solid rgba(255,255,255,.1)}
    .svc-cell:nth-child(n+5){border-bottom:0;border-right:0}
  }

  .rail-testi{background:#fff;border:1px solid var(--line-2);box-shadow:0 8px 24px rgba(15,32,54,.07);
    display:grid;grid-template-columns:1fr 92px;gap:14px;align-items:start;position:relative}
  .rail-testi .rt-q{grid-column:1/-1;font-family:'Anton',sans-serif;font-size:38px;color:var(--gold);line-height:.5;margin-bottom:6px}
  .rail-testi .qt{font-size:12.5px;color:var(--tx-m);line-height:1.6;font-style:normal}
  .rail-testi .rt-who{margin-top:12px}
  .rail-testi .nm{font-family:'Anton',sans-serif;font-size:13px;letter-spacing:.05em;color:var(--tx);text-transform:uppercase}
  .rail-testi .rl{font-size:11.5px;color:var(--tx-m);margin-top:2px}
  .rail-testi .rt-shot{width:92px;height:118px;border-radius:5px;background-size:cover;background-position:center 18%}
  .rail-testi .sec-cta{grid-column:1/-1;margin-top:6px}
  .rail-testi .sec-cta .btn{width:100%;padding:10px 14px}

  /* ---------- gate (sits over the blurred navy cards) ---------- */
  .gate-in{background:var(--navy);border:1px solid rgba(255,255,255,.14);border-radius:6px;color:#fff;
    box-shadow:0 26px 60px rgba(15,32,54,.4)}
  .gate-in h3{font-family:'Anton',sans-serif;color:#fff}
  .gate-in p{color:rgba(255,255,255,.72)}
  .gate-or{color:rgba(255,255,255,.6)}
  .gate-code input{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.22);color:#fff;border-radius:3px}
  .gate-code button{border-radius:3px;border-color:var(--gold);color:var(--gold-soft);
    font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
  .gate-code button:hover{background:var(--gold);color:#0f2036}
  .gate-need{color:var(--gold-soft)}
  /* The Terms & Conditions row sits INSIDE this navy card, but .tc / .tc-more are themed
     for the light forms (--tx-m #5c6b7f and --tx #0f2036) — i.e. navy text on a navy
     card. Measured 3.2:1 for the label and 1.06:1 for "Read more", which is effectively
     invisible. The card already restyles its h3 / p / gate-or / input / button / gate-need
     for this background; the T&C row was added later and was simply missed.
     Backgrounds are untouched — only the text colour changes, reusing the exact values
     this same card already uses: the body-copy white for the label, and the gate-need
     gold for the link. */
  .gate-in .tc{color:rgba(255,255,255,.72)}
  .gate-in .tc-more{color:var(--gold-soft)}
  .roster-wrap.is-locked::after{background:linear-gradient(180deg,rgba(244,245,247,.2),rgba(244,245,247,.75));border-radius:6px}

  /* ---------- footer ---------- */
  footer{background:var(--navy);border-top:0;color:#fff;padding:52px 0 0}
  .foot{display:grid;grid-template-columns:1.25fr .9fr .9fr 1.3fr;gap:34px;align-items:start;
    padding-bottom:34px}
  .foot-col{min-width:0}
  .foot-h{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#fff;margin-bottom:14px}
  .foot-nav{display:flex;flex-direction:column;gap:9px;align-items:flex-start}
  .foot-nav-nohead{padding-top:25px}
  @media(max-width:900px){.foot-nav-nohead{padding-top:0}}
  .foot-nav a{color:rgba(255,255,255,.62);font-size:12.5px;font-weight:500;letter-spacing:0;text-transform:none}
  .foot-nav a:hover{color:var(--gold-soft)}
  .foot-contact{display:flex;flex-direction:column;gap:11px;align-items:flex-start}
  .foot-contact a{display:inline-flex;align-items:center;gap:9px;color:rgba(255,255,255,.62);font-size:12.5px;word-break:break-word}
  .foot-contact a:hover{color:var(--gold-soft)}
  .foot-contact svg{flex:none;color:var(--gold-soft)}
  .foot-social{display:flex;gap:9px;margin-top:16px}
  .foot-social a{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.28);
    display:grid;place-items:center;color:rgba(255,255,255,.75);transition:.18s}
  .foot-social a:hover{border-color:var(--gold);color:var(--gold-soft)}
  .foot-logo{height:52px}
  footer .ceasai{margin-top:0;padding:20px 0;border-top:1px solid rgba(255,255,255,.09);border-bottom:0}
  footer .ceasai a{color:rgba(255,255,255,.5)}
  footer .ceasai a:hover{color:var(--gold-soft)}
  footer .ceasai-social a{border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.6);border-radius:50%}
  .foot-bar{background:rgba(0,0,0,.22);padding:14px 0 8px}
  .foot-bar-in{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
  .foot-bar .muted{color:rgba(255,255,255,.5);font-size:12px;margin:0}
  .foot-bar .foot-admin{margin:0;font-size:11px;color:rgba(255,255,255,.32)}
  .foot-bar .foot-admin:hover{color:var(--gold-soft)}
  /* esm-legal.js appends its Privacy · Terms row as the last child of <footer>. Give it
     the same darker ground as .foot-bar so the copyright line and the legal links read as
     one bottom bar instead of two overlapping strips. */
  footer .esml-foot{margin-top:0;background:rgba(0,0,0,.22);
    padding:0 var(--pad) calc(15px + env(safe-area-inset-bottom,0px))}
  @media(max-width:900px){.foot{grid-template-columns:1fr 1fr;gap:28px}}
  @media(max-width:560px){.foot{grid-template-columns:1fr;gap:24px}}

  /* ---------- modal / install keep the dark treatment ---------- */
  .sheet{border-radius:6px}
  .install .box{border-radius:5px}
  .install button{border-radius:3px;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}

  /* ---------- narrow phones ---------- */
  @media(max-width:560px){
    :root{--pad:16px}
    .sec{padding:44px 0}
    .joinpanel .field input,.joinpanel .field select,.joinpanel .field textarea{font-size:16px}
    .jp-steps li span{font-size:8px;letter-spacing:.04em}
    .nav-cta{padding:9px 12px;font-size:10.5px;letter-spacing:.07em}
    .signin>summary{font-size:10.5px;letter-spacing:.07em}

    .stat b{font-size:22px}
  }
  @media(max-width:400px){
    .joinpanel .af-phone{grid-template-columns:1fr}
    .foot-contact a{font-size:11.5px}
    /* Spanish nav overflow fix (2026-09, found during the redesign merge). "Aplica Ahora"
       is the longest of the three CTA labels and pushed the nav bar 16px past a 390px
       viewport — EN/IT fitted, ES did not. Tighten the BAR SPACING rather than the type,
       so EN/IT are visually unchanged, ES simply stops overflowing, and the 44px tap
       targets from the max-width:900px block survive (only horizontal padding changes). */
    .nav-in{gap:8px}
    .nav-right{gap:8px}
    .lang button{padding-left:8px;padding-right:8px}
    .nav-cta{padding:9px 10px;letter-spacing:.04em}
  }
  @media(max-width:344px){
    .nav-cta{text-transform:none;letter-spacing:.01em;font-size:11px;padding:8px 10px}
  }
</style>

<body>
<div class="bg-fx"></div>

<header class="nav"><div class="wrap nav-in">

<a id="top"></a>

<!-- ============================================================================
     HERO — full-bleed navy band. Its inner .shell matches the page shell, so the
     copy lines up with the left column while the band itself runs edge to edge and
     the Arath Zapien photo bleeds behind the JOIN card in the right rail.
     The rail (below) is pulled up by --hero-h so the JOIN card's top edge sits
     level with the hero's top, exactly as in the mockup.
     ============================================================================ -->
<!-- ============================================================================
     PAGE SHELL — left main column (~68%) + right rail (~32%). The hero is the first
     item of the main column, and its navy background is padded/negative-margined out
     to the viewport edges so the band reads as full width while its copy stays in the
     left column. Because the hero and the rail are the two cells of the SAME grid row,
     the JOIN card's top edge lines up with the hero's top automatically — no magic
     offset that could drift when a translation runs long.
     ============================================================================ -->
<div class="shell body-shell">

<main class="col-main">

<section class="hero">
  <figure class="hero-photo">
    <img src="assets/arath-zapien.jpg" alt="Arath Zapien, North Central Missouri Pirates"
         loading="eager" fetchpriority="high" decoding="async" onerror="this.closest('figure').style.display='none'" />
    <figcaption>Arath Zapien, North Central Missouri Pirates.</figcaption>
  </figure>
  <div class="hero-copy">
    <span class="eyebrow"><i></i> <span data-i18n="hero_eyebrow"></span></span>
    <h1 class="display" data-i18n-html="hero_h1"></h1>
    <p class="lead" data-i18n="hero_lead"></p>
    <div class="hero-btns">
      <a class="btn btn-gold" href="#roster" data-i18n="hero_btn1"></a>
      <a class="btn btn-ghost" href="#join" data-i18n="hero_btn2"></a>
    </div>
  </div>
</section>

  <!-- Stats strip: our two REAL figures, rendered in the mockup's icon+number+label
       tile style. The icons are decorative inline SVG (aria-hidden), no new copy. -->
  <div class="stats"><div class="stats-in">
    <div class="stat">
      <svg class="stat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/></svg>
      <div><b id="statAthletes">19</b><span data-i18n="stat1"></span></div>

}
