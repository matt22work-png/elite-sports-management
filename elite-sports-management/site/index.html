//  DIAL_CODES table. Emoji flags don't render on Windows, so they're no longer used.)

/* Country-code phone input: a dial-code <select> + a number field, combined into a
   proper international string ("+39 340…") on submit. Curated to ESM's markets
   (Caribbean / Latin America / Europe / US) — the number field takes the rest. */
const DIAL_CODES=[
  {c:"IT",n:"Italy",d:"+39",f:"🇮🇹"},{c:"US",n:"United States",d:"+1",f:"🇺🇸"},
  {c:"DO",n:"Dominican Republic",d:"+1",f:"🇩🇴"},{c:"VE",n:"Venezuela",d:"+58",f:"🇻🇪"},
  {c:"CO",n:"Colombia",d:"+57",f:"🇨🇴"},{c:"MX",n:"Mexico",d:"+52",f:"🇲🇽"},
  {c:"CU",n:"Cuba",d:"+53",f:"🇨🇺"},{c:"PR",n:"Puerto Rico",d:"+1",f:"🇵🇷"},
  {c:"PA",n:"Panama",d:"+507",f:"🇵🇦"},{c:"NI",n:"Nicaragua",d:"+505",f:"🇳🇮"},
  {c:"CR",n:"Costa Rica",d:"+506",f:"🇨🇷"},{c:"ES",n:"Spain",d:"+34",f:"🇪🇸"},
  {c:"CA",n:"Canada",d:"+1",f:"🇨🇦"},{c:"DE",n:"Germany",d:"+49",f:"🇩🇪"},
  {c:"PT",n:"Portugal",d:"+351",f:"🇵🇹"},{c:"FR",n:"France",d:"+33",f:"🇫🇷"},
  {c:"GB",n:"United Kingdom",d:"+44",f:"🇬🇧"},{c:"NL",n:"Netherlands",d:"+31",f:"🇳🇱"},
  {c:"AU",n:"Australia",d:"+61",f:"🇦🇺"},{c:"JP",n:"Japan",d:"+81",f:"🇯🇵"},
  {c:"KR",n:"South Korea",d:"+82",f:"🇰🇷"},{c:"BR",n:"Brazil",d:"+55",f:"🇧🇷"},
  {c:"AR",n:"Argentina",d:"+54",f:"🇦🇷"},{c:"CW",n:"Curaçao",d:"+599",f:"🇨🇼"},
  {c:"AW",n:"Aruba",d:"+297",f:"🇦🇼"},
];
/* ===== Country flags as IMAGES (flagcdn.com), not emoji ==========================
   Windows (Chrome/Edge) — the OS Sam and many of ESM's users run — ships NO emoji-flag
   font, so Unicode flag emoji (🇻🇪 …) render as blank/letter boxes, not flags. Player
   `country` data is also inconsistent: some full names, some stored as a flag emoji, even
   multi ("🇪🇸/🇲🇽/🇻🇪"). So we resolve every player to an ISO-3166 alpha-2 code and render a
   real <img> flag from flagcdn.com — reliable on every OS/browser. The country NAME text is
   still shown beside it, so if the image ever fails to load the label degrades gracefully. */
// name (EN/ES/IT) -> iso2, built from DIAL_CODES (single source of truth, shared with the
// phone input) + market-language aliases for names that appear in EN/ES/IT roster data.
const NAME_ISO = DIAL_CODES.reduce((m,x)=>{ m[x.n.toLowerCase()]=x.c.toLowerCase(); return m; }, {});
Object.assign(NAME_ISO,{"república dominicana":"do","repubblica dominicana":"do","españa":"es","spagna":"es","italia":"it","estados unidos":"us","stati uniti":"us","usa":"us","alemania":"de","germania":"de","méxico":"mx","brasil":"br","francia":"fr","curacao":"cw","gran bretaña":"gb","regno unito":"gb","países bajos":"nl","paesi bassi":"nl"});
const ISO_NAME = DIAL_CODES.reduce((m,x)=>{ m[x.c.toLowerCase()]=x.n; return m; }, {});
// Decode a flag emoji (2 regional-indicator symbols) -> iso2 (e.g. "🇻🇪" -> "ve"), else "".
function emojiToIso(s){
  if(!s) return "";
  const out=[];
  for(const ch of String(s)){ const cp=ch.codePointAt(0); if(cp>=0x1F1E6&&cp<=0x1F1FF){ out.push(String.fromCharCode(cp-0x1F1E6+97)); if(out.length===2)break; } }
  return out.length===2?out.join(""):"";
}
// Best iso2 for a player: a stored flag emoji, else the country (emoji or name).
const iso2For=p=>emojiToIso(p&&p.flag)||emojiToIso(p&&p.country)||NAME_ISO[((p&&p.country)||"").trim().toLowerCase()]||"";
// Human-readable country name, converting emoji-stored countries (incl. multi) back to names.
function displayCountry(p){
  const c=((p&&p.country)||"").trim(); if(!c) return "";
  if(/[\u{1F1E6}-\u{1F1FF}]/u.test(c)){
    const names=[]; let pair="";
    for(const ch of c){ const cp=ch.codePointAt(0); if(cp>=0x1F1E6&&cp<=0x1F1FF){ pair+=String.fromCharCode(cp-0x1F1E6+97); if(pair.length===2){ if(ISO_NAME[pair])names.push(ISO_NAME[pair]); pair=""; } } }
    return names.join(" / ");
  }
  return c;
}
// Render a flag <img> from flagcdn (SVG). alt is empty when a country label sits next to it.
function flagImg(iso,cls,alt){ return iso?`<img class="${cls}" src="https://flagcdn.com/${iso}.svg" alt="${alt?esc(alt):""}" width="28" height="21" loading="lazy" decoding="async">`:""; }
function fillCC(sel, def){ if(!sel)return; sel.innerHTML=DIAL_CODES.map(x=>`<option value="${x.d}"${x.c===def?" selected":""}>${x.f} ${esc(x.n)} ${x.d}</option>`).join(""); }
function combinePhone(ccId, numId){ const cc=document.getElementById(ccId), num=document.getElementById(numId); const n=((num&&num.value)||"").trim(); return n?(((cc&&cc.value)||"")+" "+n).trim():""; }

   `group===tab` match hid ~70% of athletes under every position tab. This tolerant,
   order-sensitive matcher (Two-Way first so P+C combos don't double-count) puts each
   athlete in exactly one tab — no overlap, no gaps — without mutating the DB. */
function posCategory(p){
  const s=((p.group||"")+" "+(p.position||"")).toLowerCase();
  if(!s.trim()) return null;
  if(/two[\s-]*way|\b2\s*ways?\b/.test(s) || (/pitch/.test(s) && /catch/.test(s))) return "Two-Way";
  if(/catch/.test(s)) return "Catcher";
  if(/pitch|\brhp\b|\blhp\b|\brhsp\b|\blhsp\b/.test(s)) return "Pitcher";
  if(/outfield|\bof\b|center\s*field|left\s*field|right\s*field/.test(s)) return "Outfielder";
  if(/infield|shortstop|first\s*base|second\s*base|third\s*base|\b[123]b\b|\bss\b|\bif\b/.test(s)) return "Infielder";
  return null;
}

/* Player photo as a cover background with the per-player focal point + zoom set by the admin
   (players.photo_pos_x/_y/_zoom). This is what keeps heads from being cropped on the fixed-height
   cover boxes (roster card top, modal avatar): background-position moves the focal point and, when
   zoom>1, background-size scales past cover. zoom==1 keeps the exact `cover` behaviour (no gaps). */
const photoBg=p=>{
  if(!p||!p.image)return "";
  const x=(p.photo_pos_x??50),y=(p.photo_pos_y??35),z=(p.photo_zoom??1);
  const size=z>1?`${Math.round(z*100)}%`:"cover";
  return `background-image:url('${p.image}');background-position:${x}% ${y}%;background-size:${size}`;
};

/* Render self-entered per-season stats as batting/pitching/fielding tables.
   Derived stats (AVG/OBP/SLG · ERA/WHIP · Fld%) are computed here from the raw
   inputs, never stored, so they can't drift. Shared shape with portal/register. */
function seasonStatsHTML(seasonStats){
  const rows=Array.isArray(seasonStats)?seasonStats:[];
  if(!rows.length)return"";
  const n=v=>(v===null||v===undefined||v==="")?null:(isFinite(Number(v))?Number(v):null);
  const avg=x=>(x===null||!isFinite(x))?"—":x.toFixed(3).replace(/^0(?=\.)/,"");   // .318 / 1.000
  const two=x=>(x===null||!isFinite(x))?"—":x.toFixed(2);
  const META={
    batting:{label:"Batting",cols:["Season","Team","AB","H","HR","RBI","AVG","OBP","SLG"]},
    pitching:{label:"Pitching",cols:["Season","Team","W","L","ERA","IP","SO","WHIP"]},
    fielding:{label:"Fielding",cols:["Season","Team","G","E","FLD%"]},
  };
  function cell(r,c){
    switch(c){
      case"Season":return esc(r.season||"—");
      case"Team":return esc(r.team||"—");
      case"AVG":{const ab=n(r.AB),h=n(r.H);return avg(ab?(h||0)/ab:null);}
      case"OBP":{const ab=n(r.AB),h=n(r.H),bb=n(r.BB)||0,d=(ab||0)+bb;return avg(d?((h||0)+bb)/d:null);}
      case"SLG":{const ab=n(r.AB),h=n(r.H),d2=n(r["2B"])||0,t3=n(r["3B"])||0,hr=n(r.HR)||0,tb=(h||0)+d2+2*t3+3*hr;return avg(ab?tb/ab:null);}
      case"ERA":{const er=n(r.ER),ip=n(r.IP);return two((ip&&er!==null)?9*er/ip:null);}
      case"WHIP":{const bb=n(r.BB)||0,h=n(r.H)||0,ip=n(r.IP);return two(ip?(bb+h)/ip:null);}
      case"FLD%":{const po=n(r.PO)||0,a=n(r.A)||0,e=n(r.E)||0,tc=po+a+e;return tc?avg((po+a)/tc):"—";}
      default:{const v=n(r[c]);return v===null?"—":esc(String(r[c]));}
    }
  }
  let out="";
  for(const kind of["batting","pitching","fielding"]){
    const list=rows.filter(r=>r&&r.kind===kind);if(!list.length)continue;
    const m=META[kind];
    out+=`<div class="ss-block"><div class="ss-title">${m.label}</div><div class="ss-scroll"><table class="ss-table"><thead><tr>${m.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>`+
      list.map(r=>`<tr>${m.cols.map(c=>`<td>${cell(r,c)}</td>`).join("")}</tr>`).join("")+
      `</tbody></table></div></div>`;
  }
  return out;
}

/* ===== roster paywall (€49.99) =====
   Client-side unlock gate: the valid code's SHA-256 lives in ROSTER_CODE_HASHES and the
   unlock is remembered in localStorage, so a buyer who arranged payment with ESM enters the
   code he is sent just once. Deliberately NOT tied to account creation or admin approval —
   that flow stays on /register/ (€129.99 profile) and /tenerife/ (€599.99) only. */
/* The stored unlock records HOW access was granted, so it can be re-validated on every load:
     { m:'master', c:<normalized code> }  — granted by the rotating admin master code
     { m:'user',   h:<sha-256 hash> }     — granted by a permanent per-user personal code
   A bare presence check (isUnlocked) is safe for rendering because revalidateUnlock() prunes
   any stale/invalid unlock BEFORE render, converting "present" into "present AND still valid". */
function getUnlock(){try{return JSON.parse(localStorage.getItem(UNLOCK_KEY)||"null")}catch(e){return null}}
function isUnlocked(){const u=getUnlock();return !!(u&&(u.m==="master"||u.m==="user"))}
async function sha256Hex(str){
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function applyLockState(){
  const wrap=document.getElementById("rosterWrap");
  const note=document.getElementById("unlockedNote");
  const open=isUnlocked();
  if(wrap)wrap.classList.toggle("is-locked",!open);
  if(note)note.classList.toggle("show",open);
  // Homepage teaser: an unlocked browser additionally gets a one-click link to /roster/.
  // The code form itself is ALWAYS visible (2026-09, per Sam) — it used to be swapped out
  // for the button, so anyone who had already unlocked saw a section with no input at all.
  // Entering a code while unlocked is harmless: it re-validates and redirects the same way.
  const openBtn=document.getElementById("rosterOpen");
  if(openBtn)openBtn.hidden=!open;
}
function unlockRoster(u){

function lockRoster(){

/* Revoke access when the code that granted it is no longer current. Runs at load (against the
   cached code) AND again right after boot() re-fetches the live code — so when Sam changes or
   retires the master code, the SAME reload that fetches the new value re-locks the browser.
   Synchronous: master unlocks store the code string (already kept in localStorage as the cache,
   so no extra exposure) and compare by string; per-user grants compare their hash to the
   still-deployed hash list. Per-user grants are intentionally PERMANENT — a master-code rotation
   does NOT revoke them (only removing their hash + redeploying does). */
function revalidateUnlock(){
  const u=getUnlock();
  if(!u)return;
  if(u.m==="user"){ if(!u.h||!ROSTER_CODE_HASHES.includes(u.h)) lockRoster(); return; }
  if(u.m==="master"){ const cur=cachedMasterCode(); if(!cur||u.c!==cur) lockRoster(); return; }
  lockRoster(); // unknown/corrupt shape -> fail closed
}

  // profile-creation, application, Tenerife and account flows already enforce. Guarded on

  const rosterTc=document.getElementById("rosterTc");
  if(rosterTc&&!rosterTc.checked){ if(tcErr)tcErr.classList.add("show"); return; }
  // 1) Per-user personal codes: SHA-256 checked offline against ROSTER_CODE_HASHES (unchanged).
  let hash="";
  try{hash=await sha256Hex(val);}
  catch(ex){console.warn("crypto.subtle unavailable",ex);}
  if(hash&&ROSTER_CODE_HASHES.includes(hash)){
    unlockRoster({m:"user",h:hash});
    location.href="roster/";
    return;
  }
  // 2) Master roster code — FAST PATH: compare against the admin-set code this browser cached
  //    on a previous successful load (boot() refreshes it via get_roster_code()). Synchronous
  //    and network-free, so a return visitor unlocks instantly even if SB never loaded (slow
  //    device, esm.sh blocked, offline, DB paused). Both sides are trimmed+upper-cased, so it's
  //    case-insensitive + whitespace-tolerant. This replaces the old hardcoded "ESM13" string.
  const cached=cachedMasterCode();
  if(cached&&val===cached){
    unlockRoster({m:"master",c:cached});
    location.href="roster/";
    return;
  }
  // 3) Master roster code — LIVE PATH: verify against the DB in case Sam JUST changed the code
  //    and this browser hasn't re-cached the new value yet. verify_roster_code() compares
  //    server-side (case-insensitive) and returns only true/false. On success we cache the
  //    value so this browser gets the fast path next time. Runs only when SB is available.
  try{
    if(SB){
      const {data:ok,error}=await SB.rpc("verify_roster_code",{p_code:val});
      if(!error&&ok===true){
        cacheMasterCode(val); // val is confirmed-current -> seed the offline cache
        unlockRoster({m:"master",c:val});
        location.href="roster/";
        return;
      }
    }
  }catch(ex){console.warn("verify_roster_code failed",ex);}
  err.classList.add("show");
});

   Baseball + Softball Representation share the same field set ("rep"); "Teams and
   Scouts" (which replaced Coaching) uses its own team/scout field set ("teams"). */
function applyCat(v){
  v=String(v||"");
  return /college/i.test(v) ? "college" : /team|scout/i.test(v) ? "teams" : "rep";
}
/* ===== Per-category required fields (hoisted 2026-09) =====
   Baseball/Softball Representation and College share the full profile; College adds the
   academic docs. "Teams and Scouts" collects a team/scout lead. File fields are required
   too, per Sam's field lists. Hoisted out of the submit handler so the multi-step "Next"
   gate and the final submit validate against the SAME list and can never drift apart. */
const REQ_BY_CAT={
  // The PICTURE is deliberately absent from both lists: photo (rep/college) and ts_photo
  // (teams) are OPTIONAL as of 2026-09 — an applicant can submit without one. The PDF doc
  // fields stay required wherever they appear.
  rep:    ["first_name","last_name","nationality","email","phone","country","position","resume","age","goals"],
  college:["first_name","last_name","nationality","email","phone","country","position","resume","age","english_cert","education_level","diploma","study_goals"],
  teams:  ["name_or_team","ts_nationality","ts_email","ts_phone","ts_country","ts_role","looking_for"],
};
const FILE_FIELDS={photo:"image",ts_photo:"image",resume:"pdf",english_cert:"pdf",diploma:"pdf"};
// Mark the .field wrapper of a named control invalid (for the red-border hint).
const markInvalid=name=>{const c=form.querySelector(`[name="${name}"]`);const fld=c&&c.closest(".field");if(fld)fld.classList.add("invalid");};

/* ===== Multi-step application panel (2026-09) =====
   Step 1 category + contact · 2 athlete details · 3 documents · 4 goals + terms + submit.
   Every block carries data-step, and the field blocks keep their original data-cats, so a
   block shows only when its step is current AND its category matches. Nothing is removed
   from the DOM, so FormData on submit still sees every step's values — exactly the property
   the original single-page form relied on. */
const STEP_MAX=4;
let STEP=1;
const inCat=(el,cat)=>!el.dataset.cats||el.dataset.cats.split(" ").includes(cat);

function renderSteps(){
  document.querySelectorAll("#jpSteps li").forEach(li=>{
    const n=+li.dataset.s;
    li.classList.toggle("on",n===STEP);
    li.classList.toggle("done",n<STEP);
  });
  // "1. CATEGORY & CONTACT" heading — same step keys as the indicator, so the two
  // can never disagree and both re-translate together.
  const num=document.getElementById("jpStepNum"), nm=document.getElementById("jpStepName");
  if(num)num.textContent=STEP+".";
  if(nm)nm.textContent=t("step_"+STEP+"_t");
}
function syncStepNav(){
  const back=document.getElementById("stepBack"), next=document.getElementById("stepNext"),
        sub=form.querySelector(".jp-submit");
  if(back)back.hidden=(STEP===1);
  if(next)next.hidden=(STEP===STEP_MAX);
  if(sub) sub.hidden =(STEP!==STEP_MAX);
}
/* Show only the blocks whose step is current AND whose data-cats includes the selected
   category, and clear any stale validation highlight. */
/* ===== Per-category Terms & Conditions target (2026-09) ==========================
   The T&C are NOT the same document for every application category, so the one static
   "Read more" link this form used to carry was wrong: it showed every applicant the same
   page regardless of what they were actually agreeing to.

   applyCat() collapses the four dropdown values into three keys, and "rep" is exactly
   Baseball Representation + Softball Representation — which is precisely the scope of the
   document from Sam's lawyer, so no extra mapping is needed.

   college / teams -> terms-pending.html, an explicit "these terms are being finalised"
   page. They deliberately do NOT get the Baseball/Softball document: it does not cover
   those services, and showing it would misrepresent what the applicant is accepting.

   ⚠️ rep is STILL POINTING AT THE GENERAL PLACEHOLDER. The Baseball/Softball document
   text has not been supplied yet. When it lands, create terms-baseball-softball.html and
   change the ONE line below — nothing else in this file needs to move. */
const TERMS_BY_CAT = {
  rep:     "terms.html",            // <-- swap to "terms-baseball-softball.html" when the document arrives
  college: "terms-pending.html",
  teams:   "terms-pending.html",
};
function syncTermsLink(cat){
  // The link lives in the same <label> as the #joinTc checkbox; scoped that way so the
  // other T&C links on this page (roster gate, profile tiers) are never touched.
  const link=document.getElementById("joinTc")?.closest("label")?.querySelector(".tc-more");
  if(link) link.href = TERMS_BY_CAT[cat] || "terms.html";
}
function updateApplyFields(){
  const cat=applyCat(applyingSelect.value);
  form.querySelectorAll("[data-step]").forEach(el=>{
    el.hidden=!(+el.dataset.step===STEP && inCat(el,cat));
  });
  // Defensive: a category block without a step (none today) still respects the category gate.
  form.querySelectorAll(".af:not([data-step])").forEach(el=>{ el.hidden=!inCat(el,cat); });
  form.querySelectorAll(".invalid").forEach(el=>el.classList.remove("invalid"));
  syncTermsLink(cat);
  renderSteps();
  syncStepNav();
}
function goToStep(n){
  STEP=Math.min(STEP_MAX,Math.max(1,n));
  updateApplyFields();
  const msg=document.getElementById("formMsg");
  if(msg)msg.classList.remove("show","err");
}
// Bring the panel back into view when a step change would otherwise leave the user
// looking at the middle of a taller step. No-op when the panel top is already comfortable.
function revealPanel(){
  const el=document.getElementById("join"); if(!el)return;
  const top=el.getBoundingClientRect().top;
  if(top<70||top>innerHeight*0.55) el.scrollIntoView({behavior:"smooth",block:"start"});
}
/* A step advances only when every required field IT OWNS for the current category is
   filled, and any file on it passes the same size/type check the submit handler uses. */
function validateStep(n){
  const cat=applyCat(applyingSelect.value);
  const req=REQ_BY_CAT[cat]||[];
  const msg=document.getElementById("formMsg");
  form.querySelectorAll(".invalid").forEach(el=>el.classList.remove("invalid"));
  let firstBad=null, fileMsgKey=null;
  for(const name of req){
    const ctrl=form.querySelector(`[name="${name}"]`);
    if(!ctrl) continue;
    const block=ctrl.closest("[data-step]");
    if(!block || +block.dataset.step!==n) continue;
    if(FILE_FIELDS[name]){
      const f=ctrl.files&&ctrl.files[0];
      if(!f||!f.size){ markInvalid(name); firstBad=firstBad||name; continue; }
      const err=fileError(f,FILE_FIELDS[name]);
      if(err){ markInvalid(name); firstBad=firstBad||name; fileMsgKey=fileMsgKey||err; }
    }else if(!String(ctrl.value||"").trim()){
      markInvalid(name); firstBad=firstBad||name;
    }
  }
  if(firstBad){
    msg.textContent=t(fileMsgKey||"f_err_required");
    msg.classList.add("show","err");
    const bad=form.querySelector(`[name="${firstBad}"]`);
    (bad||msg).scrollIntoView({behavior:"smooth",block:"center"});
    if(bad&&bad.focus)try{bad.focus({preventScroll:true});}catch(_){}
    return false;
  }
  msg.classList.remove("show","err");
  return true;
}
// Which step owns a named control — used to jump straight to the offending step when the
// final submit finds a gap (e.g. the visitor skipped ahead with the Enter key).
function stepOf(name){
  const c=form.querySelector(`[name="${name}"]`);
  const b=c&&c.closest("[data-step]");
  return b?+b.dataset.step:STEP;
}
{
  const next=document.getElementById("stepNext"), back=document.getElementById("stepBack");
  if(next)next.addEventListener("click",()=>{ if(validateStep(STEP)){ goToStep(STEP+1); revealPanel(); } });
  if(back)back.addEventListener("click",()=>{ goToStep(STEP-1); revealPanel(); });
}
// Changing the category re-evaluates which fields this step owns (the select lives on
// step 1, so this cannot strand the visitor mid-form).
applyingSelect.addEventListener("change",updateApplyFields);

/* Upload limits — mirrored server-side by the bucket file_size_limit + allowed_mime_types. */
const MAX_UPLOAD=10*1024*1024;                 // 10 MB
const IMG_TYPES=["image/jpeg","image/png"];
const PDF_TYPE="application/pdf";
const extFor=f=>{const n=(f&&f.name||"").toLowerCase();const i=n.lastIndexOf(".");return i>=0?n.slice(i+1):"";};

// Validate a File against a kind ("image"|"pdf"); returns an error i18n-key or null.
function fileError(file,kind){
  if(!file||!file.size) return null;             // caller decides if required
  if(file.size>MAX_UPLOAD) return "f_err_size";
  if(kind==="image" && !IMG_TYPES.includes(file.type) && !["jpg","jpeg","png"].includes(extFor(file))) return "f_err_img";
  if(kind==="pdf"   && file.type!==PDF_TYPE && extFor(file)!=="pdf") return "f_err_pdf";
  return null;
}

/* Upload one file to a bucket under key/<label>.<ext>. Returns the object path.

   NOTE (2026-09): upsert was REMOVED here because it broke every public application.
   `upsert:true` sends the x-upsert header, and Supabase Storage then needs an UPDATE
   policy on storage.objects as well as INSERT. The anon role has only
   "public can upload application photos"/"...docs" (INSERT), so every upload came back
   403 "new row violates row-level security policy" and the whole submission failed —
   silently, behind the generic "something went wrong" message. Verified against main:
   same failure, so this predates the redesign.
   upsert was never actually needed: `key` is slugify(applying)+"-"+Date.now().toString(36),
   unique per submission, and each file within a submission has its own label. A plain
   insert is therefore always a fresh object. Alternative fix (not taken, since it would
   loosen production RLS) was to grant anon UPDATE on both buckets. */
async function uploadApplicationFile(bucket,key,label,file){
  const ext=extFor(file)|| (bucket==="application-docs"?"pdf":"jpg");
  const path=`${key}/${label}.${ext}`;
  const {error}=await SB.storage.from(bucket).upload(path,file,{contentType:file.type||undefined});
  if(error) throw error;
  return path;
}

form.addEventListener("submit",async e=>{
  e.preventDefault();
  // The submit button only renders on the last step, but pressing Enter in any text field
  // still fires submit. Treat that as "Next" so the visitor advances instead of being told
  // about fields three steps ahead that they haven't reached yet.
  if(STEP<STEP_MAX){ if(validateStep(STEP)){ goToStep(STEP+1); revealPanel(); } return; }
  const fd=new FormData(form);
  const btn=form.querySelector("button[type=submit]");
  const msg=document.getElementById("formMsg");
  msg.classList.remove("show","err");
  form.querySelectorAll(".invalid").forEach(el=>el.classList.remove("invalid"));

  // Dependency-free spam guard: bots auto-fill the hidden honeypot ("company"), and no
  // real user reaches and submits this bottom-of-page form within 1.5s of load. Either
  // signal → show the success UI but skip the insert, so bots don't retry or spam the
  // moderation queue. Real submissions are unaffected.
  if((fd.get("company")||"").trim() || (Date.now()-FORM_T0)<1500){
    form.reset();goToStep(1);msg.textContent=t("f_success");msg.classList.add("show");
    return;
  }

  // Terms & Conditions must be accepted before the submission is saved (item 8).
  if(!document.getElementById("joinTc")?.checked){
    msg.textContent=t("tc_required");msg.classList.add("show","err");
    msg.scrollIntoView({behavior:"smooth",block:"center"});return;
  }

  // Applications require the live database; without it we can't save them.
  if(!SB){msg.textContent=t("f_error");msg.classList.add("show","err");msg.scrollIntoView({behavior:"smooth",block:"center"});return;}

  const applying=(fd.get("applying")||"").trim()||"General application";
  const cat=applyCat(applying);
  const g=n=>(fd.get(n)||"").toString().trim();
  const gf=n=>{const f=fd.get(n);return f&&f.size?f:null;};

  // Per-category required fields + file kinds + markInvalid are defined once near
  // updateApplyFields, so the step "Next" gate and this final check share one source.
  const REQ=REQ_BY_CAT[cat];

  let firstBad=null, fileMsgKey=null;
  for(const name of REQ){
    if(FILE_FIELDS[name]){
      const file=gf(name);
      if(!file){ markInvalid(name); firstBad=firstBad||name; continue; }
      const err=fileError(file,FILE_FIELDS[name]);
      if(err){ markInvalid(name); firstBad=firstBad||name; fileMsgKey=fileMsgKey||err; }
    }else if(!g(name)){
      markInvalid(name); firstBad=firstBad||name;
    }
  }
  // Also validate any optionally-present file even if not required (defensive).
  for(const [name,kind] of Object.entries(FILE_FIELDS)){
    if(REQ.includes(name)) continue;
    const err=fileError(gf(name),kind);
    if(err){ markInvalid(name); firstBad=firstBad||name; fileMsgKey=fileMsgKey||err; }
  }
  if(firstBad){
    // Jump to the step that actually owns the gap, so the highlighted field is on screen.
    const badStep=stepOf(firstBad);
    if(badStep!==STEP) goToStep(badStep);
    msg.textContent=t(fileMsgKey||"f_err_required");
    msg.classList.add("show","err");
    const bad=form.querySelector(`[name="${firstBad}"]`);
    (bad||msg).scrollIntoView({behavior:"smooth",block:"center"});
    if(bad&&bad.focus)try{bad.focus({preventScroll:true});}catch(_){}
    return;
  }

  btn.disabled=true;
  const oldLabel=btn.textContent; btn.textContent=t("f_submitting");
  try{
    // A stable key groups this applicant's uploads under one folder in each bucket.
    const key=slugify(applying)+"-"+Date.now().toString(36);

    // ---- File uploads (item 2) ----
    // Headshot → public application-photos bucket (renders in admin + any profile).
    // PDFs → private application-docs bucket; we store the object PATH and the admin
    // panel mints short-lived signed URLs to download them.
    let image_url=null, resume_url=null, english_cert_url=null, diploma_url=null;
    if(cat==="rep"||cat==="college"){
      const photo=gf("photo");
      if(photo){
        const p=await uploadApplicationFile("application-photos",key,"photo",photo);
        image_url=SB.storage.from("application-photos").getPublicUrl(p).data.publicUrl;
      }
      const resume=gf("resume");
      if(resume) resume_url=await uploadApplicationFile("application-docs",key,"resume",resume);
    }
    if(cat==="college"){
      const eng=gf("english_cert");
      if(eng) english_cert_url=await uploadApplicationFile("application-docs",key,"english-cert",eng);
      const dip=gf("diploma");
      if(dip) diploma_url=await uploadApplicationFile("application-docs",key,"diploma",dip);
    }
    if(cat==="teams"){
      const photo=gf("ts_photo");
      if(photo){
        const p=await uploadApplicationFile("application-photos",key,"photo",photo);
        image_url=SB.storage.from("application-photos").getPublicUrl(p).data.publicUrl;
      }
    }

    // ---- Build the row (item 3) ----
    // players.name and players."group" are NOT NULL. rep/college build the name from
    // first+last; teams use the single "name_or_team" field.
    const fullName=[g("first_name"),g("last_name")].filter(Boolean).join(" ");
    const name=(cat==="teams" ? g("name_or_team") : fullName) || applying;
    // Sport: Softball Representation → Softball; everything else defaults to Baseball
    // (College placement covers both; applying_for keeps the exact choice for routing).
    const sport=/softball/i.test(applying)?"Softball":"Baseball";
    // Goals/summary text stored in bio: rep uses "goals"; college uses "study_goals".
    const goalsText=cat==="college"?g("study_goals"):g("goals");
    // Phone: combine the country code + number into one stored value.
    const phone=[g("phone_code"),g("phone")].filter(Boolean).join(" ").trim();
    const tsPhone=[g("ts_phone_code"),g("ts_phone")].filter(Boolean).join(" ").trim();

    const row={
      slug:key,
      name,
      "group":"Applicant",
      sport,
      applying_for:applying,
      bio:goalsText||"—",
      source:"application",
      status:"pending",
    };
    // Only attach the extended fields for the categories that collect them.
    if(cat==="rep"||cat==="college"){
      Object.assign(row,{
        nationality:g("nationality")||null,
        email:g("email")||null,
        phone:phone||null,
        country:g("country")||null,
        position:g("position")||null,
        age:g("age")||null,
        image_url,
        resume_url,
      });
    }
    if(cat==="college"){
      Object.assign(row,{
        english_cert_url,
        diploma_url,
        education_level:g("education_level")||null,
        study_goals:g("study_goals")||null,
      });
    }
    if(cat==="teams"){
      Object.assign(row,{
        nationality:g("ts_nationality")||null,
        email:g("ts_email")||null,
        phone:tsPhone||null,
        country:g("ts_country")||null,
        role:g("ts_role")||null,
        looking_for:g("looking_for")||null,
        image_url,
      });
    }

    const {error}=await SB.from("players").insert(row);
    if(error) throw error;
  }catch(err){
    console.error("Application failed",err);
    btn.disabled=false; btn.textContent=oldLabel;
    msg.textContent=t("f_error");msg.classList.add("show","err");msg.scrollIntoView({behavior:"smooth",block:"center"});
    return;
  }
  btn.disabled=false; btn.textContent=oldLabel;
  form.reset();goToStep(1);
  msg.textContent=t("f_success");msg.classList.add("show");
  msg.scrollIntoView({behavior:"smooth",block:"center"});
});

/* ===== Athlete carousel (2026-09 round 2) =====
   The roster is a horizontal scroll-snap row; these arrows nudge it two cards at a
   time and hide themselves at each end. Purely a scroll helper — the roster data,
   filters and unlock gate are untouched. */
(function(){
  const list=document.getElementById("rosterList"),
        prev=document.getElementById("rosPrev"), next=document.getElementById("rosNext");
  if(!list||!prev||!next)return;
  const cardStep=()=>{const c=list.querySelector(".pcard");return c?c.getBoundingClientRect().width+16:216;};
  const nudge=d=>list.scrollBy({left:d*cardStep()*2,behavior:"smooth"});
  prev.addEventListener("click",()=>nudge(-1));
  next.addEventListener("click",()=>nudge(1));
  function sync(){
    // grid mode (narrow phones) or nothing to scroll -> no arrows
    const max=list.scrollWidth-list.clientWidth-2;
    const off=getComputedStyle(list).display!=="flex"||max<=0;
    prev.style.visibility=(off||list.scrollLeft<=2)?"hidden":"visible";
    next.style.visibility=(off||list.scrollLeft>=max)?"hidden":"visible";
  }
  list.addEventListener("scroll",sync,{passive:true});
  addEventListener("resize",sync);
  window.syncRosterArrows=sync;
  sync();
})();

/* ===== Nav active-link underline =====
   The mockup marks the current section with a short gold underline. Recomputed on
   scroll via IntersectionObserver; read-only, affects nothing but a CSS class. */
(function(){
  const links=[...document.querySelectorAll(".nav-links a[href^='#']")];
  if(!links.length||!("IntersectionObserver" in window))return;
  const map=new Map();
  links.forEach(a=>{ const el=document.querySelector(a.getAttribute("href")); if(el)map.set(el,a); });
  if(!map.size)return;
  function pick(){
    let best=null,bestTop=Infinity;
    map.forEach((a,el)=>{
      const r=el.getBoundingClientRect();
      if(r.bottom>90 && r.top<innerHeight*0.55 && r.top<bestTop){ bestTop=r.top; best=a; }
    });
    links.forEach(l=>l.classList.toggle("on",l===best));
  }
  const io=new IntersectionObserver(pick,{rootMargin:"-64px 0px -45% 0px",threshold:[0,.25,.5,1]});
  map.forEach((a,el)=>io.observe(el));
  addEventListener("scroll",pick,{passive:true});
  pick();
})();

async function boot(){
  if(SUPABASE_URL&&SUPABASE_ANON_KEY){
    try{const {createClient}=await import("https://esm.sh/@supabase/supabase-js@2");
      // The public site is anonymous by design. Don't load any signed-in session
      // from storage — otherwise a logged-in player/scout browsing the homepage
      // would send their JWT and RLS would return only their own row, breaking the
      // public roster. persistSession:false keeps every request purely anon.
      SB=createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
      // Refresh the cached master roster code FIRST (independent try), so the gate's fast
      // synchronous path has the current value on the next interaction — and so a retired code
      // clears the cache. Kept separate from the players fetch so a roster error can't skip it.
      // CRITICAL: only mutate the cache when the server actually ANSWERED (no error). On a
      // network error the RPC resolves to {data:null,error} — writing that null would WIPE the
      // last-known-good cache and destroy the offline fallback exactly when it's needed, so we
      // preserve the existing cache on error and only refresh/clear on a real response.
      try{const {data:mc,error:mcErr}=await SB.rpc("get_roster_code");if(!mcErr){cacheMasterCode(mc);revalidateUnlock();}}
      catch(ex){console.warn("roster code cache refresh failed (cache preserved)",ex);}
      // Only approved players are publicly readable (enforced by RLS too). We request
      // just the public display columns — NOT the intake PII (age/phone/email/instagram/
      // message) — so an approved athlete's contact details are never sent to the browser.
      const {data,error}=await SB.from("players")
        .select("id,slug,name,group,position,country,flag,heritage,born,birthplace,tier,bats,bio,teams,stats,season_stats,image_url,photo_pos_x,photo_pos_y,photo_zoom,sport,level,sort_order")
        .eq("status","approved").order("sort_order");
      if(error)throw error;
      // Supabase stores the photo in `image_url`; the renderer reads `image`.
      if(data&&data.length)PLAYERS=data.map(p=>({...p,image:p.image_url||p.image||null}));
      // Extra testimonials from the CMS for the "See all" list (plain strings; loc() handles them).
      const {data:tData}=await SB.from("testimonials").select("quote,name,role,image_url,sort_order").order("sort_order");
      if(tData&&tData.length)DB_TESTI=tData.map(x=>({q:x.quote,n:x.name,r:x.role,photo:x.image_url||null}));
    }catch(err){console.warn("Supabase load failed; using embedded roster.",err);}
  }
  // Repo-committed photos fill in only where Supabase has none.
  PLAYERS=PLAYERS.map(p=>({...p,image:p.image||LOCAL_PHOTOS[p.slug]||null}));
  wireServiceSignups();
  applyI18n();renderSportFilters();renderFilters();renderRoster();renderEvents();renderTesti();
  applyLockState();
}

// Wire the pay buttons synchronously too: their hrefs come only from top-level
// constants (no network), so doing this before boot()'s async import+fetch means the
// "€49.99" roster button always has a working target even if the connection stalls —
// previously it stayed href="#" until boot() finished (a tap-does-nothing race on slow iOS).
/* If a player/scout is already signed in (a Supabase session is stored in this browser),
   relabel the "Sign In" nav dropdown to "My Profile" so the nav reflects their state.
   We only READ the stored token — the roster client stays anonymous (persistSession:false)
   so a logged-in JWT never shrinks the public roster. applyI18n() (in boot) renders it. */
(function reflectAuthInNav(){
  try{
    let raw=null;
    for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && /^sb-.*-auth-token$/.test(k)){ raw=localStorage.getItem(k); break; } }
    if(!raw)return;
    const o=JSON.parse(raw), exp=o&&o.expires_at;
    if(!(o&&o.access_token))return;
    if(exp && exp*1000<=Date.now())return;   // session expired → leave as "Sign In"
    const s=document.querySelector('#signin summary span[data-i18n="nav_signin"]');
    if(s)s.setAttribute("data-i18n","nav_myprofile");
  }catch(e){}
})();

/* ---------- pull-to-refresh (installed PWA only) ----------
   An installed PWA has no browser chrome, so it loses Safari's native pull-to-refresh.
   This adds a custom gesture that only arms in standalone display mode and only when
   scrolled to the very top, so it never fights normal scrolling or affects a browser tab.
   On trigger it asks the service worker to check for a new version (the SW uses
   skipWaiting + clients.claim, so a found update self-activates) THEN reloads — the reload
   re-runs boot(), re-fetching the roster from Supabase (network-first), so it pulls
   genuinely fresh data, not just a cosmetic repaint. Mirrors the admin portal's gesture. */
(function(){
  var standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if(!standalone) return;

  var THRESHOLD = 70;                 // px of pull needed to trigger a refresh
  var scroller = document.scrollingElement || document.documentElement;
  var startY = 0, dist = 0, pulling = false, refreshing = false;

  var ind = document.createElement("div");
  ind.id = "ptr"; ind.setAttribute("aria-hidden", "true");
  ind.innerHTML = '<div class="ptr-spin"></div>';
  var style = document.createElement("style");
  style.textContent =
    "#ptr{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;z-index:200;" +
    "width:38px;height:38px;border-radius:50%;display:grid;place-items:center;" +
    "background:rgba(12,33,67,.97);border:1px solid var(--gold,#d9b154);" +
    "box-shadow:0 8px 22px rgba(0,0,0,.45);opacity:0;pointer-events:none;" +
    "transform:translateX(-50%) translateY(-70px);transition:transform .15s ease,opacity .15s}" +
    ".ptr-spin{width:17px;height:17px;border-radius:50%;border:2px solid rgba(217,177,84,.3);border-top-color:var(--gold,#d9b154)}" +
    "#ptr.spin .ptr-spin{animation:ptr-rot .6s linear infinite}" +
    "@keyframes ptr-rot{to{transform:rotate(360deg)}}";
  document.head.appendChild(style);
  document.body.appendChild(ind);

  function reset(){ pulling = false; dist = 0; ind.classList.remove("spin"); ind.style.opacity = ""; ind.style.transform = ""; }

  addEventListener("touchstart", function(e){
    if(refreshing || e.touches.length !== 1 || scroller.scrollTop > 0) return;
    startY = e.touches[0].clientY; pulling = true; dist = 0;
  }, { passive: true });

  addEventListener("touchmove", function(e){
    if(!pulling || refreshing) return;
    if(scroller.scrollTop > 0){ reset(); return; }    // user scrolled away from the top
    dist = e.touches[0].clientY - startY;
    if(dist <= 0){ reset(); return; }                 // pulling up, not a refresh gesture
    ind.style.opacity = Math.min(dist / THRESHOLD, 1);
    ind.style.transform = "translateX(-50%) translateY(" + Math.min(-70 + dist * 0.6, 10) + "px)";
    ind.classList.toggle("spin", dist >= THRESHOLD);  // pre-spin once past the threshold
  }, { passive: true });

  addEventListener("touchend", function(){
    if(!pulling || refreshing){ reset(); return; }
    if(dist < THRESHOLD){ reset(); return; }
    refreshing = true;
    ind.classList.add("spin"); ind.style.opacity = "1";
    ind.style.transform = "translateX(-50%) translateY(10px)";
    Promise.resolve()
      .then(function(){ return "serviceWorker" in navigator ? navigator.serviceWorker.getRegistration() : null; })
      .then(function(reg){ return reg ? reg.update() : null; })   // fetch a newer sw.js if deployed
      .catch(function(){})
      .then(function(){ location.reload(); });                    // fresh shell + fresh roster data
  }, { passive: true });
})();
</script>
