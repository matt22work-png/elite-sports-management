<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Player Portal — Elite Sports Management</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png" />
<link rel="shortcut icon" href="../icons/icon-192.png" />
<meta name="theme-color" content="#081a33" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--navy:#081a33;--navy-2:#06142a;--gold:#d9b154;--gold-soft:#e7c878;--teal:#3a9aa6;--teal-soft:#5fb8c2;--ink:#eaf0fa;--muted:#9fb1cc;--line:rgba(217,177,84,.22);--card:#0c2143;--red:#e05d5d}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Hanken Grotesk',system-ui,sans-serif;background:var(--navy-2);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  .display{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:.01em;text-transform:uppercase}
  a{color:var(--gold-soft);text-decoration:none}
  .wrap{max-width:760px;margin:0 auto;padding:26px 22px 90px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:30px}
  .logo-img{height:40px;width:auto;display:block}
  header b{font-size:14px;display:block}
  header small{display:block;font-size:8.5px;letter-spacing:.3em;color:var(--gold-soft);font-weight:700}
  .spacer{flex:1}
  .langsw{display:flex;gap:4px}
  .langsw button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 8px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;transition:.2s}
  .langsw button.on{border-color:var(--gold);color:var(--gold-soft)}
  .btn{padding:11px 20px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;border:0;transition:.2s;display:inline-block}
  .btn-gold{background:var(--gold);color:#05101f}
  .btn-gold:hover{background:var(--gold-soft)}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold-soft)}
  .card{border:1px solid var(--line);border-radius:16px;padding:24px;background:linear-gradient(180deg,var(--card),rgba(8,26,51,.4));margin-bottom:16px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .field input,.field textarea,.field select{width:100%;background:rgba(6,20,42,.8);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);font-size:15px;font-family:inherit}
  .field input:focus,.field textarea:focus,.field select:focus{outline:0;border-color:var(--gold)}
  .field textarea{resize:vertical}
  .btn-gold[disabled],.btn[disabled]{opacity:.55;cursor:wait}
  .linklike{background:none;border:0;color:var(--gold-soft);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;padding:4px}
  .linklike:hover{color:var(--gold)}
  .msg{display:none;margin-top:12px;font-size:13.5px;color:var(--red)}
  .msg.show{display:block}
  .msg.ok{color:var(--teal-soft)}
  .kicker{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--teal-soft);margin:26px 0 12px}
  .p-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .avatar{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;font-family:'Anton';color:var(--gold);font-size:20px;background-size:cover;background-position:center;flex:0 0 auto}
  .p-head h2{font-size:24px}
  .pos{color:var(--muted);font-size:14px}
  .chip{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--gold-soft)}
  .chip.approved{color:var(--teal-soft)}
  .chip.pending{color:var(--gold-soft)}
  .chip.rejected{color:var(--red)}
  .row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid rgba(217,177,84,.12);font-size:15px}
  .row:last-child{border-bottom:0}
  .row span{color:var(--muted)}
  .row b{font-weight:600;text-align:right}
  .note{font-size:13.5px;color:var(--muted);margin-top:6px}
  .empty{color:var(--muted);text-align:center;padding:30px 10px}
  .ro-hint{font-size:12px;color:var(--muted);margin:-4px 0 12px;font-style:italic}
  #booting,#loginBox,#app{display:none}
  /* self-entered per-season stats tables (derived AVG/OBP/SLG · ERA/WHIP · Fld%) */
  .ss-block{margin-bottom:16px}
  .ss-block:last-child{margin-bottom:0}
  .ss-title{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-soft);font-weight:800;margin-bottom:8px}
  .ss-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
  .ss-table{width:100%;border-collapse:collapse;font-size:13px;min-width:max-content}
  .ss-table th,.ss-table td{padding:8px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid rgba(217,177,84,.1)}
  .ss-table th:first-child,.ss-table td:first-child,.ss-table th:nth-child(2),.ss-table td:nth-child(2){text-align:left}
  .ss-table thead th{color:var(--gold-soft);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:rgba(8,26,51,.6)}
  .ss-table tbody tr:last-child td{border-bottom:0}
  .ss-table tbody td{color:#d6e1f2}
  @media(max-width:560px){ input{font-size:16px} .wrap{padding:18px 14px 80px} }
</style>

<!-- Shared Baseball-Reference config + read-only table renderer (window.BBREF). Loaded as
     a classic script so the module below can render the player's own career register
     exactly like the admin panel and public profile pages do. -->
<script src="../bbref-stats.js"></script>
<div class="wrap">
  <header>
    <a href="../index.html"><img class="logo-img" src="../logo.png" alt="Elite Sports Management" /></a>
    <div><b>Elite Sports Management</b><small data-i18n="p_kicker">PLAYER PORTAL</small></div>
    <div class="spacer"></div>
    <div class="langsw" id="langsw" role="group" aria-label="Language"><button data-l="en" type="button">EN</button><button data-l="es" type="button">ES</button><button data-l="it" type="button">IT</button></div>
    <button class="btn btn-ghost" id="signOut" style="display:none" data-i18n="p_signout">Sign out</button>
  </header>

  <div id="booting" class="card" style="max-width:420px;margin:8vh auto;text-align:center;color:var(--muted)" data-i18n="p_checking">Checking session…</div>

  <!-- LOGIN -->
  <div id="loginBox" class="card" style="max-width:420px;margin:8vh auto">
    <h2 class="display" style="font-size:22px;margin-bottom:6px" data-i18n-html="p_login_h">Player <em style="color:var(--gold);font-style:normal">Portal</em></h2>
    <p class="note" style="margin-bottom:18px" data-i18n="p_login_note">Sign in with the email &amp; password you created at registration.</p>
    <form id="pwForm">
      <div class="field"><label for="email" data-i18n="p_email">Email</label><input type="email" id="email" autocomplete="username" required placeholder="you@email.com" /></div>
      <div class="field"><label for="password" data-i18n="p_password">Password</label><input type="password" id="password" autocomplete="current-password" required /></div>
      <button class="btn btn-gold" style="width:100%" type="submit" data-i18n="p_signin">Sign in</button>
      <div class="msg" id="loginMsg" role="alert" aria-live="assertive"></div>
    </form>
    <div style="text-align:center;margin-top:12px"><button type="button" id="forgotBtn" class="linklike" data-i18n="p_forgot">Forgot your password?</button></div>
    <p class="note" style="margin-top:16px" data-i18n-html="p_login_new">
      New here? <a href="../register/">Create an account</a>.
      Applied the old way? Use the sign-in link with your application email.
    </p>
  </div>

  <!-- RESET PASSWORD (shown when arriving from a reset email) -->
  <div id="resetBox" class="card" style="max-width:420px;margin:8vh auto;display:none">
    <h2 class="display" style="font-size:22px;margin-bottom:6px" data-i18n-html="p_reset_h">Set a new <em style="color:var(--gold);font-style:normal">password</em></h2>
    <p class="note" style="margin-bottom:18px" data-i18n="p_reset_note">Choose a new password for your account.</p>
    <form id="resetForm">
      <div class="field"><label for="newpass" data-i18n="p_newpass">New password</label><input type="password" id="newpass" autocomplete="new-password" minlength="8" required data-i18n-ph="p_newpass_ph" placeholder="At least 8 characters" /></div>
      <button class="btn btn-gold" style="width:100%" type="submit" data-i18n="p_update_pw">Update password</button>
      <div class="msg" id="resetMsg" role="alert" aria-live="assertive"></div>
    </form>
  </div>

  <!-- STATUS (pending / rejected / archived) -->
  <div id="statusBox" class="card" style="max-width:460px;margin:8vh auto;display:none"></div>

  <!-- APP -->
  <div id="app">
    <div id="profile"></div>
  </div>
</div>

    p_batting:"Battuta", p_pitching:"Lancio", p_fielding:"Difesa",
  },
};
const SUPPORTED = ["en","es","it"];
let lang = (()=>{ try{ const l = localStorage.getItem("esm_lang"); return SUPPORTED.includes(l) ? l : "en"; }catch(e){ return "en"; } })();
const t = k => (DICT[lang] && DICT[lang][k]) || DICT.en[k] || k;

/* Apply translations to the static markup (login / reset / header). */
function applyStatic(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.getAttribute("data-i18n-html")); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.setAttribute("placeholder", t(el.getAttribute("data-i18n-ph"))); });
  document.querySelectorAll("#langsw button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
}
function setLang(l){
  if (!SUPPORTED.includes(l) || l === lang) { document.querySelectorAll("#langsw button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang)); return; }
  lang = l; try{ localStorage.setItem("esm_lang", l); }catch(e){}
  applyStatic();
  rerenderDynamic();   // re-render whatever dynamic view is currently on screen
}
document.querySelectorAll("#langsw button").forEach(b => b.onclick = () => setLang(b.dataset.l));

/* Remember the current dynamic view so a language switch can re-render it in place. */
let CUR = { view:null, status:null };
function rerenderDynamic(){
  if (CUR.view === "status" && CUR.status) showStatus(CUR.status);
  else if (CUR.view === "scout") showScout();
  else if (CUR.view === "app" && ME_SESSION) loadMe(ME_SESSION);
}

function showView(state){
  $("booting").style.display   = state === "booting" ? "block" : "none";
  $("loginBox").style.display  = state === "login"   ? "block" : "none";
  $("resetBox").style.display  = state === "reset"   ? "block" : "none";
  $("statusBox").style.display = state === "status"  ? "block" : "none";
  $("app").style.display       = state === "app"     ? "block" : "none";
  $("signOut").style.display   = (state === "app" || state === "status") ? "" : "none";
}
applyStatic();
showView("booting");

/* True while handling a password-reset link, so the normal session routing
   doesn't whisk the user past the "set new password" form. */
let RECOVERING = location.hash.includes("type=recovery");

/* Password sign-in — the account created at registration. */
$("pwForm").addEventListener("submit", async e => {
  e.preventDefault();
  const m = $("loginMsg"); m.classList.remove("show","ok");
  const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true;
  const { error } = await SB.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  btn.disabled = false;
  if (error){ m.textContent = error.message; m.classList.add("show"); $("password").value = ""; return; }
  // onAuthStateChange("SIGNED_IN") runs gate().
});

$("signOut").onclick = async () => { await SB.auth.signOut(); };

/* Forgot password → email a reset link back to this page. */
$("forgotBtn").onclick = async () => {
  const m = $("loginMsg"); m.classList.remove("show","ok");
  const email = $("email").value.trim();
  if (!email){ m.textContent = t("p_forgot_enter"); m.classList.add("show"); $("email").focus(); return; }
  const btn = $("forgotBtn"); btn.disabled = true; btn.textContent = t("p_sending");
  const { error } = await SB.auth.resetPasswordForEmail(email, { redirectTo: location.href.split("#")[0] });
  btn.disabled = false; btn.textContent = t("p_forgot");
  if (error){ m.textContent = error.message; m.classList.add("show"); return; }
  m.textContent = t("p_reset_sent");
  m.classList.add("show","ok");
};

/* Set a new password after following the reset link. */
$("resetForm").addEventListener("submit", async e => {
  e.preventDefault();
  const m = $("resetMsg"); m.classList.remove("show","ok");
  const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true;
  const { error } = await SB.auth.updateUser({ password: $("newpass").value });
  btn.disabled = false;
  if (error){ m.textContent = error.message; m.classList.add("show"); return; }
  RECOVERING = false;
  m.textContent = t("p_pw_updated"); m.classList.add("show","ok");
  const { data: { session } } = await SB.auth.getSession();
  if (session) gate(session); else showView("login");
});

/* Professional, non-technical status screens for unapproved accounts. */
function showStatus(status){
  CUR = { view:"status", status };
  const icons = { pending:"⏳", rejected:"✉️", archived:"📁" };
  const key = ({pending:"pending",rejected:"rejected",archived:"archived"}[status]) || "pending";
  $("statusBox").innerHTML = `
    <div style="text-align:center">
      <div style="font-size:40px;margin-bottom:10px">${icons[key]}</div>
      <h2 class="display" style="font-size:22px;margin-bottom:10px">${esc(t("p_st_"+key+"_t"))}</h2>
      <p class="note" style="font-size:14.5px;line-height:1.6">${esc(t("p_st_"+key+"_b"))}</p>
      ${key==="pending" ? `<a class="btn btn-gold" href="https://py.pl/zN5DhqAoS3GziqI35iqiUQ" target="_blank" rel="noopener" style="margin-top:16px;display:inline-block">${esc(t("p_pay_btn"))}</a>
      <p class="note" style="margin-top:12px">${esc(t("p_pay_hint"))}</p>` : ""}
      <p class="note" style="margin-top:18px">${esc(t("p_questions"))} <a href="mailto:elitesportsmanagement50@gmail.com?subject=My%20ESM%20account">${esc(t("p_email_us"))}</a>.</p>
    </div>`;
  showView("status");
}
function showScout(){
  CUR = { view:"scout", status:null };
  $("statusBox").innerHTML = `
    <div style="text-align:center">
      <div style="font-size:40px;margin-bottom:10px">🔎</div>
      <h2 class="display" style="font-size:22px;margin-bottom:10px">${esc(t("p_scout_t"))}</h2>
      <p class="note" style="font-size:14.5px">${t("p_scout_b")}</p>
    </div>`;
  showView("status");
}

/* Decide what a signed-in user sees: their own approved profile, a status
   screen, a nudge to the scout portal, or (legacy) an email-matched profile. */
async function gate(session){
  if (RECOVERING){ showView("reset"); return; }   // let them finish setting a new password
  const user = session?.user; if (!user){ showView("login"); return; }
  const { data: prof } = await SB.from("profiles").select("role,account_status").eq("id", user.id).maybeSingle();
  if (prof){
    if (prof.role === "scout"){ showScout(); return; }
    if (prof.account_status !== "approved"){ showStatus(prof.account_status); return; }
  }
  // Approved player, or a legacy applicant with no profiles row → show the profile.
  ME_SESSION = session; CUR = { view:"app", status:null }; showView("app"); loadMe(session);
}

let ME_SESSION = null;   // kept so the edit form knows the user's id (photo path) + email
SB.auth.onAuthStateChange((evt, session) => {
  if (evt === "PASSWORD_RECOVERY"){ RECOVERING = true; showView("reset"); }
  else if (evt === "SIGNED_IN" && session) { ME_SESSION = session; gate(session); }
  else if (evt === "SIGNED_OUT") { ME_SESSION = null; CUR = { view:null, status:null }; showView("login"); }
});

(async function guard(){
  try {
    const { data: { session } } = await SB.auth.getSession();
    if (session){ ME_SESSION = session; gate(session); } else { showView("login"); }
  } catch (err) {
    console.error("Session check failed", err);
    showView("login");
  }
})();

/* Fully read-only. The row is matched by owner_id = auth.uid() (falling back to email),
   and RLS ("athlete reads own row") only ever returns the signed-in athlete's own row —
   this isn't just a UI restriction. No edit/upload controls: ESM (admin) owns all
   corrections; the player requests changes by email (see p_help). */
async function loadMe(session){
  const email = session?.user?.email || "";
  const uid = session?.user?.id || "";
  $("profile").innerHTML = `<div class="card empty">${esc(t("p_loading"))}</div>`;
  // Find the athlete's own roster row by owner_id first (set at registration), then by
  // email. RLS ("athlete reads own row") only ever returns their own row regardless.
  let resp = uid ? await SB.from("players").select("*").eq("owner_id", uid).limit(1) : { data: [], error: null };
  if (!resp.error && !(resp.data && resp.data.length) && email){
    resp = await SB.from("players").select("*").eq("email", email).limit(1);
  }
  const { data, error } = resp;

  if (error){
    $("profile").innerHTML = `<div class="card empty">${esc(t("p_load_fail"))}<br><small>${esc(error.message)}</small></div>`;
    return;
  }
  const p = (data || [])[0];
  if (!p){
    // Signed in, but no roster row is linked to this account yet (e.g. the profile was
    // approved before ESM built the roster entry). Show a clear, friendly state — never
    // a blank/dead-end page.
    let who = email;
    try { const { data: pr } = await SB.from("profiles").select("first_name,last_name").eq("id", uid).maybeSingle();
      if (pr){ who = [pr.first_name, pr.last_name].filter(Boolean).join(" ") || email; } } catch (e) {}
    $("profile").innerHTML = `<div class="card">
      <div class="p-head"><span class="avatar">👤</span><div style="flex:1"><h2 class="display">${esc(who)}</h2><div class="pos">${esc(email)}</div></div></div>
      <p class="note" style="margin-top:6px">${esc(t("p_setup"))}</p>
      <p class="note" style="margin-top:12px">${t("p_help")}</p>
    </div>`;
    return;
  }

  const teams = Array.isArray(p.teams) ? p.teams : [];
  const stats = Array.isArray(p.stats) ? p.stats : [];
  const statusNote = {
    pending:  t("p_note_pending"),
    approved: t("p_note_approved"),
    rejected: t("p_note_rejected"),
  }[p.status] || "";
  const statusLabel = t("p_status_" + p.status) || p.status;

  $("profile").innerHTML = `
    <div class="card">
      <div class="p-head">
        <span class="avatar" ${p.image_url ? `style="background-image:url('${esc(p.image_url)}')"` : ""}>${p.image_url ? "" : esc(initials(p.name))}</span>
        <div style="flex:1">
          <h2 class="display">${esc(p.name)}</h2>
          <div class="pos">${esc(p.position || p.group || "")} ${p.flag || ""}</div>
        </div>
        <span class="chip ${esc(p.status)}">${esc(statusLabel)}</span>
      </div>
      ${statusNote ? `<p class="note">${esc(statusNote)}</p>` : ""}
    </div>

    ${p.bio ? `<div class="kicker">${esc(t("p_k_bio"))}</div><div class="card"><p>${esc(p.bio)}</p></div>` : ""}

    <div class="kicker">${esc(t("p_k_details"))}</div>
    <div class="card">
      ${row(t("p_l_sport"), p.sport)}
      ${row(t("p_l_position"), p.position)}
      ${row(t("p_l_country"), p.country)}
      ${row(t("p_l_age"), p.age)}
      ${row(t("p_l_email"), p.email)}
      ${row(t("p_l_instagram"), p.instagram)}
      ${row(t("p_l_phone"), p.phone)}
      ${row(t("p_l_applying"), p.applying_for)}
    </div>

    ${stats.length ? `<div class="kicker">${esc(t("p_k_highlights"))}</div><div class="card">
      ${stats.map(s => row(s.label, s.value)).join("")}
    </div>` : ""}

    <!-- Read-only career register (player_batting/pitching/fielding_stats), filled by
         loadRegister() below. RLS returns only this athlete's own rows. -->
    <div id="regWrap"></div>

    ${(() => { const ss = seasonStatsHTML(p.season_stats); return ss ? `<div class="kicker">${esc(t("p_k_season"))}</div><div class="card">${ss}</div>` : ""; })()}

    ${teams.length ? `<div class="kicker">${esc(t("p_k_teams"))}</div><div class="card">
      ${teams.map(t2 => `<div class="row"><span>${esc(t2)}</span></div>`).join("")}
    </div>` : ""}

    <p class="note" style="margin-top:16px">${t("p_help")}</p>`;

  loadRegister(p.id);
}

/* Read-only Baseball-Reference career register for the signed-in athlete. Mirrors the
   admin panel + public profile pages by reusing window.BBREF. RLS on the stats tables
   returns only this player's own rows (private.owns_stats_player). */
async function loadRegister(pid){
  const wrap = $("regWrap");
  if (!wrap || !pid || typeof BBREF === "undefined") return;
  try {
    const kinds = ["batting","pitching","fielding"];
    const data = {};
    for (const k of kinds){
      const { data: rows } = await SB.from(BBREF.TABLES[k]).select("*").eq("player_id", pid).order("year").order("sort_order").order("id");
      data[k] = rows || [];
    }
    const html = BBREF.renderAll(data);
    if (html){
      BBREF.injectCss();
      wrap.innerHTML = `<div class="kicker">${esc(t("p_k_register"))}</div><div class="card"><p class="ro-hint">${esc(t("p_stats_ro"))}</p>${html}</div>`;
    }
  } catch (err){ console.warn("Register load failed", err); }
}

function row(label, value){
  if (value === null || value === undefined || value === "") return "";
  return `<div class="row"><span>${esc(label)}</span><b>${esc(value)}</b></div>`;
}

/* Render self-entered per-season stats. Derived stats (AVG/OBP/SLG · ERA/WHIP ·
   Fld%) are computed here from the raw inputs, never stored. Shared shape with the
   register builder + the public roster modal. */
function seasonStatsHTML(seasonStats){
  const rows = Array.isArray(seasonStats) ? seasonStats : [];
  if (!rows.length) return "";
  const n = v => (v===null||v===undefined||v==="") ? null : (isFinite(Number(v)) ? Number(v) : null);
  const avg = x => (x===null||!isFinite(x)) ? "—" : x.toFixed(3).replace(/^0(?=\.)/,"");
  const two = x => (x===null||!isFinite(x)) ? "—" : x.toFixed(2);
  const META = {
    batting:{label:t("p_batting"),cols:["Season","Team","AB","H","HR","RBI","AVG","OBP","SLG"]},
    pitching:{label:t("p_pitching"),cols:["Season","Team","W","L","ERA","IP","SO","WHIP"]},
    fielding:{label:t("p_fielding"),cols:["Season","Team","G","E","FLD%"]},
  };
  function cell(r,c){
    switch(c){
      case "Season": return esc(r.season||"—");
      case "Team":   return esc(r.team||"—");
      case "AVG":  { const ab=n(r.AB),h=n(r.H); return avg(ab?(h||0)/ab:null); }
      case "OBP":  { const ab=n(r.AB),h=n(r.H),bb=n(r.BB)||0,d=(ab||0)+bb; return avg(d?((h||0)+bb)/d:null); }
      case "SLG":  { const ab=n(r.AB),h=n(r.H),d2=n(r["2B"])||0,t3=n(r["3B"])||0,hr=n(r.HR)||0,tb=(h||0)+d2+2*t3+3*hr; return avg(ab?tb/ab:null); }
      case "ERA":  { const er=n(r.ER),ip=n(r.IP); return two((ip&&er!==null)?9*er/ip:null); }
      case "WHIP": { const bb=n(r.BB)||0,h=n(r.H)||0,ip=n(r.IP); return two(ip?(bb+h)/ip:null); }
      case "FLD%": { const po=n(r.PO)||0,a=n(r.A)||0,e=n(r.E)||0,tc=po+a+e; return tc?avg((po+a)/tc):"—"; }
      default:     { const v=n(r[c]); return v===null?"—":esc(String(r[c])); }
    }
  }
  let out = "";
  for (const kind of ["batting","pitching","fielding"]){
    const list = rows.filter(r => r && r.kind === kind); if (!list.length) continue;
    const m = META[kind];
    out += `<div class="ss-block"><div class="ss-title">${esc(m.label)}</div><div class="ss-scroll"><table class="ss-table"><thead><tr>${m.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>` +
      list.map(r => `<tr>${m.cols.map(c=>`<td>${cell(r,c)}</td>`).join("")}</tr>`).join("") +
      `</tbody></table></div></div>`;
  }
  return out;
}
</script>
