<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Player Portal — Elite Sports Management</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png" />
<link rel="shortcut icon" href="../icons/icon-192.png" />
<meta name="theme-color" content="#081a33" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--navy:#081a33;--navy-2:#06142a;--gold:#d9b154;--gold-soft:#e7c878;--teal:#3a9aa6;--teal-soft:#5fb8c2;--ink:#eaf0fa;--muted:#9fb1cc;--line:rgba(217,177,84,.22);--card:#0c2143;--red:#e05d5d}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Hanken Grotesk',system-ui,sans-serif;background:var(--navy-2);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  .display{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:.01em;text-transform:uppercase}
  a{color:var(--gold-soft);text-decoration:none}
  .wrap{max-width:760px;margin:0 auto;padding:26px 22px 90px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:30px}
  .logo-img{height:40px;width:auto;display:block}
  header b{font-size:14px;display:block}
  header small{display:block;font-size:8.5px;letter-spacing:.3em;color:var(--gold-soft);font-weight:700}
  .spacer{flex:1}
  .btn{padding:11px 20px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;border:0;transition:.2s;display:inline-block}
  .btn-gold{background:var(--gold);color:#05101f}
  .btn-gold:hover{background:var(--gold-soft)}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold-soft)}
  .card{border:1px solid var(--line);border-radius:16px;padding:24px;background:linear-gradient(180deg,var(--card),rgba(8,26,51,.4));margin-bottom:16px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .field input,.field textarea,.field select{width:100%;background:rgba(6,20,42,.8);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);font-size:15px;font-family:inherit}
  .field input:focus,.field textarea:focus,.field select:focus{outline:0;border-color:var(--gold)}
  .field textarea{resize:vertical}
  .btn-gold[disabled],.btn[disabled]{opacity:.55;cursor:wait}
  .linklike{background:none;border:0;color:var(--gold-soft);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;padding:4px}
  .linklike:hover{color:var(--gold)}
  .msg{display:none;margin-top:12px;font-size:13.5px;color:var(--red)}
  .msg.show{display:block}
  .msg.ok{color:var(--teal-soft)}
  .kicker{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--teal-soft);margin:26px 0 12px}
  .p-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .avatar{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;font-family:'Anton';color:var(--gold);font-size:20px;background-size:cover;background-position:center;flex:0 0 auto}
  .p-head h2{font-size:24px}
  .pos{color:var(--muted);font-size:14px}
  .chip{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--gold-soft)}
  .chip.approved{color:var(--teal-soft)}
  .chip.pending{color:var(--gold-soft)}
  .chip.rejected{color:var(--red)}
  .row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid rgba(217,177,84,.12);font-size:15px}
  .row:last-child{border-bottom:0}
  .row span{color:var(--muted)}
  .row b{font-weight:600;text-align:right}
  .note{font-size:13.5px;color:var(--muted);margin-top:6px}
  .empty{color:var(--muted);text-align:center;padding:30px 10px}
  #booting,#loginBox,#app{display:none}
  @media(max-width:560px){ input{font-size:16px} .wrap{padding:18px 14px 80px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="../index.html"><img class="logo-img" src="../logo.png" alt="Elite Sports Management" /></a>
    <div><b>Elite Sports Management</b><small>PLAYER PORTAL</small></div>
    <div class="spacer"></div>
    <button class="btn btn-ghost" id="signOut" style="display:none">Sign out</button>
  </header>

  <div id="booting" class="card" style="max-width:420px;margin:8vh auto;text-align:center;color:var(--muted)">Checking session…</div>

  <!-- LOGIN -->
  <div id="loginBox" class="card" style="max-width:420px;margin:8vh auto">
    <h2 class="display" style="font-size:22px;margin-bottom:6px">Player <em style="color:var(--gold);font-style:normal">Portal</em></h2>
    <p class="note" style="margin-bottom:18px">Sign in with the email &amp; password you created at registration.</p>
    <form id="pwForm">
      <div class="field"><label for="email">Email</label><input type="email" id="email" autocomplete="username" required placeholder="you@email.com" /></div>
      <div class="field"><label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required /></div>
      <button class="btn btn-gold" style="width:100%" type="submit">Sign in</button>
      <div class="msg" id="loginMsg" role="alert" aria-live="assertive"></div>
    </form>
    <div style="text-align:center;margin-top:12px"><button type="button" id="forgotBtn" class="linklike">Forgot your password?</button></div>
    <div style="text-align:center;margin:14px 0 4px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)">or</div>
    <button class="btn btn-ghost" style="width:100%" type="button" id="magicBtn">Email me a sign-in link</button>
    <p class="note" style="margin-top:16px">
      New here? <a href="../register/">Create an account</a>.
      Applied the old way? Use the sign-in link with your application email.
    </p>
  </div>

  <!-- RESET PASSWORD (shown when arriving from a reset email) -->
  <div id="resetBox" class="card" style="max-width:420px;margin:8vh auto;display:none">
    <h2 class="display" style="font-size:22px;margin-bottom:6px">Set a new <em style="color:var(--gold);font-style:normal">password</em></h2>
    <p class="note" style="margin-bottom:18px">Choose a new password for your account.</p>
    <form id="resetForm">
      <div class="field"><label for="newpass">New password</label><input type="password" id="newpass" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters" /></div>
      <button class="btn btn-gold" style="width:100%" type="submit">Update password</button>
      <div class="msg" id="resetMsg" role="alert" aria-live="assertive"></div>
    </form>
  </div>

  <!-- STATUS (pending / rejected / archived) -->
  <div id="statusBox" class="card" style="max-width:460px;margin:8vh auto;display:none"></div>

  <!-- APP -->
  <div id="app">
    <div id="profile"></div>
  </div>
</div>

<script type="module">
const SUPABASE_URL = "https://sbexwyvsgqayxrsrlrpm.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNiZXh3eXZzZ3FheXhyc3JscnBtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NjY5NTYsImV4cCI6MjA5NjA0Mjk1Nn0.PWBwZ0oEYvQeA_ZMdahRA9cVqQv27fwN-1npU1XqTdw";
const PHOTO_BUCKET = "player-photos";

import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const SB = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials = n => (n||"?").split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();

function showView(state){
  $("booting").style.display   = state === "booting" ? "block" : "none";
  $("loginBox").style.display  = state === "login"   ? "block" : "none";
  $("resetBox").style.display  = state === "reset"   ? "block" : "none";
  $("statusBox").style.display = state === "status"  ? "block" : "none";
  $("app").style.display       = state === "app"     ? "block" : "none";
  $("signOut").style.display   = (state === "app" || state === "status") ? "" : "none";
}
showView("booting");

/* True while handling a password-reset link, so the normal session routing
   doesn't whisk the user past the "set new password" form. */
let RECOVERING = location.hash.includes("type=recovery");

/* Password sign-in — the account created at registration. */
$("pwForm").addEventListener("submit", async e => {
  e.preventDefault();
  const m = $("loginMsg"); m.classList.remove("show","ok");
  const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true;
  const { error } = await SB.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  btn.disabled = false;
  if (error){ m.textContent = error.message; m.classList.add("show"); $("password").value = ""; return; }
  // onAuthStateChange("SIGNED_IN") runs gate().
});

/* Magic-link fallback (legacy applicants who never set a password). */
$("magicBtn").onclick = async () => {
  const m = $("loginMsg"); m.classList.remove("show","ok");
  const email = $("email").value.trim();
  if (!email){ m.textContent = "Enter your email first."; m.classList.add("show"); $("email").focus(); return; }
  const btn = $("magicBtn"); btn.disabled = true; btn.textContent = "Sending…";
  const { error } = await SB.auth.signInWithOtp({ email, options: { emailRedirectTo: location.href.split("#")[0] } });
  btn.disabled = false; btn.textContent = "Email me a sign-in link";
  if (error){ m.textContent = error.message; m.classList.add("show"); return; }
  m.textContent = "Check your inbox — we sent you a sign-in link.";
  m.classList.add("show","ok");
};

$("signOut").onclick = async () => { await SB.auth.signOut(); };

/* Forgot password → email a reset link back to this page. */
$("forgotBtn").onclick = async () => {
  const m = $("loginMsg"); m.classList.remove("show","ok");
  const email = $("email").value.trim();
  if (!email){ m.textContent = "Enter your email first, then tap “Forgot your password?”."; m.classList.add("show"); $("email").focus(); return; }
  const btn = $("forgotBtn"); btn.disabled = true; btn.textContent = "Sending…";
  const { error } = await SB.auth.resetPasswordForEmail(email, { redirectTo: location.href.split("#")[0] });
  btn.disabled = false; btn.textContent = "Forgot your password?";
  if (error){ m.textContent = error.message; m.classList.add("show"); return; }
  m.textContent = "Check your inbox — we sent a link to reset your password.";
  m.classList.add("show","ok");
};

/* Set a new password after following the reset link. */
$("resetForm").addEventListener("submit", async e => {
  e.preventDefault();
  const m = $("resetMsg"); m.classList.remove("show","ok");
  const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true;
  const { error } = await SB.auth.updateUser({ password: $("newpass").value });
  btn.disabled = false;
  if (error){ m.textContent = error.message; m.classList.add("show"); return; }
  RECOVERING = false;
  m.textContent = "Password updated — signing you in…"; m.classList.add("show","ok");
  const { data: { session } } = await SB.auth.getSession();
  if (session) gate(session); else showView("login");
});

/* Professional, non-technical status screens for unapproved accounts. */
const STATUS_COPY = {
  pending: {
    icon: "⏳", title: "Almost there",
    body: "Your registration has been received and we're verifying your payment. Your player portal unlocks automatically as soon as Elite Sports Management approves your account — there's nothing more you need to do. We'll email you the moment it's ready.",
  },
  rejected: {
    icon: "✉️", title: "Let's talk",
    body: "We're not able to activate your account right now. If you think this is a mistake or you'd like to know more, please reach out and we'll be glad to help.",
  },
  archived: {
    icon: "📁", title: "Account archived",
    body: "Your account is currently archived and access is paused. Contact us any time to reactivate it.",
  },
};
function showStatus(status){
  const c = STATUS_COPY[status] || STATUS_COPY.pending;
  $("statusBox").innerHTML = `
    <div style="text-align:center">
      <div style="font-size:40px;margin-bottom:10px">${c.icon}</div>
      <h2 class="display" style="font-size:22px;margin-bottom:10px">${esc(c.title)}</h2>
      <p class="note" style="font-size:14.5px;line-height:1.6">${esc(c.body)}</p>
      <p class="note" style="margin-top:18px">Questions? <a href="mailto:elitesportsmanagement50@gmail.com?subject=My%20ESM%20account">Email us</a>.</p>
    </div>`;
  showView("status");
}

/* Decide what a signed-in user sees: their own approved profile, a status
   screen, a nudge to the scout portal, or (legacy) an email-matched profile. */
async function gate(session){
  if (RECOVERING){ showView("reset"); return; }   // let them finish setting a new password
  const user = session?.user; if (!user){ showView("login"); return; }
  const { data: prof } = await SB.from("profiles").select("role,account_status").eq("id", user.id).maybeSingle();
  if (prof){
    if (prof.role === "scout"){
      $("statusBox").innerHTML = `
        <div style="text-align:center">
          <div style="font-size:40px;margin-bottom:10px">🔎</div>
          <h2 class="display" style="font-size:22px;margin-bottom:10px">You're a scout account</h2>
          <p class="note" style="font-size:14.5px">This is the player portal. Head to the <a href="../scout/">Scout Portal</a> to view the roster.</p>
        </div>`;
      showView("status");
      return;
    }
    if (prof.account_status !== "approved"){ showStatus(prof.account_status); return; }
  }
  // Approved player, or a legacy applicant with no profiles row → show the profile.
  ME_SESSION = session; showView("app"); loadMe(session);
}

let ME_SESSION = null;   // kept so the edit form knows the user's id (photo path) + email
SB.auth.onAuthStateChange((evt, session) => {
  if (evt === "PASSWORD_RECOVERY"){ RECOVERING = true; showView("reset"); }
  else if (evt === "SIGNED_IN" && session) { ME_SESSION = session; gate(session); }
  else if (evt === "SIGNED_OUT") { ME_SESSION = null; showView("login"); }
});

(async function guard(){
  try {
    const { data: { session } } = await SB.auth.getSession();
    if (session){ ME_SESSION = session; gate(session); } else { showView("login"); }
  } catch (err) {
    console.error("Session check failed", err);
    showView("login");
  }
})();

/* View-only. RLS only returns the row whose `email` matches the signed-in user,
   so an athlete physically cannot read anyone else's profile — this isn't just a
   UI restriction. Editing is deliberately not offered: the agency owns the stats. */
async function loadMe(session){
  const email = session?.user?.email || "";
  $("profile").innerHTML = `<div class="card empty">Loading your profile…</div>`;
  const { data, error } = await SB.from("players").select("*").eq("email", email).limit(1);

  if (error){
    $("profile").innerHTML = `<div class="card empty">Couldn't load your profile.<br><small>${esc(error.message)}</small></div>`;
    return;
  }
  const p = (data || [])[0];
  if (!p){
    $("profile").innerHTML = `<div class="card empty">
      <p>No athlete profile found for <b>${esc(email)}</b>.</p>
      <p class="note" style="margin-top:10px">If you applied with a different email, sign out and use that one.
      Otherwise <a href="../index.html#join">submit an application</a>.</p>
    </div>`;
    return;
  }

  const teams = Array.isArray(p.teams) ? p.teams : [];
  const stats = Array.isArray(p.stats) ? p.stats : [];
  const statusNote = {
    pending:  "Your application is with Samuele for review. You'll hear from us soon.",
    approved: "You're live on the ESM roster.",
    rejected: "This profile isn't currently shown on the roster. Reach out if you think that's wrong.",
  }[p.status] || "";

  $("profile").innerHTML = `
    <div class="card">
      <div class="p-head">
        <span class="avatar" ${p.image_url ? `style="background-image:url('${esc(p.image_url)}')"` : ""}>${p.image_url ? "" : esc(initials(p.name))}</span>
        <div style="flex:1">
          <h2 class="display">${esc(p.name)}</h2>
          <div class="pos">${esc(p.position || p.group || "")} ${p.flag || ""}</div>
        </div>
        <span class="chip ${esc(p.status)}">${esc(p.status)}</span>
      </div>
      ${statusNote ? `<p class="note">${statusNote}</p>` : ""}
    </div>

    ${p.bio ? `<div class="kicker">Bio</div><div class="card"><p>${esc(p.bio)}</p></div>` : ""}

    <div class="kicker">Details</div>
    <div class="card">
      ${row("Sport", p.sport)}
      ${row("Position", p.position)}
      ${row("Country", p.country)}
      ${row("Age", p.age)}
      ${row("Email", p.email)}
      ${row("Instagram", p.instagram)}
      ${row("Applying for", p.applying_for)}
    </div>

    ${stats.length ? `<div class="kicker">Career highlights</div><div class="card">
      ${stats.map(s => row(s.label, s.value)).join("")}
    </div>` : ""}

    ${teams.length ? `<div class="kicker">Teams &amp; affiliations</div><div class="card">
      ${teams.map(t => `<div class="row"><span>${esc(t)}</span></div>`).join("")}
    </div>` : ""}

    <div class="kicker">Edit my details</div>
    <div class="card">
      <p class="note" style="margin-bottom:16px">Update your own bio, contact details and photo below. Your
      career stats, position and roster status are managed by Elite Sports Management.</p>
      <div class="field"><label for="me-photo">Profile photo</label><input type="file" accept="image/*" id="me-photo" /></div>
      <div class="field"><label for="me-bio">Bio</label><textarea id="me-bio" rows="4" placeholder="Tell your story…">${esc(p.bio || "")}</textarea></div>
      <div class="field"><label for="me-instagram">Instagram</label><input id="me-instagram" value="${esc(p.instagram || "")}" placeholder="@yourhandle" /></div>
      <div class="field"><label for="me-phone">Phone</label><input id="me-phone" value="${esc(p.phone || "")}" placeholder="+39 …" /></div>
      <div class="field"><label for="me-age">Age</label><input id="me-age" inputmode="numeric" value="${esc(p.age || "")}" placeholder="e.g. 21" /></div>
      <button class="btn btn-gold" style="width:100%" type="button" id="me-save">Save my changes</button>
      <div class="msg" id="me-msg" role="alert" aria-live="assertive"></div>
    </div>

    <p class="note" style="margin-top:16px">
      Need a stat or your position updated? <a href="mailto:elitesportsmanagement50@gmail.com?subject=Profile%20update%20request">Email us</a>.
    </p>`;

  bindEditor();
}

/* Self-service edit. Writes go through the update_my_profile() RPC, which only
   touches this athlete's own row and only the whitelisted columns — the browser
   never gets to name a table, a row, or a status. */
function bindEditor(){
  const save = $("me-save"); if (!save) return;
  save.onclick = async () => {
    const m = $("me-msg"); m.classList.remove("show","ok");
    save.disabled = true; save.textContent = "Saving…";
    try {
      let image_url = null;
      const file = $("me-photo").files?.[0];
      if (file){
        const uid = ME_SESSION?.user?.id;
        if (!uid) throw new Error("Session expired — please sign in again.");
        const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g,"") || "jpg";
        const path = `self/${uid}/${Date.now()}.${ext}`;
        const { error: upErr } = await SB.storage.from(PHOTO_BUCKET)
          .upload(path, file, { upsert: true, contentType: file.type || "image/jpeg" });
        if (upErr) throw upErr;
        image_url = SB.storage.from(PHOTO_BUCKET).getPublicUrl(path).data.publicUrl;
      }
      const { error } = await SB.rpc("update_my_profile", {
        p_bio:       $("me-bio").value.trim(),
        p_instagram: $("me-instagram").value.trim(),
        p_phone:     $("me-phone").value.trim(),
        p_age:       $("me-age").value.trim(),
        p_image_url: image_url,   // null → keep current photo
      });
      if (error) throw error;
      m.textContent = "Saved ✓"; m.classList.add("show","ok");
      loadMe(ME_SESSION);   // re-render with fresh data (incl. new photo)
    } catch (err){
      m.textContent = "Couldn't save: " + (err?.message || err); m.classList.add("show");
    } finally {
      save.disabled = false; save.textContent = "Save my changes";
    }
  };
}

function row(label, value){
  if (value === null || value === undefined || value === "") return "";
  return `<div class="row"><span>${esc(label)}</span><b>${esc(value)}</b></div>`;
}
</script>
</body>
</html>
