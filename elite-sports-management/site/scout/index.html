  header small{display:block;font-size:8.5px;letter-spacing:.3em;color:var(--gold-soft);font-weight:700}

  .btn-gold{background:var(--gold);color:#05101f}.btn-gold:hover{background:var(--gold-soft)}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn-ghost:hover{border-color:var(--gold);color:var(--gold-soft)}
  .btn[disabled]{opacity:.55;cursor:wait}
  .linklike{background:none;border:0;color:var(--gold-soft);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;padding:4px}
  .linklike:hover{color:var(--gold)}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .field input{width:100%;background:rgba(6,20,42,.8);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);font-size:15px;font-family:inherit}
  .field input:focus{outline:0;border-color:var(--gold)}
  .msg{display:none;margin-top:12px;font-size:13.5px;color:var(--red)}
  .msg.show{display:block}.msg.ok{color:var(--teal-soft)}
  .note{font-size:13px;color:var(--muted);margin-top:16px}
  h1.display{font-size:24px}h1.display em{color:var(--gold);font-style:normal}
  .toolbar{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .toolbar input{flex:1;min-width:180px;background:rgba(6,20,42,.8);border:1px solid var(--line);border-radius:999px;padding:11px 16px;color:var(--ink);font-size:15px;font-family:inherit}
  .toolbar input:focus{outline:0;border-color:var(--gold)}
  .count{font-size:13px;color:var(--muted)}
  .p-head{display:flex;align-items:center;gap:14px}
  .avatar{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;font-family:'Anton';color:var(--gold);font-size:18px;background-size:cover;background-position:center;flex:0 0 auto}

  .pos{color:var(--muted);font-size:13.5px}
  .contact{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .contact a,.contact span{font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--ink);background:rgba(6,20,42,.5)}
  .contact a:hover{border-color:var(--gold);color:var(--gold-soft)}
  .bio{color:var(--muted);font-size:14px;margin-top:12px}
  .stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .stat{font-size:12.5px;color:var(--ink);background:rgba(217,177,84,.08);border:1px solid var(--line);border-radius:8px;padding:6px 10px}

  <!-- LOGIN -->

      <div class="field"><label for="password" data-i18n="s_password">Password</label><input type="password" id="password" autocomplete="current-password" required /></div>
      <button class="btn btn-gold" style="width:100%" type="submit" data-i18n="s_signin">Sign in</button>
      <div class="msg" id="loginMsg" role="alert" aria-live="assertive"></div>
    </form>
    <div style="text-align:center;margin-top:12px"><button type="button" id="forgotBtn" class="linklike" data-i18n="s_forgot">Forgot your password?</button></div>
    <div style="text-align:center;margin:14px 0 4px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)" data-i18n="s_or">or</div>
    <button class="btn btn-ghost" style="width:100%" type="button" id="magicBtn" data-i18n="s_magic">Email me a sign-in link</button>
    <p class="note" style="margin-top:16px" data-i18n-html="s_login_new">New here? <a href="../register/">Create a scout account</a>.</p>
  </div>

  <!-- RESET PASSWORD -->
  <div id="resetBox" class="card" style="max-width:420px;margin:8vh auto">
    <h1 class="display" style="margin-bottom:6px" data-i18n-html="s_reset_h">Set a new <em>password</em></h1>
    <p class="note" style="margin:0 0 18px" data-i18n="s_reset_note">Choose a new password for your account.</p>
    <form id="resetForm">
      <div class="field"><label for="newpass" data-i18n="s_newpass">New password</label><input type="password" id="newpass" autocomplete="new-password" minlength="8" required data-i18n-ph="s_newpass_ph" placeholder="At least 8 characters" /></div>
      <button class="btn btn-gold" style="width:100%" type="submit" data-i18n="s_update_pw">Update password</button>
      <div class="msg" id="resetMsg" role="alert" aria-live="assertive"></div>
    </form>
  </div>

  <!-- STATUS -->
  <div id="statusBox" class="card" style="max-width:460px;margin:8vh auto"></div>

  <!-- APP (roster) -->
  <div id="app">
    <h1 class="display" style="margin-bottom:14px" data-i18n-html="s_roster_h">Roster <em>— Scout Access</em></h1>
    <div class="toolbar">
      <input id="search" type="search" data-i18n-ph="s_search_ph" placeholder="Search by name, position or country…" aria-label="Search roster" />
      <span class="count" id="count"></span>
    </div>
    <div id="roster"></div>
  </div>
</div>

const SUPPORTED = ["en","es","it"];
let lang = (()=>{ try{ const l = localStorage.getItem("esm_lang"); return SUPPORTED.includes(l) ? l : "en"; }catch(e){ return "en"; } })();
const t = k => (DICT[lang] && DICT[lang][k]) || DICT.en[k] || k;

function applyStatic(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.getAttribute("data-i18n-html")); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.setAttribute("placeholder", t(el.getAttribute("data-i18n-ph"))); });
  document.querySelectorAll("#langsw button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
}
function setLang(l){
  if (!SUPPORTED.includes(l) || l === lang){ document.querySelectorAll("#langsw button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang)); return; }
  lang = l; try{ localStorage.setItem("esm_lang", l); }catch(e){}
  applyStatic();
  // Re-render whichever dynamic view is on screen.
  if (CUR.view === "status") showStatus(CUR.kind, CUR.link);
  else if (CUR.view === "app") render();
}

function showView(state){
  ["booting","loginBox","resetBox","statusBox","app"].forEach(v => $(v).style.display = "none");
  $({booting:"booting",login:"loginBox",reset:"resetBox",status:"statusBox",app:"app"}[state]).style.display = "block";
  $("signOut").style.display = (state === "app" || state === "status") ? "" : "none";
}
applyStatic();
showView("booting");
let RECOVERING = location.hash.includes("type=recovery");

$("pwForm").addEventListener("submit", async e => {
  e.preventDefault();
  const m = $("loginMsg"); m.classList.remove("show","ok");
  const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true;
  const { error } = await SB.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  btn.disabled = false;
  if (error){ m.textContent = error.message; m.classList.add("show"); $("password").value = ""; return; }
});
$("magicBtn").onclick = async () => {
  const m = $("loginMsg"); m.classList.remove("show","ok");
  const email = $("email").value.trim();
  if (!email){ m.textContent = t("s_enter_email"); m.classList.add("show"); $("email").focus(); return; }
  const btn = $("magicBtn"); btn.disabled = true; btn.textContent = t("s_sending");
  const { error } = await SB.auth.signInWithOtp({ email, options: { emailRedirectTo: location.href.split("#")[0] } });
  btn.disabled = false; btn.textContent = t("s_magic");
  if (error){ m.textContent = error.message; m.classList.add("show"); return; }
  m.textContent = t("s_magic_sent"); m.classList.add("show","ok");
};
$("signOut").onclick = async () => { await SB.auth.signOut(); };

$("forgotBtn").onclick = async () => {
  const m = $("loginMsg"); m.classList.remove("show","ok");
  const email = $("email").value.trim();
  if (!email){ m.textContent = t("s_forgot_enter"); m.classList.add("show"); $("email").focus(); return; }
  const btn = $("forgotBtn"); btn.disabled = true; btn.textContent = t("s_sending");
  const { error } = await SB.auth.resetPasswordForEmail(email, { redirectTo: location.href.split("#")[0] });
  btn.disabled = false; btn.textContent = t("s_forgot");
  if (error){ m.textContent = error.message; m.classList.add("show"); return; }
  m.textContent = t("s_reset_sent"); m.classList.add("show","ok");
};
$("resetForm").addEventListener("submit", async e => {
  e.preventDefault();
  const m = $("resetMsg"); m.classList.remove("show","ok");
  const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true;
  const { error } = await SB.auth.updateUser({ password: $("newpass").value });
  btn.disabled = false;
  if (error){ m.textContent = error.message; m.classList.add("show"); return; }
  RECOVERING = false;
  m.textContent = t("s_pw_updated"); m.classList.add("show","ok");
  const { data: { session } } = await SB.auth.getSession();
  if (session) gate(session); else showView("login");
});

/* Non-approved states. A pending scout may just not have paid — show clear payment
   instructions (same €49.99 roster access; Stripe link coming soon) plus a direct line to
   Sam, never a dead-end. Roster access is unlocked only after Sam confirms payment. */
function showStatus(kind, link){
  CUR = { view:"status", kind, link };
  const icons = { pending:"⏳", rejected:"✉️", archived:"📁", notscout:"⚾", none:"🔎" };
  const key = icons[kind] ? kind : "pending";
  const payHtml = key === "pending" ? `
    <p class="note" style="margin-top:12px">${esc(t("s_pay_hint"))}</p>` : "";
  $("statusBox").innerHTML = `<div class="center">
    <div style="font-size:40px;margin-bottom:10px">${icons[key]}</div>
    <h2 class="display" style="font-size:22px;margin-bottom:10px">${esc(t("s_st_"+key+"_t"))}</h2>
    <p class="note" style="font-size:14.5px;line-height:1.6">${esc(t("s_st_"+key+"_b"))}</p>
    ${payHtml}
    ${link || ""}
    <p class="note" style="margin-top:18px">${esc(t("s_questions"))} <a href="mailto:${CONTACT_EMAIL}?subject=Scout%20account">${esc(t("s_email_us"))}</a>.</p>
  </div>`;
  showView("status");
}

async function gate(session){
  if (RECOVERING){ showView("reset"); return; }
  const user = session?.user; if (!user){ showView("login"); return; }
  const { data: prof } = await SB.from("profiles").select("role,account_status").eq("id", user.id).maybeSingle();
  if (!prof){ showStatus("none", `<p class="note" style="margin-top:14px"><a class="btn btn-gold" href="../register/">${esc(t("s_go_register"))}</a></p>`); return; }
  if (prof.role !== "scout"){ showStatus("notscout", `<p class="note" style="margin-top:14px"><a class="btn btn-gold" href="../portal/">${esc(t("s_go_player"))}</a></p>`); return; }
  if (prof.account_status !== "approved"){ showStatus(prof.account_status); return; }
  CUR = { view:"app", kind:null, link:null };
  showView("app"); loadRoster();
}

SB.auth.onAuthStateChange((evt, session) => {
  if (evt === "PASSWORD_RECOVERY"){ RECOVERING = true; showView("reset"); }
  else if (evt === "SIGNED_IN" && session) { gate(session); }
  else if (evt === "SIGNED_OUT") { showView("login"); }
});
(async function guard(){
  try { const { data:{ session } } = await SB.auth.getSession(); session ? gate(session) : showView("login"); }
  catch (err){ console.error(err); showView("login"); }
})();

/* Elevated roster — scout_roster() returns rows ONLY for approved scouts (it checks
   private.is_approved_scout() in the DB, so an unapproved scout gets nothing even if they
   call the RPC directly). Full career-register stats are read separately per the public
   "approved stats" RLS (the same data shown on public profile pages). */
let ROSTER = [], STATS = {};
async function loadStats(){
  STATS = {};
  for (const k of ["batting","pitching","fielding"]){
    if (typeof BBREF === "undefined") break;
    const { data } = await SB.from(BBREF.TABLES[k]).select("*").order("year").order("sort_order").order("id");
    (data || []).forEach(r => { (STATS[r.player_id] = STATS[r.player_id] || {batting:[],pitching:[],fielding:[]})[k].push(r); });
  }
}
async function loadRoster(){
  $("roster").innerHTML = `<div class="card" style="color:var(--muted)">${esc(t("s_loading"))}</div>`;
  const rosterP = SB.rpc("scout_roster");
  await loadStats();
  const { data, error } = await rosterP;
  if (error){ $("roster").innerHTML = `<div class="card">${esc(t("s_load_fail"))}<br><small>${esc(error.message)}</small></div>`; return; }
  if (typeof BBREF !== "undefined") BBREF.injectCss();
  ROSTER = data || [];
  render();
}
$("search").addEventListener("input", render);

function render(){
  const q = $("search").value.trim().toLowerCase();
  const rows = ROSTER.filter(p => !q ||
    [p.name, p.position, p.group, p.country, p.sport].some(v => String(v||"").toLowerCase().includes(q)));
  $("count").textContent = `${rows.length} ${rows.length===1 ? t("s_count_one") : t("s_count_many")}`;
  $("roster").innerHTML = rows.length ? rows.map(card).join("")
    : `<div class="card" style="color:var(--muted)">${esc(t("s_no_match"))} “${esc(q)}”.</div>`;
}

function card(p){
  const stats = Array.isArray(p.stats) ? p.stats : [];
  const teams = Array.isArray(p.teams) ? p.teams : [];
  const contact = [
    p.email ? `<a href="mailto:${esc(p.email)}">✉️ ${esc(p.email)}</a>` : "",
    p.phone ? `<a href="tel:${esc(String(p.phone).replace(/[^+0-9]/g,''))}">📞 ${esc(p.phone)}</a>` : "",
    p.instagram ? `<a href="https://instagram.com/${esc(String(p.instagram).replace(/^@/,''))}" target="_blank" rel="noopener">📷 ${esc(p.instagram)}</a>` : "",
    p.age ? `<span>${esc(t("s_age"))} ${esc(p.age)}</span>` : "",
  ].filter(Boolean).join("");
  // Read-only career register (batting/pitching/fielding), same renderer as admin/public.
  const reg = (typeof BBREF !== "undefined" && STATS[p.id]) ? BBREF.renderAll(STATS[p.id]) : "";
  return `<div class="card">
    <div class="p-head">
      <span class="avatar" ${p.image_url ? `style="background-image:url('${esc(p.image_url)}')"` : ""}>${p.image_url ? "" : esc(initials(p.name))}</span>
      <div style="flex:1">
        <h3 class="display">${esc(p.name)}</h3>
        <div class="pos">${esc(p.position || p.group || "")} ${flagImg(iso2For(p))} ${(()=>{const dn=displayCountry(p);return dn?"· "+esc(dn):"";})()} · ${esc(p.sport || "Baseball")}</div>
      </div>
    </div>
    ${contact ? `<div class="contact">${contact}</div>` : ""}
    ${p.bio ? `<div class="bio">${esc(p.bio)}</div>` : ""}
    ${stats.length ? `<div class="stats">${stats.map(s => `<span class="stat"><b>${esc(s.label)}:</b> ${esc(s.value)}</span>`).join("")}</div>` : ""}
    ${teams.length ? `<div class="teams"><b>${esc(t("s_teams"))}:</b> ${teams.map(esc).join(" · ")}</div>` : ""}
    ${reg ? `<div class="reg-kicker">${esc(t("s_reg_title"))}</div>${reg}` : ""}
  </div>`;
}
</script>
