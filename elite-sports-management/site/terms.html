<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Terms & Conditions — Elite Sports Management</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--navy-2:#06142a;--gold:#d9b154;--gold-soft:#e7c878;--ink:#eaf0fa;--muted:#9fb1cc;--line:rgba(217,177,84,.22);--card:#0c2143}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Hanken Grotesk',system-ui,sans-serif;background:var(--navy-2);color:var(--ink);line-height:1.65}
  .wrap{max-width:760px;margin:0 auto;padding:26px 18px 90px}
  header{display:flex;align-items:center;gap:14px;margin-bottom:8px}
  header img{height:38px;width:auto}
  .kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
  h1{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.02em;font-size:clamp(28px,6vw,44px);margin:14px 0 6px}
  .langsw{margin-left:auto;display:flex;gap:6px}
  .langsw button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;font-family:inherit}
  .langsw button.on{background:var(--gold);color:#05101f;border-color:var(--gold)}
  .card{border:1px solid var(--line);border-radius:18px;padding:26px 24px;background:linear-gradient(180deg,var(--card),var(--navy-2));margin-top:22px}
  .tc-body{font-size:15.5px;color:#d6e1f2;white-space:pre-line}
  .muted{color:var(--muted);font-size:13.5px;margin-top:20px}
  a{color:var(--gold-soft)}
  .back{display:inline-block;margin-top:26px;font-weight:700;color:var(--gold-soft);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="index.html"><img src="logo.png" alt="Elite Sports Management" /></a>
    <div class="langsw" id="langsw" role="group" aria-label="Language">
      <button data-l="en" type="button">EN</button><button data-l="es" type="button">ES</button><button data-l="it" type="button">IT</button>
    </div>
  </header>
  <div class="kicker" data-i18n="tc_kicker">Legal</div>
  <h1 data-i18n="tc_h1">Terms &amp; Conditions</h1>

  <div class="card">
    <!-- ▼▼▼ SINGLE SOURCE OF THE TERMS TEXT ▼▼▼
         PLACEHOLDER until Sam provides the real Terms & Conditions. To go live with
         the real terms, replace the tc_body strings in DICT below (EN/ES/IT) with the
         final text — this is the ONLY place the T&C copy lives. Every "Read more" link
         across the site points here, so this one edit updates the whole site. -->
    <div class="tc-body" data-i18n="tc_body"></div>
    <p class="muted" data-i18n="tc_contact"></p>
  </div>

  <a class="back" href="index.html" data-i18n="tc_back">← Back to Elite Sports Management</a>
</div>

<script>
/* Trilingual, sharing the site-wide `esm_lang` localStorage key. */
const DICT = {
  en:{
    tc_kicker:"Legal", tc_h1:"Terms & Conditions",
    tc_body:"Terms and conditions text coming soon. Please check back later, or contact us with any questions before signing up.",
    tc_contact:"Questions? Email elitesportsmanagement50@gmail.com.",
    tc_back:"← Back to Elite Sports Management",
  },
  es:{
    tc_kicker:"Legal", tc_h1:"Términos y Condiciones",
    tc_body:"El texto de términos y condiciones estará disponible próximamente. Vuelve más tarde o contáctanos con cualquier duda antes de registrarte.",
    tc_contact:"¿Preguntas? Escribe a elitesportsmanagement50@gmail.com.",
    tc_back:"← Volver a Elite Sports Management",
  },
  it:{
    tc_kicker:"Legale", tc_h1:"Termini e Condizioni",
    tc_body:"Il testo dei termini e condizioni sarà disponibile a breve. Torna più tardi o contattaci per qualsiasi domanda prima di registrarti.",
    tc_contact:"Domande? Scrivi a elitesportsmanagement50@gmail.com.",
    tc_back:"← Torna a Elite Sports Management",
  },
};
const SUPPORTED = ["en","es","it"];
let lang = (()=>{ try{ const l = localStorage.getItem("esm_lang"); return SUPPORTED.includes(l)?l:"en"; }catch(e){ return "en"; } })();
const t = k => (DICT[lang]&&DICT[lang][k]) || DICT.en[k] || k;
function apply(){
  document.documentElement.lang = lang;
  document.title = t("tc_h1") + " — Elite Sports Management";
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.getAttribute("data-i18n")));
  document.querySelectorAll("#langsw button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
}
document.querySelectorAll("#langsw button").forEach(b => b.onclick = () => {
  lang = b.dataset.l; try{ localStorage.setItem("esm_lang", lang); }catch(e){} apply();
});
apply();
</script>
<script src="/esm-legal.js"></script>
</body>
</html>
